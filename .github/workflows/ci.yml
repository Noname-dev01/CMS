name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 브라우저 시험(@Tag("browser"))은 browser-test job이 병렬로 돌린다 — 이 job은 Playwright 설치도 하지 않는다.
      - name: Run tests
        run: ./gradlew test -PbrowserTests=exclude
        env:
          SPRING_PROFILES_ACTIVE: dev

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 14

  # 브라우저 E2E 시험(BrowserTestSupport 상속 클래스, @Tag("browser")). test job과 병렬로 돌아 PR 대기 시간을 줄인다.
  # 머지 차단은 브랜치 보호의 필수 체크에 이 job을 등록해야 성립한다(docs/branching.md).
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Playwright --with-deps가 apt로 받는 폰트 deb를 캐시로 재사용한다(이슈 #283 — 느린 apt 미러에서 폰트 21.9MB에 3분 안팎이 걸렸다).
      # 캐시는 신뢰하지 않는다: scripts/ci/playwright-apt-cache.sh가 apt 색인의 해시·후보 버전과 대조한 것만 apt가 쓰는 이름으로 넣는다.
      # 캐시 단계는 최적화일 뿐이라 모두 continue-on-error다 — 실패하면 지금처럼 미러에서 받는다(필수 체크를 떨어뜨리지 않는다).
      # 계획: adversarial-review/plan/PLAN-ci-playwright-apt-cache.md
      - name: Compute apt cache key
        id: apt-key
        continue-on-error: true
        run: |
          . /etc/os-release
          test -n "${ID:-}" && test -n "${VERSION_ID:-}"
          echo "prefix=playwright-apt-${ID}-${VERSION_ID}-" >> "$GITHUB_OUTPUT"
          echo "러너 이미지 ${ImageOS:-?} ${ImageVersion:-?} / $(apt-get --version | head -1) / $(dpkg --version | head -1)"

      - name: Restore apt cache
        if: steps.apt-key.outputs.prefix != ''
        uses: actions/cache/restore@v6
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: .ci-apt-cache
          key: ${{ steps.apt-key.outputs.prefix }}restore
          restore-keys: ${{ steps.apt-key.outputs.prefix }}

      - name: Stage cached apt packages
        timeout-minutes: 5
        continue-on-error: true
        run: bash scripts/ci/playwright-apt-cache.sh stage

      # 브라우저 시험(Playwright)이 쓰는 Chromium과 시스템 의존성을 미리 설치한다 — 시험 안에서 설치하면 apt 권한 없이 실패할 수 있다.
      # 시간 제한: 관측 최악(캐시 없음 + 느린 미러) 4분 17초의 두 배 이상. 미러가 멈추면 job 30분 제한 대신 이 단계 이름으로 끝난다.
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: ./gradlew installPlaywrightBrowsers

      - name: "[실험] apt 보관 설정과 보관 파일 수"
        continue-on-error: true
        run: |
          apt-config dump | grep -i -E 'keep|clean|post-invoke' || echo "(해당 설정 없음)"
          ls /var/cache/apt/archives/*.deb 2>/dev/null | wc -l
          ls /var/cache/apt/archives/ | head -30

      - name: Collect apt packages for cache
        id: apt-collect
        timeout-minutes: 2
        continue-on-error: true
        run: bash scripts/ci/playwright-apt-cache.sh collect

      - name: Run browser tests
        run: ./gradlew test -PbrowserTests=only
        env:
          SPRING_PROFILES_ACTIVE: dev
          # 시험은 Chromium만 쓴다(BrowserTestSupport) — Playwright.create()가 Firefox·WebKit까지 자동으로 내려받지 않게 한다.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Upload browser test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-report
          path: build/reports/tests/test/
          retention-days: 14

      # 시험까지 성공한 실행만 저장한다(if의 암묵적 success()). 키가 내용 해시라 같은 내용이면 저장을 건너뛰고, 패키지가 갱신되면 새 캐시가 생긴다.
      - name: Save apt cache
        if: steps.apt-key.outputs.prefix != '' && steps.apt-collect.outputs.collected != '' && steps.apt-collect.outputs.collected != '0'
        uses: actions/cache/save@v6
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: .ci-apt-cache
          key: ${{ steps.apt-key.outputs.prefix }}${{ hashFiles('.ci-apt-cache/*.deb') }}

  # prod 이미지 배포 게이트 (감사 M-06, adversarial-review/plan/PLAN-ci-prod-gates.md).
  # test job과 병렬로 돌며, 스크립트는 scripts/ci/에 있어 로컬(폐기 가능한 Docker 환경)에서도
  # 같은 검증을 재현할 수 있다. 머지 차단은 저장소 브랜치 보호에 이 job을 필수 체크로
  # 등록해야 성립한다(docs/branching.md).
  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 이미지 참조 digest 고정·일치 검사 → 실제 prod-up.sh로 이미지 빌드·기동 → 보안 응답 검증
      # → 같은 스택에서 백업·복구 왕복 검증. 합성 .env.prod는 러너 임시 파일(실 시크릿 아님).
      - name: Prod smoke (image refs, boot, security responses, backup/restore round trip)
        run: bash scripts/ci/prod-smoke.sh

      # 위 단계가 빌드한 이미지(cms-prod-app)를 스캔한다 — OS 레이어와 fat jar 내부 라이브러리
      # 모두 대상이다(Gradle lockfile이 없어 trivy fs로는 앱 의존성을 해석할 수 없다).
      # 수정판이 있는 HIGH/CRITICAL만 차단한다. 예외는 .trivyignore.yaml(만료일 필수).
      - name: Scan prod image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cms-prod-app:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          # 기본 5m은 Java DB 다운로드(로컬 실측 약 2~5분)만으로 초과해 스캔이 실패할 수 있다.
          timeout: 20m
