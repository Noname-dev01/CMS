name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: dev

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 14

  # prod 이미지 배포 게이트 (감사 M-06, adversarial-review/plan/PLAN-ci-prod-gates.md).
  # test job과 병렬로 돌며, 스크립트는 scripts/ci/에 있어 로컬(폐기 가능한 Docker 환경)에서도
  # 같은 검증을 재현할 수 있다. 머지 차단은 저장소 브랜치 보호에 이 job을 필수 체크로
  # 등록해야 성립한다(docs/branching.md).
  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 이미지 참조 digest 고정·일치 검사 → 실제 prod-up.sh로 이미지 빌드·기동 → 보안 응답 검증
      # → 같은 스택에서 백업·복구 왕복 검증. 합성 .env.prod는 러너 임시 파일(실 시크릿 아님).
      - name: Prod smoke (image refs, boot, security responses, backup/restore round trip)
        run: bash scripts/ci/prod-smoke.sh

      # 위 단계가 빌드한 이미지(cms-prod-app)를 스캔한다 — OS 레이어와 fat jar 내부 라이브러리
      # 모두 대상이다(Gradle lockfile이 없어 trivy fs로는 앱 의존성을 해석할 수 없다).
      # 수정판이 있는 HIGH/CRITICAL만 차단한다. 예외는 .trivyignore.yaml(만료일 필수).
      - name: Scan prod image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cms-prod-app:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          # 기본 5m은 Java DB 다운로드(로컬 실측 약 2~5분)만으로 초과해 스캔이 실패할 수 있다.
          timeout: 20m
