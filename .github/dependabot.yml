# Dependabot — 이미지 digest·GitHub Actions·Gradle 의존성 갱신 PR 자동 생성 (M-06).
# 계획: adversarial-review/plan/PLAN-ci-prod-gates.md 쟁점 3·4, 운영 방식: docs/dependabot.md
#
# digest 고정(image:tag@sha256:...)은 재현성을 주는 대신 자동 보안 패치를 멈추므로,
# 갱신은 이 파일이 만드는 PR이 맡는다. 갱신 PR도 CI(test·prod-smoke)를 통과해야 머지한다.
#
# 주의: Dependabot은 Java 소스의 문자열 리터럴을 추적하지 못한다 — MariaDbContainerSupport의
# `mariadb@sha256:...`와 scripts/prod-backup.sh·prod-restore.sh의 mariadb 참조는 자동 갱신
# 대상이 아니다. compose만 갱신되면 scripts/ci/check-image-refs.sh가 불일치로 CI를 실패시키므로,
# 그 PR에서 나머지 참조를 같은 digest로 맞춰 함께 수정한다(docs/deployment.md "이미지 digest 갱신").
#
# 소음 관리(2026-09-29 결정):
# - docker·docker-compose·gradle은 메이저 상향 PR을 만들지 않는다. Spring Boot 4, Java 25,
#   MariaDB 13 같은 메이저 이행은 별도 작업으로 계획한다(첫 실행에서 CI가 이런 PR 4개를 실제로
#   실패시켰다). 마이너·패치 상향과 같은 태그의 digest 갱신은 계속 받는다.
#   gradle의 메이저 무시에는 Gradle wrapper(8→9)도 포함되므로 그 상향은 사람이 직접 시작한다.
# - github-actions는 액션 버전이 메이저 태그(v4→v7)라 메이저를 무시하면 갱신이 전부 막힌다 —
#   무시하지 않고, 대신 한 PR로 묶는다.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
