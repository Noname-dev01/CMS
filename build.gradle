plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 무인증 공개 엔드포인트 레이트리밋(cms.rate-limit) — bounded 캐시 + 버킷별 만료 관리 위임.
    // 버전은 Spring Boot BOM 관리(PLAN-public-endpoint-rate-limit.md 참조 — 자체 구현 admission/sweep이
    // 3라운드 연속 동시성 결함을 낸 것을 근거로 도입 결정).
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // Flyway (버전은 Boot BOM 관리. MariaDB 지원은 flyway-mysql 모듈에 포함 — Flyway 10부터 DB별 모듈 분리)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.security:spring-security-test'
    // Testcontainers (버전은 Boot BOM 관리) — 테스트가 로컬/CI service container 없이
    // 자체 MariaDB 인스턴스로 도는 상태를 위해 도입 (PLAN-testcontainers.md)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:mariadb'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

tasks.named('test') {
    useJUnitPlatform()
    // application.yml의 spring.profiles.active가 기본값 없이 ${SPRING_PROFILES_ACTIVE}로
    // 바뀌어(PLAN-prod-profile.md 결정 1) 프로파일 미지정 기동이 fail-fast하므로,
    // 로컬 실행도 CI(.github/workflows/ci.yml)와 동일하게 dev를 명시한다.
    environment 'SPRING_PROFILES_ACTIVE', 'dev'
    // 레이트리밋 필터를 비활성화한다 — 같은 IP(로컬 테스트 클라이언트)로 반복 요청하는 기존
    // MockMvc 테스트가 많아, 활성화 상태로 두면 대량 429 회귀가 발생한다. 레이트리밋 자체를
    // 검증하는 테스트만 @TestPropertySource(properties = "cms.rate-limit.enabled=true")로
    // 개별 오버라이드한다(PLAN-public-endpoint-rate-limit.md). IDE에서 개별 테스트를 실행하면
    // 이 환경변수가 적용되지 않아 기본값(application.yml의 enabled: true)으로 동작하는 차이가
    // 있다 — docs/troubleshooting.md 참조.
    environment 'CMS_RATE_LIMIT_ENABLED', 'false'
    // MariaDbContainerSupport는 static 필드로 컨테이너를 시작하는 진짜 싱글턴이다 —
    // "테스트 JVM(워커)당 컨테이너 1개"라는 계약이 성립하려면 프로세스가 여러 개
    // 뜨거나 하나의 프로세스가 순차적으로 재기동되지 않아야 한다. maxParallelForks는
    // 동시 실행 프로세스 수, forkEvery는 한 프로세스가 처리할 테스트 클래스 수를
    // 제한하므로 둘 다 명시해야 한다 (PLAN-testcontainers.md 결정 2-1).
    maxParallelForks = 1
    forkEvery = 0
    // 컨테이너 시작 시 MariaDbContainerSupport가 남기는 컨테이너 ID 로그를 빌드 콘솔에
    // 노출한다 — 없으면 Gradle 기본 LIFECYCLE 로그 레벨에서 테스트 표준 출력이 보이지
    // 않아 실행 간 컨테이너 ID 대조 검증이 불가능하다.
    testLogging {
        showStandardStreams = true
    }
}
