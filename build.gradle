plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
    // 관리자 화면 React 아일랜드 빌드 — Node를 Gradle이 내려받아 로컬·CI·Docker가 같은 Node를 쓴다(PLAN-react-admin-faq.md 결정 3).
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

// Spring Boot 4.0.8 BOM이 관리하는 Jackson 3.1.5(tools.jackson)·Jackson 2.21.5(com.fasterxml)가
// jackson-databind CVE-2026-68497(HIGH, 수정판 3.1.6·2.21.6)의 영향 범위라 같은 마이너 라인의 패치
// 버전으로만 올린다. Boot 4에서 jackson-bom은 Jackson 3, jackson-2-bom은 Jackson 2 BOM이다 — Jackson 2는
// SpringDoc(swagger-core)이 끌어온다. Boot BOM이 이 버전 이상을 관리하게 되면 두 줄을 제거한다
// (PLAN-spring-boot-4.md §4-1).
ext['jackson-bom.version'] = '3.1.7'
ext['jackson-2-bom.version'] = '2.21.7'
// Boot 4.0.8 BOM의 Tomcat 11.0.24는 Boot 3.5 시절 10.1.60 오버라이드로 해소했던 CVE-2026-65182·65905·68525
// (CRITICAL, 11.0.x 수정판 11.0.25)의 영향 범위라 같은 마이너 라인의 최신 패치로 올린다(Trivy, 2026-10-06 #97).
// Boot BOM이 11.0.25 이상을 관리하게 되면 제거한다.
ext['tomcat.version'] = '11.0.26'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Boot 4 모듈식 스타터 — 실제로 쓰는 기술의 스타터만 선언한다(classic 스타터는 약 90개 모듈을 올려
    // 쓰지 않는 자동 구성까지 켰다, PLAN-modular-starters.md). 새 기술을 쓰면 해당 스타터를 추가해야
    // 자동 구성이 켜진다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // @AdminActionLogged 감사 로그 AOP — aspectjweaver를 data-jpa 전이 의존에 맡기지 않고 명시한다.
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 무인증 공개 엔드포인트 레이트리밋(cms.rate-limit) — bounded 캐시 + 버킷별 만료 관리 위임.
    // 버전은 Spring Boot BOM 관리(PLAN-public-endpoint-rate-limit.md 참조 — 자체 구현 admission/sweep이
    // 3라운드 연속 동시성 결함을 낸 것을 근거로 도입 결정).
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // 본문 HTML 허용 목록 sanitizer(HtmlContentSanitizer) — Boot BOM 관리 대상이 아니라 버전 명시
    // (PLAN-html-editor.md 쟁점 1 — 정리·이미지 src 제한·글자 수 계산을 한 파서로 처리).
    implementation 'org.jsoup:jsoup:1.24.1'
    // 2단계 인증(TOTP) 등록용 QR 코드 생성 — core 모듈만 쓴다(javase 모듈 없이 BitMatrix를 직접 PNG로 그린다).
    // Apache-2.0, 런타임 전이 의존성 없음. Boot BOM 관리 대상이 아니라 버전 명시(PLAN-totp-two-factor.md 결정 8).
    implementation 'com.google.zxing:core:3.5.4'
    // 패스키(WebAuthn) 2단계 — RP 검증 연산(Webauthn4JRelyingPartyOperations)만 직접 쓴다. http.webAuthn()은 켜지 않는다
    // (자체 로그인 필터·프로바이더가 2단계 계약을 우회). 버전은 Boot BOM(Spring Security 7.0.7) 관리, 전이로 webauthn4j-core
    // (PLAN-passkey-second-factor.md 결정 2).
    implementation 'org.springframework.security:spring-security-webauthn'
    // Flyway (버전은 Boot BOM 관리. MariaDB 지원은 flyway-mysql 모듈에 포함 — Flyway 10부터 DB별 모듈 분리).
    // Boot 4는 Flyway 자동 구성이 별도 모듈이라 스타터로 받는다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    // 테스트 슬라이스별 스타터. starter-security-test는 @WebMvcTest·@AutoConfigureMockMvc에 Security 자동 구성과
    // @WithMockUser 연동(SecurityMockMvcAutoConfiguration)을 넣는다 — 테스트 import에 드러나지 않는 필수 의존.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.security:spring-security-test'
    // Testcontainers (버전은 Boot BOM 관리) — 테스트가 로컬/CI service container 없이
    // 자체 MariaDB 인스턴스로 도는 상태를 위해 도입 (PLAN-testcontainers.md)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mariadb'
    // 실제 브라우저(Chromium) 시험 — 브라우저 기본 폼 검증처럼 MockMvc로 재현되지 않는 관리 화면 동작을 고정한다(PLAN-popup.md 코드 리뷰 R2 후속).
    // 첫 실행 때 드라이버·브라우저를 자동으로 내려받고, CI는 installPlaywrightBrowsers 태스크가 미리 설치한다.
    testImplementation 'com.microsoft.playwright:playwright:1.65.1'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

// ===== 관리자 화면 React 아일랜드(frontend/) — PLAN-react-admin-faq.md 결정 3 =====
// Node는 이 버전 하나만 정하고 npm은 Node 동봉본을 쓴다(npmVersion 미지정 — Node 버전이 npm 버전을 대표한다).
// lock 생성·갱신도 이 Node·npm으로 한다: 버전 규칙은 frontend/.npmrc 주석.
node {
    download = true
    version = '24.22.2'
    npmInstallCommand = 'ci'
    nodeProjectDir = file('frontend')
}

// 플러그인 7.1.0의 npmInstall은 package.json·lock만 입력으로 추적한다 — .npmrc나 Node 버전만 바뀌어도 다시 설치하게 한다.
tasks.named('npmInstall') {
    inputs.file('frontend/.npmrc')
    inputs.property('nodeVersion', node.version)
}

def frontendSources = { task ->
    task.inputs.dir('frontend/src')
    task.inputs.files('frontend/package.json', 'frontend/package-lock.json', 'frontend/.npmrc',
            'frontend/tsconfig.json', 'frontend/tsconfig.node.json', 'frontend/vite.config.ts')
    task.inputs.property('nodeVersion', node.version)
}

// NpmTask는 기본으로 npmSetup에만 의존한다 — 설치(npmInstall)를 명시한다.
tasks.register('frontendBuild', com.github.gradle.node.npm.task.NpmTask) {
    group = 'build'
    description = '관리자 화면 React 번들을 만든다(frontend/ → build/frontend)'
    dependsOn 'npmInstall'
    args = ['run', 'build']
    frontendSources(it)
    outputs.dir(layout.buildDirectory.dir('frontend'))
}

tasks.register('frontendCheck', com.github.gradle.node.npm.task.NpmTask) {
    group = 'verification'
    description = '관리자 화면 React 코드의 타입 검사(tsc)와 단위 시험(vitest)'
    dependsOn 'npmInstall'
    args = ['run', 'check']
    frontendSources(it)
    // 출력이 없는 검사 태스크라 매번 실행된다(시험 실행과 같은 취급).
}

// 경로 문자열이 아니라 태스크 출력을 참조해 processResources → frontendBuild 의존이 생기게 한다.
tasks.named('processResources') {
    from(tasks.named('frontendBuild')) {
        into 'static/js/admin-react'
    }
}

// CI 전용 사전 단계: 브라우저 시험이 쓰는 Chromium과 시스템 의존성(apt)을 설치한다. 로컬은 첫 실행 때 Playwright가 브라우저를 자동으로 내려받으므로
// 필요 없다(Windows·macOS에서는 --with-deps가 시스템 패키지를 설치하지 않는다).
tasks.register('installPlaywrightBrowsers', JavaExec) {
    group = 'verification'
    description = 'Playwright 브라우저 시험용 Chromium과 시스템 의존성을 설치한다(CI 사전 단계)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install', '--with-deps', 'chromium']
}

// 시험의 파일 저장소(adversarial-review/plan/PLAN-test-data-leak.md) — 개발 서버의 ./data/attachments와 섞이지 않게 build 아래로 격리하고,
// 실행 전에 비우며, 실행이 끝났을 때 남은 파일이 있으면 누수로 보고 빌드를 실패시킨다.
def testFileStorageRoot = layout.buildDirectory.dir('test-file-storage').get().asFile.toPath().toAbsolutePath().normalize()

// 루트 자체가 없을 때만 null — 접근 오류처럼 존재를 확인할 수 없는 경우는 예외로 실패시킨다(Files.exists는 그때도 false를 돌려준다).
def testFileStorageAttributes = { java.nio.file.Path root ->
    try {
        return java.nio.file.Files.readAttributes(root, java.nio.file.attribute.BasicFileAttributes, java.nio.file.LinkOption.NOFOLLOW_LINKS)
    } catch (java.nio.file.NoSuchFileException ignored) {
        return null
    }
}

tasks.named('test') {
    // CI는 브라우저 시험(@Tag("browser") — BrowserTestSupport 상속 클래스)을 별도 job으로 나눠 병렬로 돌린다
    // (.github/workflows/ci.yml): -PbrowserTests=exclude | only. 지정하지 않으면 지금처럼 전체를 돌린다(로컬 기본).
    def browserTests = findProperty('browserTests')
    // 프런트엔드 타입 검사·단위 시험은 브라우저 시험만 도는 실행(CI browser-test job)을 빼고 함께 돈다(PLAN-react-admin-faq.md 결정 3).
    if (browserTests != 'only') {
        dependsOn 'frontendCheck'
    }
    useJUnitPlatform {
        if (browserTests == 'exclude') {
            excludeTags 'browser'
        } else if (browserTests == 'only') {
            // 저장소 격리 확인 시험(TestFileStorageIsolationTest)은 브라우저 전용 실행에서도 돌아야 그 실행의 누수 검사가 공허하지 않다.
            includeTags 'browser', 'storage-isolation'
        } else if (browserTests != null) {
            throw new GradleException("browserTests는 exclude 또는 only만 허용한다: ${browserTests}")
        }
    }
    // application.yml의 spring.profiles.active가 기본값 없이 ${SPRING_PROFILES_ACTIVE}로
    // 바뀌어(PLAN-prod-profile.md 결정 1) 프로파일 미지정 기동이 fail-fast하므로,
    // 로컬 실행도 CI(.github/workflows/ci.yml)와 동일하게 dev를 명시한다.
    environment 'SPRING_PROFILES_ACTIVE', 'dev'
    // 레이트리밋 필터를 비활성화한다 — 같은 IP(로컬 테스트 클라이언트)로 반복 요청하는 기존
    // MockMvc 테스트가 많아, 활성화 상태로 두면 대량 429 회귀가 발생한다. 레이트리밋 자체를
    // 검증하는 테스트만 @TestPropertySource(properties = "cms.rate-limit.enabled=true")로
    // 개별 오버라이드한다(PLAN-public-endpoint-rate-limit.md). IDE에서 개별 테스트를 실행하면
    // 이 환경변수가 적용되지 않아 기본값(application.yml의 enabled: true)으로 동작하는 차이가
    // 있다 — docs/troubleshooting.md 참조.
    environment 'CMS_RATE_LIMIT_ENABLED', 'false'
    // 시험이 비밀번호를 정할 때 외부(HIBP)로 나가지 않게 한다. 검사기 자체는 로컬 서버로, 판정 흐름은 가짜 구현으로 시험한다.
    environment 'CMS_PASSWORD_BREACH_CHECK_ENABLED', 'false'
    // 파일 저장소 격리 — 셸에 같은 환경변수가 있어도 이 값이 쓰인다. Gradle 없이(IDE에서) 실행한 시험에는 적용되지 않는다.
    environment 'APP_FILE_STORAGE_ROOT', testFileStorageRoot.toString()
    doFirst {
        // 검사할 경로와 시험이 쓸 경로가 어긋나면 누수 검사가 엉뚱한 폴더를 보게 된다.
        def injected = environment['APP_FILE_STORAGE_ROOT']
        if (injected == null || java.nio.file.Paths.get(injected.toString()).toAbsolutePath().normalize() != testFileStorageRoot) {
            throw new GradleException("시험 파일 저장소 환경변수 APP_FILE_STORAGE_ROOT(${injected})가 누수 검사 경로(${testFileStorageRoot})와 다르다")
        }
        // 이전 실행(시험 실패·강제 종료)이 남긴 파일을 이번 실행의 누수로 오인하지 않게 비운다. 삭제 실패는 예외로 실패시킨다.
        if (testFileStorageAttributes(testFileStorageRoot) != null) {
            java.nio.file.Files.walk(testFileStorageRoot).withCloseable { paths ->
                paths.sorted(Comparator.reverseOrder()).forEach { java.nio.file.Files.delete(it) }
            }
        }
    }
    doLast {
        // 시험이 모두 성공한 뒤에만 온다(실패한 실행의 잔여는 다음 실행의 doFirst가 지운다). 시험마다 자기 파일을 지웠는지까지는 보지 못한다 —
        // MediaTestSupport.cleanLibrary처럼 넓게 지우는 정리가 앞선 시험의 누수를 가릴 수 있다.
        if (testFileStorageAttributes(testFileStorageRoot) == null) {
            return
        }
        List<java.nio.file.Path> leaked = java.nio.file.Files.walk(testFileStorageRoot).withCloseable { paths ->
            paths.filter { !java.nio.file.Files.isDirectory(it, java.nio.file.LinkOption.NOFOLLOW_LINKS) }.sorted().toList()
        }
        if (!leaked.isEmpty()) {
            // 수정 시각은 시험 결과 XML의 timestamp와 같은 UTC 형식(예: 2026-11-26T07:47:40Z)으로 보여 바로 대조할 수 있게 한다.
            def lines = leaked.take(20).collect { path ->
                def modified = java.nio.file.Files.getLastModifiedTime(path, java.nio.file.LinkOption.NOFOLLOW_LINKS).toInstant()
                        .truncatedTo(java.time.temporal.ChronoUnit.SECONDS)
                def size = java.nio.file.Files.size(path)
                "  ${testFileStorageRoot.relativize(path)}  (수정 ${modified}, ${size}바이트)"
            }
            throw new GradleException("시험이 파일 저장소에 파일 ${leaked.size()}개를 남겼다(${testFileStorageRoot}):\n" + lines.join('\n')
                    + (leaked.size() > 20 ? "\n  … 외 ${leaked.size() - 20}개" : '')
                    + '\n수정 시각을 build/test-results/test/*.xml의 timestamp와 맞춰 후보 시험을 찾고, 그 클래스를 --tests로 단독 실행해 재현한다(src/test/java/CLAUDE.md).')
        }
    }
    // MariaDbContainerSupport는 static 필드로 컨테이너를 시작하는 진짜 싱글턴이다 —
    // "테스트 JVM(워커)당 컨테이너 1개"라는 계약이 성립하려면 프로세스가 여러 개
    // 뜨거나 하나의 프로세스가 순차적으로 재기동되지 않아야 한다. maxParallelForks는
    // 동시 실행 프로세스 수, forkEvery는 한 프로세스가 처리할 테스트 클래스 수를
    // 제한하므로 둘 다 명시해야 한다 (PLAN-testcontainers.md 결정 2-1).
    maxParallelForks = 1
    forkEvery = 0
    // 한 JVM이 전 시험을 돌리며 Spring 시험 컨텍스트를 캐시(기본 최대 32개)에 쌓으므로 Gradle 기본 힙(512MB)으로는 모자란다 —
    // 2026-11-19 PR #282(패스키)가 컨텍스트 하나를 더하자 CI(Linux)에서 컨텍스트 로드 중 OutOfMemoryError: Java heap space
    // (PublicTransferLimitServerTest 10건)가 났다. 로컬(Windows)은 같은 512MB로 통과했다(docs/troubleshooting.md).
    maxHeapSize = '1g'
    // 컨테이너 시작 시 MariaDbContainerSupport가 남기는 컨테이너 ID 로그를 빌드 콘솔에
    // 노출한다 — 없으면 Gradle 기본 LIFECYCLE 로그 레벨에서 테스트 표준 출력이 보이지
    // 않아 실행 간 컨테이너 ID 대조 검증이 불가능하다.
    testLogging {
        showStandardStreams = true
    }
}
