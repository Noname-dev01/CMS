server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3307/cms}
    username: ${DB_USER:admin}
    password: ${DB_PASS}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
# 공개 문의 폼 — dev는 Cloudflare 공개 테스트 키(항상 통과)로 연다. 이 키는 prod 프로파일에서 기동 실패로 거부된다(PLAN-inquiry.md R1-3).
cms:
  inquiry:
    turnstile:
      enabled: ${CMS_INQUIRY_TURNSTILE_ENABLED:true}
      site-key: ${CMS_INQUIRY_TURNSTILE_SITE_KEY:1x00000000000000000000AA}
      secret-key: ${CMS_INQUIRY_TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
