server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3307/cms}
    username: ${DB_USER:admin}
    password: ${DB_PASS}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
# 공개 문의 폼 — dev는 Cloudflare 공개 테스트 키(항상 통과)로 연다. 이 키는 prod 프로파일에서 기동 실패로 거부된다(PLAN-inquiry.md R1-3).
cms:
  # 2단계 인증 비밀값 암호화 키 — dev·시험 전용 고정값이다. 운영에 쓰지 않는다(운영은 CMS_TOTP_ENCRYPTION_KEY에 무작위 32바이트).
  totp:
    encryption-key: ${CMS_TOTP_ENCRYPTION_KEY:ZGV2LW9ubHktdG90cC1rZXktZG8tbm90LXVzZS0zMmI=}
  inquiry:
    turnstile:
      enabled: ${CMS_INQUIRY_TURNSTILE_ENABLED:true}
      site-key: ${CMS_INQUIRY_TURNSTILE_SITE_KEY:1x00000000000000000000AA}
      secret-key: ${CMS_INQUIRY_TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
