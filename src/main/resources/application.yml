spring:
  application:
    name: CMS
  profiles:
    # 기본값 없음(의도) — 프로파일 미지정 기동은 fail-fast한다(PLAN-prod-profile.md 결정 1).
    # dev+prod 동시 활성화·활성 프로파일 0개는 ProfileGuardEnvironmentPostProcessor가 추가로 차단한다.
    active: ${SPRING_PROFILES_ACTIVE}
  jackson:
    # Boot 4(Jackson 3): 날짜 직렬화 기능은 DateTimeFeature로 옮겨져 datatype.datetime 아래에 둔다.
    datatype:
      datetime:
        write-dates-as-timestamps: false
    # 미지 필드 무시를 기본값에 맡기지 않고 명시적으로 고정한다 — 낡은 클라이언트가 보낸 제거된 필드
    # (메뉴 accessRole·ord 등)가 400이 되지 않아야 한다(com.cms.admin.menu CLAUDE.md 계약,
    # MenuControllerTest.createMenu_legacyAccessRoleIgnored). Boot 4.0.8 기본 구성에서도 무시됨을 확인했다.
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 공지사항 첨부파일(파일당 10MB 상한)에 맞춘 값. 업로드 API는 요청당 파일 1개만 받으므로
      # max-request-size는 파일 5개 합산이 아니라 파일 1개 + multipart 오버헤드만 커버하면 된다
      # (PLAN-notice-attachment.md 쟁점 8).
      max-file-size: 10MB
      max-request-size: 15MB
  task:
    execution:
      # 비밀번호 재설정 메일 발송(PasswordResetService의 TaskExecutor)은 전용 빈이 아니라 Boot 기본
      # 공용 applicationTaskExecutor를 쓴다 — 기본값(큐 무제한)이면 SMTP 무응답 시 대기 작업이 무한 누적된다.
      # 보장 범위는 "동시 실행 4 · 대기 20"의 자원 상한뿐이다(초과 제출은 TaskRejectedException →
      # 서비스가 삼키고 토큰을 조건부 클리어, 응답은 항상 200). 큐 대기로 만료된 링크가 발송되지 않음은
      # 보장하지 않는다. core=max인 이유: 큐가 유한해도 core<max면 큐가 찬 뒤에야 스레드가 늘고,
      # SMTP 병목에서는 스레드를 늘려도 동시 연결만 늘어난다. 이 executor를 다른 기능이 쓰게 되면
      # 메일 전용 빈 분리를 재평가한다(PLAN-mail-executor-bound.md, remediation-plan Deferred Work).
      pool:
        core-size: 4
        max-size: 4
        queue-capacity: 20
  flyway:
    # 빈 DB(CI·신규 환경)는 V1부터 전체 실행된다.
    # 기존 DB 전환 시에만 일회성으로 SPRING_FLYWAY_BASELINE_ON_MIGRATE=true를
    # 붙여 기동한다 (docs/migration-guide.md 사전 점검 체크리스트 필수).
    # baseline-on-migrate를 상시 설정하지 않는 이유: 점검을 건너뛴 기존 DB가
    # 조용히 영구 baseline되는 것을 막기 위함.
    baseline-version: 1
  jpa:
    # OSIV를 끈다 — 켜 두면(Boot 기본값) 서비스 @Transactional이 끝난 뒤에도 요청이 끝날 때까지
    # JDBC 연결을 붙잡아, 공개 첨부 다운로드처럼 응답 전송이 긴 요청이 풀을 점유한다(스파이크 실측:
    # 요청 진행 중 activeConnections 1→0). 엔티티에 연관관계 매핑이 없어 지연 로딩 의존이 없다
    # (PLAN-public-notice-attachment.md v8, PublicAttachmentStreamingServerTest가 회귀를 막는다).
    open-in-view: false
    hibernate:
      # Flyway 전용 정책이라 전 프로파일 공통(PLAN-prod-profile.md 결정 2) — 스키마 변경은 마이그레이션 파일로만 한다
      ddl-auto: validate

server:
  error:
    whitelabel:
      enabled: false
    path: /error

management:
  endpoints:
    web:
      exposure:
        # 안전한 기본을 전 프로파일 공통으로 둔다 — 노출 설정과 SecurityConfig의
        # /actuator/** denyAll이 항상 일치하도록(PLAN-prod-profile.md 결정 2·3).
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  file-storage:
    # 기본값은 프로젝트 상대 경로 — 컨테이너 전용 절대경로는 docker-compose.dev.yml의
    # environment에서만 APP_FILE_STORAGE_ROOT로 주입한다(application-dev.yml은 건드리지 않음).
    # 그래야 로컬 bootRun과 컨테이너 실행이 서로 다른 실제 경로를 쓴다(PLAN-notice-attachment.md 쟁점 10).
    root: ${APP_FILE_STORAGE_ROOT:./data/attachments}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    withCredentials: true

cms:
  # 편집기 본문 이미지 전체 저장 상한(DB 등록 이미지 기준, 업로드가 카운터 행을 잠가 정확히 집행 — PLAN-html-editor.md 쟁점 9)
  content-image:
    max-total-bytes: ${CMS_CONTENT_IMAGE_MAX_TOTAL_BYTES:1073741824}
    max-count: ${CMS_CONTENT_IMAGE_MAX_COUNT:10000}
  rate-limit:
    # 무인증 공개 엔드포인트(/notices/**, 비밀번호 재설정 API)의 최소 방어 —
    # 정확한 유량 계약을 보장하는 게이트웨이가 아니라 "무제한 요청을 값싸게 차단"하는 목적이다.
    # "N회/기간"은 버스트 상한 N + 평균 N/기간을 뜻한다(PLAN-public-endpoint-rate-limit.md 쟁점 2).
    # 캐시(maxKeys) 포화 시 개별 IP의 정확한 누적치 보장이 흐트러질 수 있음을 fail-open으로
    # 명시 수용한다(쟁점 3) — Caffeine 도입 배경은 계획 문서 참조.
    enabled: true
    max-keys: 10000
    rules:
      # attachment가 public-notice보다 먼저 평가돼야 더 엄격한 한도가 우선 적용된다(쟁점 8).
      - id: attachment
        pattern: /notices/*/attachments/*
        methods: [GET, HEAD]
        capacity: 20
        refill-period-seconds: 60
      - id: public-notice
        pattern: /notices/**
        methods: [GET, HEAD]
        capacity: 120
        refill-period-seconds: 60
      # 공개 게시판 — 첨부가 먼저(더 엄격한 한도 우선, 공지와 같은 순서). PLAN-board.md 쟁점 10
      - id: board-attachment
        pattern: /boards/*/posts/*/attachments/*
        methods: [GET, HEAD]
        capacity: 20
        refill-period-seconds: 60
      - id: public-board
        pattern: /boards/**
        methods: [GET, HEAD]
        capacity: 120
        refill-period-seconds: 60
      # 편집기 본문 이미지 공개 다운로드 — 공지 1건에 이미지가 여러 장이라 공지 페이지보다 넉넉하게(PLAN-html-editor.md).
      - id: content-image
        pattern: /content-images/*
        methods: [GET, HEAD]
        capacity: 240
        refill-period-seconds: 60
      # 공개 메인(/)과 배너 이미지 — 메인 1회에 이미지가 최대 10장이라 이미지 한도는 메인의 두 배(메인 로드 24회분). 두 규칙은 경로가 겹치지 않는다.
      # 공유 IP(사내망 등)에서 한도를 넘으면 이미지가 429로 깨질 수 있음을 수용한다. PLAN-public-home-banner.md 쟁점 11
      - id: public-home
        pattern: /
        methods: [GET, HEAD]
        capacity: 120
        refill-period-seconds: 60
      - id: banner-image
        pattern: /banners/*/image
        methods: [GET, HEAD]
        capacity: 240
        refill-period-seconds: 60
      - id: reset-request
        pattern: /admin/api/password-reset-requests
        methods: [POST]
        capacity: 5
        refill-period-seconds: 3600
      - id: reset-confirm
        pattern: /admin/api/password-resets
        methods: [POST]
        capacity: 20
        refill-period-seconds: 3600