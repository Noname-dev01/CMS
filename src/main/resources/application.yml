spring:
  application:
    name: CMS
  profiles:
    # 기본값 없음(의도) — 프로파일 미지정 기동은 fail-fast한다(PLAN-prod-profile.md 결정 1).
    # dev+prod 동시 활성화·활성 프로파일 0개는 ProfileGuardEnvironmentPostProcessor가 추가로 차단한다.
    active: ${SPRING_PROFILES_ACTIVE}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 공지사항 첨부파일(파일당 10MB 상한)에 맞춘 값. 업로드 API는 요청당 파일 1개만 받으므로
      # max-request-size는 파일 5개 합산이 아니라 파일 1개 + multipart 오버헤드만 커버하면 된다
      # (PLAN-notice-attachment.md 쟁점 8).
      max-file-size: 10MB
      max-request-size: 15MB
  flyway:
    # 빈 DB(CI·신규 환경)는 V1부터 전체 실행된다.
    # 기존 DB 전환 시에만 일회성으로 SPRING_FLYWAY_BASELINE_ON_MIGRATE=true를
    # 붙여 기동한다 (docs/migration-guide.md 사전 점검 체크리스트 필수).
    # baseline-on-migrate를 상시 설정하지 않는 이유: 점검을 건너뛴 기존 DB가
    # 조용히 영구 baseline되는 것을 막기 위함.
    baseline-version: 1
  jpa:
    hibernate:
      # Flyway 전용 정책이라 전 프로파일 공통(PLAN-prod-profile.md 결정 2) — 스키마 변경은 마이그레이션 파일로만 한다
      ddl-auto: validate

server:
  error:
    whitelabel:
      enabled: false
    path: /error

management:
  endpoints:
    web:
      exposure:
        # 안전한 기본을 전 프로파일 공통으로 둔다 — 노출 설정과 SecurityConfig의
        # /actuator/** denyAll이 항상 일치하도록(PLAN-prod-profile.md 결정 2·3).
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  file-storage:
    # 기본값은 프로젝트 상대 경로 — 컨테이너 전용 절대경로는 docker-compose.dev.yml의
    # environment에서만 APP_FILE_STORAGE_ROOT로 주입한다(application-dev.yml은 건드리지 않음).
    # 그래야 로컬 bootRun과 컨테이너 실행이 서로 다른 실제 경로를 쓴다(PLAN-notice-attachment.md 쟁점 10).
    root: ${APP_FILE_STORAGE_ROOT:./data/attachments}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    withCredentials: true