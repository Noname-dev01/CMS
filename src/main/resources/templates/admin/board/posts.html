<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: adminHead(~{::title})}">
    <title>게시글 관리</title>
</head>
<body id="page-top">
<link rel="stylesheet" th:href="@{/css/admin/admin-manage.css}">
<link rel="stylesheet" th:href="@{/vendor/quill/quill.snow.css}">
<style>
    /* 예약 게시 상태 배지 — 공용 admin-manage.css에는 없는 두 상태만 이 화면에서 정의한다(예약됨=파랑, 만료=회색). */
    .badge-status-scheduled {
        color: #17316b;
        background: linear-gradient(135deg, #dbe7ff 0%, #b9cdfd 100%);
        border: 1px solid rgba(34, 74, 190, 0.18);
    }
    /* 상태 배지는 한 줄로 — 좁은 폭에서 배지 글자가 접히지 않게 한다. 기간은 " ~ "에서 자연스럽게 줄바꿈되게 두어 제목 열이 눌리지 않는다. */
    #postTableBody .badge-status {
        white-space: nowrap;
    }
    .badge-status-expired {
        color: #495057;
        background: linear-gradient(135deg, #eceff1 0%, #dde1e4 100%);
        border: 1px solid rgba(73, 80, 87, 0.18);
    }
    /* 본문은 서버가 정리한 HTML이다. 표시 규칙은 Quill 편집 영역(.ql-editor)과 같게 맞춘다 —
       pre-wrap(연속 공백·빈 줄 보존) + 문단 여백 0(PLAN-html-editor.md 쟁점 12). */
    .post-content-view {
        white-space: pre-wrap;
        word-break: break-word;
    }

    .post-content-view p,
    .post-content-view h2,
    .post-content-view h3,
    .post-content-view ol,
    .post-content-view ul,
    .post-content-view blockquote {
        margin: 0;
    }

    .post-content-view ol,
    .post-content-view ul {
        padding-left: 1.5em;
    }

    .post-content-view blockquote {
        border-left: 4px solid #d1d3e2;
        padding-left: 1em;
    }

    .post-content-view img,
    .post-editor .ql-editor img {
        max-width: 100%;
    }

    .post-editor .ql-editor {
        min-height: 240px;
        font-size: 1rem;
    }

    /* 대표 이미지 선택지 — 본문에 들어 있는 이미지의 작은 미리보기 라디오 목록 */
    .cover-choices {
        display: flex;
        flex-wrap: wrap;
        gap: .5rem;
    }

    .cover-choice {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 5rem;
        min-height: 5rem;
        padding: .35rem;
        border: 2px solid #d1d3e2;
        border-radius: .35rem;
        cursor: pointer;
        margin: 0;
    }

    .cover-choice.is-selected {
        border-color: #4e73df;
    }

    .cover-choice img {
        max-width: 7rem;
        max-height: 5rem;
        object-fit: contain;
    }

    .cover-view img {
        max-width: 12rem;
        max-height: 8rem;
        object-fit: contain;
        border: 1px solid #d1d3e2;
    }

    .attachment-section {
        margin-top: 1.5rem;
        padding-top: 1rem;
        border-top: 1px solid #e3e6f0;
    }

    .attachment-section-title {
        margin-bottom: 0.75rem;
    }

    .attachment-list {
        list-style: none;
        padding-left: 0;
        margin-bottom: 0.75rem;
    }

    .attachment-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0;
    }

    .attachment-name {
        word-break: break-all;
    }

    .attachment-size {
        color: #858796;
        font-size: 0.85rem;
    }

    .attachment-upload {
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }

    .attachment-upload input[type="file"] {
        flex: 1;
    }
</style>

<div id="wrapper">
    <div th:replace="~{admin/fragments/sidebar :: adminSidebar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{admin/fragments/topbar :: adminTopbar}"></div>

            <div class="container-fluid">
                <!--/* 본문(제목 줄 포함)은 React 아일랜드가 그린다(frontend/src/admin/post, PLAN-react-admin-posts.md). 미디어 라이브러리 버튼은 MEDIA 읽기 권한이
                     있을 때만 보인다(버튼 표시용 — 저장 시 서버가 다시 판정한다). */-->
                <div id="postManageRoot" th:data-can-pick-library="${myPermissions != null and myPermissions.contains('MEDIA:READ')}"></div>
            </div>
        </div>

        <div th:replace="~{admin/fragments/footer :: adminFooter}"></div>
    </div>
</div>

<!--/* 게시글 모달 — React가 그린다(옛 화면처럼 #wrapper 밖). */-->
<div id="postModalRoot"></div>

<div th:replace="~{admin/fragments/logout-modal :: logoutModal}"></div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
<script src="/js/admin/media-picker.js"></script>
<script src="/vendor/quill/quill.js"></script>
<script src="/js/admin/notice-editor.js"></script>

<script type="module" th:src="@{/js/admin-react/post-manage.js}"></script>

</body>
</html>
