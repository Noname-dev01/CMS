<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body th:fragment="adminTopbar">
<nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

    <!-- Sidebar Toggle (Topbar) -->
    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
        <i class="fa fa-bars"></i>
    </button>

    <!-- 통합 검색: 입력 요소 하나를 데스크톱·모바일이 공유한다(xs에서는 아이콘 버튼이 펼친다). 동작은 /js/admin/topbar-search.js -->
    <form class="topbar-search form-inline mr-auto ml-md-3 my-2 my-md-0" role="search" autocomplete="off">
        <button type="button" id="topbarSearchToggle" class="btn btn-link d-sm-none" aria-label="검색 열기" aria-expanded="false">
            <i class="fas fa-search fa-fw"></i>
        </button>
        <div id="topbarSearchBox" class="topbar-search-box d-none d-sm-block">
            <div class="input-group">
                <input type="search" id="topbarSearchInput" class="form-control bg-light border-0 small"
                       placeholder="메뉴·공지·관리자 검색" maxlength="100" aria-label="통합 검색"
                       role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="topbarSearchResults">
                <div class="input-group-append">
                    <span class="btn btn-primary disabled" aria-hidden="true"><i class="fas fa-search fa-sm"></i></span>
                </div>
            </div>
            <div id="topbarSearchResults" class="topbar-search-results shadow d-none" role="listbox" aria-label="검색 결과"></div>
        </div>
    </form>

    <!-- Topbar Navbar -->
    <ul class="navbar-nav ml-auto">

        <!-- Nav Item - Alerts: 내 알림. 동작은 /js/admin/topbar-notification.js (배지는 페이지 로드 시 1회 조회, 폴링 없음) -->
        <li class="nav-item dropdown no-arrow mx-1">
            <a class="nav-link dropdown-toggle" href="#" id="alertsDropdown" role="button"
               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" aria-label="알림">
                <i class="fas fa-bell fa-fw"></i>
                <span class="badge badge-danger badge-counter d-none" id="notificationBadge" aria-live="polite"></span>
            </a>
            <div class="dropdown-list dropdown-menu dropdown-menu-right shadow animated--grow-in notification-menu"
                 aria-labelledby="alertsDropdown">
                <h6 class="dropdown-header d-flex justify-content-between align-items-center">
                    <span>알림</span>
                    <button type="button" class="btn btn-link btn-sm p-0 notification-read-all d-none" id="notificationReadAll">모두 읽음</button>
                </h6>
                <div id="notificationList" role="list"></div>
                <div class="dropdown-item text-center small text-gray-500 d-none" id="notificationMore" role="button" tabindex="0">더 불러오기</div>
            </div>
        </li>

        <!-- Nav Item - Messages: 내 쪽지. 동작은 /js/admin/topbar-message.js (배지는 페이지 로드 시 1회 조회, 폴링 없음).
             미읽음 배지의 값·요청 세대는 이 스크립트가 단독으로 소유하고, 쪽지함 페이지는 window.CmsMessageBadge로만 갱신한다 -->
        <li class="nav-item dropdown no-arrow mx-1">
            <a class="nav-link dropdown-toggle" href="#" id="messagesDropdown" role="button"
               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" aria-label="쪽지">
                <i class="fas fa-envelope fa-fw"></i>
                <span class="badge badge-danger badge-counter d-none" id="messageBadge" aria-live="polite"></span>
            </a>
            <div class="dropdown-list dropdown-menu dropdown-menu-right shadow animated--grow-in message-menu"
                 aria-labelledby="messagesDropdown">
                <h6 class="dropdown-header d-flex justify-content-between align-items-center">
                    <span>쪽지</span>
                    <a class="message-open-box" th:href="@{/admin/member/messages}">쪽지함 열기</a>
                </h6>
                <div id="messageList" role="list"></div>
            </div>
        </li>

        <div class="topbar-divider d-none d-sm-block"></div>

        <!-- Nav Item - User Information -->
        <li class="nav-item dropdown no-arrow">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <span id="topbarCurrentAdminName" class="mr-2 d-none d-lg-inline text-gray-600 small" th:text="${currentAdminName}">관리자</span>
                <img id="topbarCurrentAdminImage" class="img-profile rounded-circle"
                     th:src="${currentAdminProfileImageUrl != null and !#strings.isEmpty(currentAdminProfileImageUrl)} ? ${currentAdminProfileImageUrl} : '/img/undraw_profile.svg'"
                     src="/img/undraw_profile.svg">
            </a>
            <!-- Dropdown - User Information -->
            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
                 aria-labelledby="userDropdown">
                <a class="dropdown-item" th:href="@{/admin/member/info}">
                    <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                    내 정보
                </a>
                <a class="dropdown-item" th:href="@{/admin/member/settings}">
                    <i class="fas fa-cogs fa-sm fa-fw mr-2 text-gray-400"></i>
                    내 설정
                </a>
                <!-- 활동 로그 화면은 ADMIN 전용(AdminFeature.ACTION_LOG)이라 MANAGER에게는 숨긴다 -->
                <a class="dropdown-item" th:href="@{/admin/log/manage}" sec:authorize="hasRole('ADMIN')">
                    <i class="fas fa-list fa-sm fa-fw mr-2 text-gray-400"></i>
                    활동 로그
                </a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#" data-toggle="modal" data-target="#logoutModal">
                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                    로그아웃
                </a>
            </div>
        </li>

    </ul>

</nav>
<script th:src="@{/js/admin/topbar-search.js}" defer></script>
<script th:src="@{/js/admin/topbar-notification.js}" defer></script>
<script th:src="@{/js/admin/topbar-message.js}" defer></script>
</body>
</html>
