<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--
  민감 작업 재인증 안내(PLAN-sensitive-reauthentication.md 쟁점 4). 쿠키 자동 로그인(로그인 상태 유지) 세션에서만 보인다 —
  이 화면의 변경 API는 그 세션에서 403 REAUTHENTICATION_REQUIRED이고, /js/admin/reauth.js가 저장할 때 비밀번호 모달을 띄운다.
  입력하기 전에 미리 알린다. 폼 로그인 세션에는 그려지지 않는다. message: 화면별 문구.
-->
<div th:fragment="reauthNotice(message)" sec:authorize="isRememberMe()"
     id="reauthNotice" class="alert alert-info" role="status">
    <i class="fas fa-user-lock mr-1"></i><span th:text="${message}">안내</span>
</div>
</body>
</html>
