<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 로그아웃 확인 모달: topbar의 프로필 드롭다운(#logoutModal)이 여는 대상이라 topbar를 쓰는 모든 페이지에 포함해야 한다 -->
<div th:fragment="logoutModal" class="modal fade" id="logoutModal" tabindex="-1" role="dialog"
     aria-labelledby="logoutModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="logoutModalLabel">로그아웃 하시겠습니까?</h5>
                <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">현재 세션을 종료하려면 "로그아웃"을 선택하세요.</div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" data-dismiss="modal">취소</button>
                <form th:action="@{/admin/logout}" method="post" style="display: inline;">
                    <button class="btn btn-primary" type="submit">로그아웃</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
