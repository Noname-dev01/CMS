<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="adminSidebar">

<!--
  Menu 데이터 기반 동적 사이드바.
  - 노출 대상: AdminSidebarAdvice가 주입하는 sidebarMenus (활성 메뉴 + 역할 필터 적용 완료)
  - SB Admin 2 UI 제약에 따라 2단(최상위 + 하위 그룹)까지만 렌더링한다.
  - active 하이라이트: currentUri(AdminSidebarAdvice 주입)와 menuUrl 비교
-->
<ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

    <!-- Sidebar - Brand -->
    <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/admin}">
        <div class="sidebar-brand-icon rotate-n-15">
            <i class="fas fa-laugh-wink"></i>
        </div>
        <div class="sidebar-brand-text mx-3">ADMIN 페이지</div>
    </a>

    <hr class="sidebar-divider my-0">

    <th:block th:each="menu : ${sidebarMenus ?: {}}">

        <!-- 하위 메뉴 없음: 단일 링크 -->
        <li class="nav-item" th:if="${#lists.isEmpty(menu.children)}"
            th:classappend="${menu.menuUrl == currentUri} ? 'active'">
            <a class="nav-link" th:href="${menu.menuUrl != null} ? @{${menu.menuUrl}} : '#'">
                <i th:class="${menu.menuIcon ?: 'fas fa-fw fa-circle'}"></i>
                <span th:text="${menu.menuName}">메뉴</span></a>
        </li>

        <!-- 하위 메뉴 있음: collapse 그룹 (현재 페이지가 그룹 안에 있으면 펼침 유지) -->
        <li class="nav-item" th:unless="${#lists.isEmpty(menu.children)}"
            th:with="groupActive=${#lists.contains(menu.children.![menuUrl], currentUri)}"
            th:classappend="${groupActive} ? 'active'">
            <a class="nav-link" th:classappend="${!groupActive} ? 'collapsed'"
               href="#" data-toggle="collapse"
               th:attr="data-target='#collapseMenu' + ${menu.menuNo},aria-controls='collapseMenu' + ${menu.menuNo},aria-expanded=${groupActive}">
                <i th:class="${menu.menuIcon ?: 'fas fa-fw fa-folder'}"></i>
                <span th:text="${menu.menuName}">메뉴 그룹</span>
            </a>
            <div th:id="'collapseMenu' + ${menu.menuNo}" class="collapse"
                 th:classappend="${groupActive} ? 'show'" data-parent="#accordionSidebar">
                <div class="bg-white py-2 collapse-inner rounded">
                    <a class="collapse-item" th:each="child : ${menu.children}"
                       th:href="${child.menuUrl != null} ? @{${child.menuUrl}} : '#'"
                       th:classappend="${child.menuUrl == currentUri} ? 'active'">
                        <i th:class="${child.menuIcon ?: 'fas fa-fw fa-circle'}"></i>
                        <span class="ml-2" th:text="${child.menuName}">하위 메뉴</span></a>
                </div>
            </div>
        </li>

    </th:block>

    <hr class="sidebar-divider d-none d-md-block">

    <!-- Sidebar Toggler (Sidebar) -->
    <div class="text-center d-none d-md-inline">
        <button class="rounded-circle border-0" id="sidebarToggle"></button>
    </div>

</ul>

</body>
</html>
