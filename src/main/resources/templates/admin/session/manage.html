<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: adminHead}">
    <title>세션 관리</title>
</head>
<body id="page-top">
<link rel="stylesheet" th:href="@{/css/admin/admin-manage.css}">
<style>
    .session-card { background: white; border-radius: 0.35rem; box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15); border: 1px solid #e3e6f0; }
    .session-card + .session-card { margin-top: 1rem; }
    .session-card .card-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .session-meta { color: #858796; font-size: 0.85rem; }
</style>

<div id="wrapper">
    <div th:replace="~{admin/fragments/sidebar :: adminSidebar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{admin/fragments/topbar :: adminTopbar}"></div>

            <div class="container-fluid">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">세션 관리</h1>
                </div>

                <div id="pageAlert" class="alert alert-danger d-none" role="alert"></div>
                <div id="pageSuccess" class="alert alert-success d-none" role="alert"></div>

                <p class="text-muted small">
                    지금 로그인해 있는 관리자 세션을 보고 강제로 로그아웃시킵니다. 만료된 세션은 <strong>다음 요청부터</strong> 로그인이 필요하며
                    (즉시 차단이 아닙니다), 입력 중이던 내용은 잃을 수 있습니다. 지금 사용 중인 세션은 만료할 수 없습니다.
                    이름·역할은 로그인 시점 기준이고, 목록은 [새로고침]을 눌러야 갱신됩니다.
                </p>

                <div class="d-flex align-items-center mb-3" style="gap: 0.75rem;">
                    <button type="button" class="btn btn-primary" id="btnReload">
                        <i class="fas fa-sync-alt fa-sm mr-1"></i>새로고침
                    </button>
                    <span class="session-meta" id="summary"></span>
                </div>

                <div id="memberList"></div>
                <div id="emptyMessage" class="text-muted d-none">접속 중인 세션이 없습니다.</div>
            </div>
        </div>

        <div th:replace="~{admin/fragments/footer :: adminFooter}"></div>
    </div>
</div>

<div th:replace="~{admin/fragments/logout-modal :: logoutModal}"></div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>

<script>
    const SESSIONS_URL = "/admin/api/sessions";
    const ROLE_LABELS = { ROLE_ADMIN: "관리자", ROLE_MANAGER: "매니저" };

    const memberList = document.getElementById("memberList");
    const emptyMessage = document.getElementById("emptyMessage");
    const summary = document.getElementById("summary");
    const btnReload = document.getElementById("btnReload");
    const pageAlert = document.getElementById("pageAlert");
    const pageSuccess = document.getElementById("pageSuccess");

    let loading = false;       // 목록 조회 중
    let busy = false;          // 만료 요청 중(버튼 잠금)
    let redirecting = false;   // 401로 로그인 이동 중(추가 요청 금지)

    function csrfHeaders() {
        const token = document.querySelector('meta[name="_csrf"]');
        const header = document.querySelector('meta[name="_csrf_header"]');
        const headers = {};
        if (token && header) {
            headers[header.content || "X-CSRF-TOKEN"] = token.content;
        }
        return headers;
    }

    function showError(message) {
        pageSuccess.classList.add("d-none");
        pageAlert.textContent = message;
        pageAlert.classList.remove("d-none");
    }

    function showSuccess(message) {
        pageAlert.classList.add("d-none");
        pageSuccess.textContent = message;
        pageSuccess.classList.remove("d-none");
    }

    function clearMessages() {
        pageAlert.classList.add("d-none");
        pageSuccess.classList.add("d-none");
    }

    async function errorMessage(response, fallback) {
        if (response.status === 403) {
            return "이 작업을 수행할 권한이 없습니다.";   // 메서드 보안 403의 message는 영문이라 고정 문구를 쓴다
        }
        try {
            const body = await response.json();
            return body.message || fallback;
        } catch (e) {
            return fallback;
        }
    }

    // 다른 관리자가 내 세션을 만료시킨 경우 — 오래된 목록을 계속 보지 않게 비우고 로그인으로 보낸다(공통 스크립트에는 fetch 401 처리가 없다).
    function handleUnauthorized(response) {
        if (response.status !== 401) {
            return false;
        }
        redirecting = true;
        memberList.replaceChildren();
        window.location.href = "/admin/login";
        return true;
    }

    function formatTime(value) {
        return value ? String(value).replace("T", " ").slice(0, 19) : "-";
    }

    function setBusy(value) {
        busy = value;
        memberList.querySelectorAll("button").forEach(function (button) {
            if (value) {
                button.dataset.wasDisabled = button.disabled ? "1" : "";
                button.disabled = true;
            } else if (button.dataset.wasDisabled !== undefined) {
                button.disabled = button.dataset.wasDisabled === "1";
            }
        });
        btnReload.disabled = value || loading;
    }

    function makeButton(label, className, disabled, title, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = className;
        button.textContent = label;
        button.disabled = disabled;
        if (title) {
            button.title = title;
        }
        button.addEventListener("click", onClick);
        return button;
    }

    function render(data) {
        memberList.replaceChildren();
        const members = data.members || [];
        emptyMessage.classList.toggle("d-none", members.length > 0);
        summary.textContent = "회원 " + members.length + "명 · 세션 " + data.totalSessions + "개 · 조회 " + new Date().toLocaleTimeString("ko-KR");

        members.forEach(function (member) {
            const hasCurrent = member.sessions.some(function (s) { return s.current; });
            const others = member.sessions.filter(function (s) { return !s.current; }).length;

            const card = document.createElement("div");
            card.className = "session-card";

            const header = document.createElement("div");
            header.className = "card-header py-3";
            const title = document.createElement("div");
            const name = document.createElement("strong");
            name.textContent = member.userName + " (" + member.userId + ")";
            const role = document.createElement("span");
            role.className = "badge-role " + (member.role === "ROLE_ADMIN" ? "badge-role-admin" : "badge-role-manager") + " ml-2";
            role.textContent = ROLE_LABELS[member.role] || member.role;
            const meta = document.createElement("span");
            meta.className = "session-meta ml-2";
            meta.textContent = "세션 " + member.sessionCount + "개 · 마지막 요청 " + formatTime(member.lastRequestAt);
            title.append(name, role, meta);

            const allLabel = hasCurrent ? "내 다른 세션 모두 만료" : "이 회원의 세션 모두 만료";
            const allButton = makeButton(allLabel, "btn btn-sm btn-outline-danger", others === 0,
                others === 0 ? "만료할 다른 세션이 없습니다" : "", function () { expireMember(member, hasCurrent, others); });
            header.append(title, allButton);

            const body = document.createElement("div");
            body.className = "card-body p-0";
            const table = document.createElement("table");
            table.className = "table table-sm mb-0";
            const tbody = document.createElement("tbody");
            member.sessions.forEach(function (session) {
                const tr = document.createElement("tr");
                const tdTime = document.createElement("td");
                tdTime.textContent = "마지막 요청 " + formatTime(session.lastRequestAt);
                if (session.current) {
                    const badge = document.createElement("span");
                    badge.className = "badge badge-primary ml-2";
                    badge.textContent = "현재 세션";
                    tdTime.append(badge);
                }
                const tdAction = document.createElement("td");
                tdAction.className = "text-right";
                tdAction.append(makeButton("만료", "btn btn-sm btn-outline-danger", session.current,
                    session.current ? "지금 사용 중인 세션은 만료할 수 없습니다. 로그아웃을 사용하세요" : "",
                    function () { expireOne(member, session); }));
                tr.append(tdTime, tdAction);
                tbody.append(tr);
            });
            table.append(tbody);
            body.append(table);
            card.append(header, body);
            memberList.append(card);
        });
    }

    // 조회는 실패해도 재시도하지 않는다 — 오류만 표시하고 수동 [새로고침]을 기다린다(장애 중 요청 루프 방지).
    async function loadSessions() {
        if (loading || redirecting) {
            return;
        }
        loading = true;
        btnReload.disabled = true;
        try {
            const response = await fetch(SESSIONS_URL, { headers: { "Accept": "application/json" } });
            if (handleUnauthorized(response)) {
                return;
            }
            if (!response.ok) {
                showError(await errorMessage(response, "세션 목록을 불러오지 못했습니다."));
                return;
            }
            render(await response.json());
        } catch (e) {
            showError("세션 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
        } finally {
            loading = false;
            btnReload.disabled = busy;
        }
    }

    // 만료 요청: 성공·실패와 무관하게 끝나면 목록을 한 번만 다시 불러온다.
    async function runExpire(send, successMessage) {
        if (busy || redirecting) {
            return;
        }
        clearMessages();
        setBusy(true);
        try {
            const response = await send();
            if (handleUnauthorized(response)) {
                return;
            }
            if (!response.ok) {
                showError(await errorMessage(response, "세션을 만료하지 못했습니다."));
            } else {
                showSuccess(await successMessage(response));
            }
        } catch (e) {
            showError("세션을 만료하지 못했습니다. 잠시 후 다시 시도해 주세요.");
        } finally {
            setBusy(false);
            await loadSessions();
        }
    }

    function expireOne(member, session) {
        if (!confirm(member.userName + "(" + member.userId + ")의 세션을 만료하시겠습니까?\n대상은 다음 요청부터 로그인이 필요하며 입력 중인 내용을 잃을 수 있습니다.")) {
            return;
        }
        runExpire(function () {
            return fetch(SESSIONS_URL + "/" + encodeURIComponent(session.handle), { method: "DELETE", headers: csrfHeaders() });
        }, function () { return "세션을 만료했습니다."; });
    }

    function expireMember(member, hasCurrent, others) {
        const target = hasCurrent ? "내 다른 세션 " + others + "개" : member.userName + "(" + member.userId + ")의 세션 " + others + "개";
        if (!confirm(target + "를 모두 만료하시겠습니까?\n대상은 다음 요청부터 로그인이 필요하며 입력 중인 내용을 잃을 수 있습니다." + (hasCurrent ? "\n지금 사용 중인 세션은 유지됩니다." : ""))) {
            return;
        }
        runExpire(function () {
            return fetch(SESSIONS_URL + "?memberId=" + encodeURIComponent(member.memberId), { method: "DELETE", headers: csrfHeaders() });
        }, async function (response) {
            const body = await response.json();
            return body.expiredCount + "개 세션을 만료했습니다.";
        });
    }

    btnReload.addEventListener("click", function () { clearMessages(); loadSessions(); });
    loadSessions();
</script>

</body>
</html>
