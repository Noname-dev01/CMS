<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    사이트 탭의 조각(PLAN-site-menu.md D7). 사이트 설정 화면(admin/site/manage.html)이 포함한다.
    조각은 셋이다: sitePanel(목록 마크업·전용 CSS) / siteModal(등록·수정 모달) / siteScript(의존성 로딩 뒤에 포함). 조각 이름을 body·script로 짓지 않는다 — Thymeleaf가 HTML 요소 이름과 구분하지 못해 <body> 전체를 끌어온다.
    등록·수정 폼은 모달(siteModal)이고 삭제 확인은 confirm이다. 모달 조각은 화면 셸이 컨테이너 밖(body 쪽)에 따로 포함한다 — 컨테이너 안에 두면 배경 뒤로 깔릴 수 있다.
    패널 CSS는 #siteTabPanel로 스코프한다(래퍼 ID 유지 — 조각 CSS가 의존한다).
    사이트 API는 전부 ADMIN 전용이라 이 탭을 숨기는 것은 UX일 뿐 최종 판정이 아니다.
-->
<body>

<div th:fragment="sitePanel">
<style>
    #siteTabPanel .site-table td, #siteTabPanel .site-table th { vertical-align: middle; }
    #siteTabPanel .site-table tr.site-selected { background-color: #eaf0ff; }
    #siteTabPanel .site-table tr.site-inactive td { color: #858796; }
</style>
<div id="siteFormSuccess" class="alert alert-success d-none" role="alert"></div>
<div class="row">
    <div class="col-12 mb-4">
        <div class="card shadow">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold text-primary">사이트 목록</h6>
                <button type="button" class="btn btn-primary btn-sm" id="siteBtnNew">새 공개 사이트</button>
            </div>
            <div class="card-body">
                <div id="siteListAlert" class="alert alert-danger d-none" role="alert"></div>
                <div class="table-responsive">
                    <table class="table table-sm table-hover site-table mb-0">
                        <thead>
                        <tr>
                            <th>키</th>
                            <th>이름</th>
                            <th>종류</th>
                            <th class="text-center">외부 링크</th>
                            <th class="text-center">사용</th>
                            <th class="text-center">기본</th>
                            <th class="text-right">메뉴</th>
                        </tr>
                        </thead>
                        <tbody id="siteTableBody"></tbody>
                    </table>
                </div>
                <small class="form-text text-muted mt-2">
                    사이트 키는 공개 주소의 접두어(/키/…)가 될 값이라 만든 뒤에는 바꿀 수 없습니다. 접두어 없는 주소 /는 [기본] 사이트로 이동합니다.
                    관리자·main 사이트와 현재 기본 사이트는 삭제·비활성화할 수 없고, 메뉴가 있는 사이트는 삭제할 수 없습니다(비활성화만 가능).
                </small>
            </div>
        </div>
    </div>
</div>
</div>

<!-- 등록·수정 모달: 배경 클릭·ESC로 닫히지 않는다(입력 보호). 푸터 [저장]은 form 속성으로 폼에 연결해 브라우저 기본 검증을 유지한다. 미저장 입력이 있으면 닫기 전에 확인한다. -->
<div th:fragment="siteModal">
<div class="modal fade admin-detail-modal" id="siteModal" tabindex="-1" role="dialog" aria-labelledby="siteFormModeLabel" aria-hidden="true"
     data-backdrop="static" data-keyboard="false" data-state="closed">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <div class="detail-hero">
                    <div class="detail-hero-copy">
                        <h5 class="modal-title" id="siteFormModeLabel">새 공개 사이트 추가</h5>
                    </div>
                </div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" id="siteBtnCloseX">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div id="siteFormAlert" class="alert alert-danger d-none" role="alert"></div>
                <form id="siteForm" autocomplete="off">
                    <div class="form-group">
                        <label for="siteKeyInput">사이트 키</label>
                        <input type="text" class="form-control" id="siteKeyInput" maxlength="30" required aria-describedby="siteKeyHelp">
                        <small id="siteKeyHelp" class="form-text text-muted">소문자·숫자·하이픈 2~30자. 예약어(admin, faq 등)는 쓸 수 없고, 만든 뒤에는 바꿀 수 없습니다.</small>
                    </div>
                    <div class="form-group">
                        <label for="siteNameInput">사이트 이름</label>
                        <input type="text" class="form-control" id="siteNameInput" maxlength="100" required>
                    </div>
                    <div class="form-group">
                        <div class="custom-control custom-switch">
                            <input type="checkbox" class="custom-control-input" id="siteAllowExternal">
                            <label class="custom-control-label" for="siteAllowExternal">메뉴에 외부 링크(http/https) 허용</label>
                        </div>
                        <small id="siteAllowExternalHelp" class="form-text text-muted">끄려면 이 사이트의 외부 링크 메뉴를 먼저 내부 경로로 바꿔야 합니다.</small>
                    </div>
                    <div class="form-group" id="siteUseYnGroup">
                        <div class="custom-control custom-switch">
                            <input type="checkbox" class="custom-control-input" id="siteUseYn" checked>
                            <label class="custom-control-label" for="siteUseYn">사용</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger mr-auto d-none" id="siteBtnDelete">삭제</button>
                <button type="button" class="btn btn-outline-primary d-none" id="siteBtnDefault">기본 사이트로 지정</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal" id="siteBtnClose">닫기</button>
                <button type="submit" class="btn btn-primary" id="siteBtnSave" form="siteForm">저장</button>
            </div>
        </div>
    </div>
</div>
</div>

<th:block th:fragment="siteScript">
<script>
$(document).ready(function () {
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

    const tbody = document.getElementById('siteTableBody');
    const listAlert = document.getElementById('siteListAlert');
    const formAlert = document.getElementById('siteFormAlert');         // 모달 안 오류
    const formSuccess = document.getElementById('siteFormSuccess');     // 모달을 닫은 뒤 페이지 상단 성공 안내
    const modalEl = document.getElementById('siteModal');
    const modalTitle = document.getElementById('siteFormModeLabel');
    const form = document.getElementById('siteForm');
    const keyInput = document.getElementById('siteKeyInput');
    const nameInput = document.getElementById('siteNameInput');
    const allowExternalInput = document.getElementById('siteAllowExternal');
    const useYnInput = document.getElementById('siteUseYn');
    const useYnGroup = document.getElementById('siteUseYnGroup');
    const btnNew = document.getElementById('siteBtnNew');
    const btnSave = document.getElementById('siteBtnSave');
    const btnDelete = document.getElementById('siteBtnDelete');
    const btnDefault = document.getElementById('siteBtnDefault');
    const btnClose = document.getElementById('siteBtnClose');
    const btnCloseX = document.getElementById('siteBtnCloseX');

    let sites = [];            // 서버 응답 스냅샷
    let mode = null;           // null | 'create' | 'edit'
    let editing = null;        // 편집 대상 스냅샷(서버 응답) — 삭제·수정의 대상은 폼이 아니라 이 값이다
    let saving = false;
    let listSeq = 0;           // 늦게 도착한 이전 목록 응답을 폐기하는 세대
    let baseline = null;       // 폼을 채운 시점의 값 — 미저장 변경 판정 기준
    // 모달 상태: closed → opening(show 호출~shown) → open → closing(hide 시작~hidden) → closed.
    // Bootstrap 4는 전환 중(opening·closing)의 show/hide를 무시하므로 상태가 closed일 때만 새로 열고, 닫기는 closeModal()을 거친다.
    // 상태는 data-state에도 남겨 브라우저 시험이 열림 전환이 끝났는지 읽을 수 있게 한다(이 스크립트는 클로저라 변수를 밖에서 읽을 수 없다).
    let modalState = 'closed';
    let pendingClose = false;
    let forceClose = false;    // 저장·삭제·기본 지정 뒤의 프로그램 닫기는 미저장 확인을 거치지 않는다

    function setModalState(state) {
        modalState = state;
        modalEl.dataset.state = state;
    }

    function formValues() {
        return JSON.stringify([keyInput.value, nameInput.value, allowExternalInput.checked, useYnInput.checked]);
    }

    function isDirty() {
        return mode !== null && baseline !== null && formValues() !== baseline;
    }


    function csrfHeaders() {
        const headers = { 'Content-Type': 'application/json' };
        headers[csrfHeader] = csrfToken;
        return headers;
    }

    async function errorMessage(response, fallback) {
        try {
            const body = await response.json();
            return body.message || fallback;
        } catch (e) {
            return fallback;
        }
    }

    function show(el, message) {
        el.textContent = message;
        el.classList.remove('d-none');
    }

    function hide(el) {
        el.classList.add('d-none');
        el.textContent = '';
    }

    function refreshUi() {
        const locked = saving;
        btnNew.disabled = locked;
        btnSave.disabled = locked || mode === null;
        btnDelete.disabled = locked;
        btnClose.disabled = locked;                          // 저장 중에는 닫을 수 없다(응답 처리와 모달 상태가 어긋나지 않게)
        btnCloseX.disabled = locked;
        const editable = !locked && mode !== null;
        keyInput.disabled = !editable || mode === 'edit';   // 키는 만든 뒤 바꿀 수 없다
        nameInput.disabled = !editable;
        // 관리자 사이트는 외부 링크를 허용할 수 없고, 시드 사이트는 비활성화할 수 없다(서버가 최종 판정)
        allowExternalInput.disabled = !editable || (editing !== null && editing.siteType === 'ADMIN');
        useYnInput.disabled = !editable || (editing !== null && editing.seed === true);
        useYnGroup.classList.toggle('d-none', mode !== 'edit');
        const canDelete = mode === 'edit' && editing !== null && editing.seed !== true && editing.menuCount === 0;
        btnDelete.classList.toggle('d-none', !canDelete);
        // 기본 지정은 활성 공개 사이트에서만, 미저장 입력이 없을 때만 보인다(요청은 폼이 아니라 defaultSite만 보낸다)
        const canDefault = mode === 'edit' && editing !== null && editing.siteType === 'PUBLIC' && editing.useYn === true
            && editing.defaultSite !== true && !isDirty();
        btnDefault.classList.toggle('d-none', !canDefault);
        btnDefault.disabled = locked;
    }

    function setForm(values) {
        keyInput.value = values.siteKey;
        nameInput.value = values.siteName;
        allowExternalInput.checked = values.allowExternalLink;
        useYnInput.checked = values.useYn;
        baseline = formValues();
    }

    function closeModal() {
        forceClose = true;
        if (modalState === 'open') {
            $(modalEl).modal('hide');
        } else if (modalState === 'opening') {
            pendingClose = true;                             // 열림 전환 중의 hide()는 무시되므로 shown 이후에 닫는다
        }
    }

    function openModal() {
        forceClose = false;
        setModalState('opening');
        $(modalEl).modal('show');
    }

    $(modalEl).on('shown.bs.modal', function () {
        setModalState('open');
        if (pendingClose) {
            pendingClose = false;
            $(modalEl).modal('hide');
        } else if (mode === 'create') {
            keyInput.focus();
        }
    });
    // ×·[닫기]로 닫을 때 미저장 입력이 있으면 확인한다. 취소하면 닫힘을 막는다(preventDefault).
    $(modalEl).on('hide.bs.modal', function (event) {
        if (!forceClose && isDirty() && !window.confirm('저장하지 않은 변경이 있습니다. 버리고 닫을까요?')) {
            event.preventDefault();
            return;
        }
        setModalState('closing');
    });
    $(modalEl).on('hidden.bs.modal', function () {
        setModalState('closed');
        pendingClose = false;
        forceClose = false;
        hide(formAlert);
        reset();                                             // 다음에 열 때 이전 입력·편집 대상이 남지 않게 한다
    });

    function startCreate() {
        if (modalState !== 'closed' || saving) {
            return;
        }
        mode = 'create';
        editing = null;
        setForm({ siteKey: '', siteName: '', allowExternalLink: false, useYn: true });
        modalTitle.textContent = '새 공개 사이트 추가';
        hide(formAlert);
        hide(formSuccess);
        refreshUi();
        renderTable();
        openModal();
    }

    function startEdit(site) {
        if (modalState !== 'closed' || saving) {
            return;
        }
        mode = 'edit';
        editing = site;
        setForm({ siteKey: site.siteKey, siteName: site.siteName, allowExternalLink: site.allowExternalLink === true, useYn: site.useYn === true });
        modalTitle.textContent = '사이트 수정: ' + site.siteName;
        hide(formAlert);
        hide(formSuccess);
        refreshUi();
        renderTable();
        openModal();
    }

    function reset() {
        mode = null;
        editing = null;
        baseline = null;
        form.reset();
        modalTitle.textContent = '새 공개 사이트 추가';
        hide(formAlert);
        refreshUi();
        renderTable();
    }

    function cell(row, text, className) {
        const td = document.createElement('td');
        td.textContent = text;
        if (className) {
            td.className = className;
        }
        row.appendChild(td);
        return td;
    }

    function renderTable() {
        tbody.textContent = '';
        sites.forEach(function (site) {
            const row = document.createElement('tr');
            row.style.cursor = 'pointer';
            row.dataset.siteId = String(site.id);
            if (editing !== null && editing.id === site.id) {
                row.classList.add('site-selected');
            }
            if (site.useYn !== true) {
                row.classList.add('site-inactive');
            }
            cell(row, site.siteKey);
            cell(row, site.siteName);
            cell(row, site.siteType === 'ADMIN' ? '관리자' : '공개');
            cell(row, site.allowExternalLink === true ? '허용' : '불가', 'text-center');
            cell(row, site.useYn === true ? '사용' : '비활성', 'text-center');
            cell(row, site.defaultSite === true ? '기본' : '', 'text-center font-weight-bold');
            cell(row, String(site.menuCount), 'text-right');
            row.addEventListener('click', function () {
                if (saving) {
                    return;
                }
                if (isDirty() && !window.confirm('저장하지 않은 변경이 있습니다. 버리고 이 사이트를 선택할까요?')) {
                    return;
                }
                startEdit(site);
            });
            tbody.appendChild(row);
        });
    }

    // true: 이 요청의 응답이 반영됨 / false: 실패하거나 더 최신 요청에 밀려 폐기됨(호출자가 서버가 돌려준 값으로 보정한다)
    async function loadSites() {
        const seq = ++listSeq;
        hide(listAlert);
        try {
            const response = await fetch('/admin/api/sites');
            if (!response.ok) {
                throw new Error(await errorMessage(response, '사이트 목록 조회에 실패했습니다.'));
            }
            const data = await response.json();
            if (seq !== listSeq) {
                return false;
            }
            sites = data;
            if (editing !== null) {
                // 선택 중인 사이트가 서버 최신값으로 바뀌었어도 폼의 미저장 입력은 유지하되, 삭제 가능 여부 등 스냅샷은 갱신한다.
                const fresh = sites.find(function (s) { return s.id === editing.id; });
                if (fresh) {
                    editing = fresh;
                } else if (modalState === 'opening' || modalState === 'open') {
                    // 다른 관리자가 지웠다 — 열린 폼을 비우지 않고 안내만 한다(입력은 둔다). 저장하면 서버가 거부한다.
                    show(formAlert, '이 사이트가 삭제되었거나 목록에 없습니다. 저장하면 실패할 수 있으니 닫고 목록을 확인해 주세요.');
                }
            }
            renderTable();
            refreshUi();
            return true;
        } catch (error) {
            if (seq === listSeq) {
                show(listAlert, error && error.message ? error.message : '사이트 목록 조회 중 오류가 발생했습니다.');
            }
            return false;
        }
    }


    btnNew.addEventListener('click', function () {
        if (isDirty() && !window.confirm('저장하지 않은 변경이 있습니다. 버리고 새 사이트를 작성할까요?')) {
            return;
        }
        startCreate();
    });

    // 입력이 바뀌면 [기본 사이트로 지정]의 노출 조건(미저장 입력 없음)이 달라진다.
    form.addEventListener('input', refreshUi);
    form.addEventListener('change', refreshUi);

    // 푸터 [저장]은 form 속성으로 이 폼을 제출한다 — 브라우저 기본 검증(required)을 통과해야 이 핸들러가 불린다.
    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        hide(formAlert);
        hide(formSuccess);
        if (saving || mode === null) {
            return;
        }
        const payload = mode === 'create'
            ? { siteKey: keyInput.value.trim(), siteName: nameInput.value.trim(), allowExternalLink: allowExternalInput.checked }
            : { siteName: nameInput.value.trim(), allowExternalLink: allowExternalInput.checked, useYn: useYnInput.checked };
        const target = mode === 'create' ? null : editing;
        saving = true;
        refreshUi();
        try {
            const response = mode === 'create'
                ? await fetch('/admin/api/sites', { method: 'POST', headers: csrfHeaders(), body: JSON.stringify(payload) })
                : await fetch('/admin/api/sites/' + encodeURIComponent(target.id), { method: 'PATCH', headers: csrfHeaders(), body: JSON.stringify(payload) });
            if (!response.ok) {
                throw new Error(await errorMessage(response, '사이트 저장에 실패했습니다.'));
            }
            const saved = await response.json();
            const refreshed = await loadSites();
            if (!refreshed) {
                // 목록 재조회가 실패했다 — 저장은 서버에 반영됐으므로 낡은 스냅샷(저장 전 값)으로 목록을 두지 않고
                // 서버가 돌려준 값으로 목록 스냅샷을 보정한다(다시 연 행이 저장 전 값이면 다음 저장이 방금 바꾼 설정을 되돌린다).
                const index = sites.findIndex(function (s) { return s.id === saved.id; });
                if (index >= 0) {
                    sites[index] = saved;
                } else {
                    sites.push(saved);
                }
                renderTable();
            }
            closeModal();
            show(formSuccess, '저장했습니다.');
        } catch (error) {
            show(formAlert, error && error.message ? error.message : '사이트 저장 중 오류가 발생했습니다.');
        } finally {
            saving = false;
            refreshUi();
        }
    });

    btnDefault.addEventListener('click', async function () {
        hide(formAlert);
        hide(formSuccess);
        const target = editing;
        if (saving || mode !== 'edit' || target === null || isDirty()) {
            return;
        }
        saving = true;
        refreshUi();
        try {
            const response = await fetch('/admin/api/sites/' + encodeURIComponent(target.id),
                { method: 'PATCH', headers: csrfHeaders(), body: JSON.stringify({ defaultSite: true }) });
            if (!response.ok) {
                throw new Error(await errorMessage(response, '기본 사이트 지정에 실패했습니다.'));
            }
            const saved = await response.json();
            await loadSites();   // 옛 기본 사이트 행의 표시도 바뀌므로 목록 전체를 다시 읽는다
            const fresh = sites.find(function (s) { return s.id === saved.id; }) || saved;
            closeModal();
            show(formSuccess, '기본 사이트로 지정했습니다. 이제 /는 /' + fresh.siteKey + '로 이동합니다.');
        } catch (error) {
            show(formAlert, error && error.message ? error.message : '기본 사이트 지정 중 오류가 발생했습니다.');
        } finally {
            saving = false;
            refreshUi();
        }
    });

    btnDelete.addEventListener('click', async function () {
        hide(formAlert);
        hide(formSuccess);
        const target = editing;
        if (saving || mode !== 'edit' || target === null) {
            return;
        }
        if (!window.confirm('사이트 "' + target.siteKey + '"을(를) 삭제합니다. 복구할 수 없습니다. 계속할까요?')) {
            return;
        }
        saving = true;
        refreshUi();
        try {
            const response = await fetch('/admin/api/sites/' + encodeURIComponent(target.id), { method: 'DELETE', headers: csrfHeaders() });
            if (!response.ok && response.status !== 404) {
                throw new Error(await errorMessage(response, '사이트 삭제에 실패했습니다.'));
            }
            // 재조회·알림이 끝날 때까지 saving을 유지한다(finally에서만 푼다) — 중간에 풀면 그 사이 새 저장이 시작돼 폼 입력이 유실된다.
            closeModal();
            await loadSites();
            show(formSuccess, response.status === 404 ? '이미 삭제된 사이트입니다.' : '사이트를 삭제했습니다.');
        } catch (error) {
            show(formAlert, error && error.message ? error.message : '사이트 삭제 중 오류가 발생했습니다.');
        } finally {
            saving = false;
            refreshUi();
        }
    });

    // 미저장 입력이 있는 채로 페이지를 떠나려 하면 확인창을 띄운다.
    window.addEventListener('beforeunload', function (event) {
        if (isDirty() || saving) {
            event.preventDefault();
            event.returnValue = '';
        }
    });

    reset();
    loadSites();
});
</script>
</th:block>

</body>
</html>
