<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <!-- 토큰 유출 심층 방어 — fragment는 서버로 전송되지 않지만 Referer 경로도 차단한다 -->
    <meta name="referrer" content="no-referrer">
    <!-- login.html은 head.html 프래그먼트를 쓰지 않으므로 CSRF meta를 직접 렌더링한다 -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>새 비밀번호 설정</title>

    <!-- 이 페이지는 토큰을 다루므로 외부 도메인 리소스(CDN 폰트 등)를 로드하지 않는다 — 로컬 vendor만 사용 -->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="/css/admin/login.css" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-xl-10 col-lg-12 col-md-9">

            <div class="card o-hidden border-0 shadow-lg">
                <div class="card-body p-0">
                    <!-- Nested Row within Card Body -->
                    <div class="row">
                        <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
                        <div class="col-lg-6">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-2">새 비밀번호 설정</h1>
                                    <p class="mb-4 small text-gray-600">사용하실 새 비밀번호를 입력해 주세요.</p>
                                </div>
                                <div id="resultAlert" class="alert text-center mb-3 d-none" role="alert"></div>
                                <form id="resetConfirmForm" class="user">
                                    <div class="form-group">
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text">
                                                    <i class="fas fa-lock fa-fw"></i>
                                                </span>
                                            </div>
                                            <input type="password" id="newPasswordInput"
                                                   class="form-control form-control-user"
                                                   placeholder="새 비밀번호 (4자 이상)" required>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text">
                                                    <i class="fas fa-lock fa-fw"></i>
                                                </span>
                                            </div>
                                            <input type="password" id="confirmPasswordInput"
                                                   class="form-control form-control-user"
                                                   placeholder="새 비밀번호 확인" required>
                                        </div>
                                    </div>
                                    <button type="submit" id="submitButton" class="btn btn-primary btn-user btn-block">
                                        비밀번호 재설정
                                    </button>
                                </form>
                                <div class="text-center d-none" id="loginLinkWrap">
                                    <a class="btn btn-success btn-user btn-block" th:href="@{/admin/login}">
                                        로그인하러 가기
                                    </a>
                                </div>
                                <hr>
                                <div class="text-center">
                                    <a class="small text-primary" th:href="@{/admin/password-reset}">재설정 링크 다시 요청</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- 로컬 vendor 스크립트만 사용 -->
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>

<script>
    (function () {
        var form = document.getElementById('resetConfirmForm');
        var newPasswordInput = document.getElementById('newPasswordInput');
        var confirmPasswordInput = document.getElementById('confirmPasswordInput');
        var submitButton = document.getElementById('submitButton');
        var resultAlert = document.getElementById('resultAlert');
        var loginLinkWrap = document.getElementById('loginLinkWrap');

        function showAlert(type, message) {
            resultAlert.classList.remove('d-none', 'alert-success', 'alert-danger');
            resultAlert.classList.add('alert-' + type);
            resultAlert.textContent = message;
        }

        // 로드 직후 fragment의 토큰을 JS 변수로 옮기고 URL에서 제거한다.
        // 토큰을 DOM 텍스트나 console에 출력하지 않는다.
        var resetToken = null;
        if (location.hash && location.hash.indexOf('#token=') === 0) {
            resetToken = location.hash.substring('#token='.length);
            history.replaceState(null, '', location.pathname + location.search);
        }

        // 토큰 부재/형식 오류 — 직접 진입, fragment 제거 후 새로고침 등. API 호출 없이 안내한다.
        if (!resetToken || !/^[0-9a-f]{64}$/.test(resetToken)) {
            submitButton.disabled = true;
            newPasswordInput.disabled = true;
            confirmPasswordInput.disabled = true;
            showAlert('danger', '링크가 유효하지 않습니다. 아래에서 재설정 링크를 다시 요청해 주세요.');
            return;
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            var newPassword = newPasswordInput.value;
            var confirmPassword = confirmPasswordInput.value;
            if (!newPassword || newPassword.length < 4) {
                showAlert('danger', '새 비밀번호는 4자 이상이어야 합니다.');
                return;
            }
            if (newPassword !== confirmPassword) {
                showAlert('danger', '새 비밀번호와 비밀번호 확인이 일치하지 않습니다.');
                return;
            }

            var csrfToken = document.querySelector('meta[name="_csrf"]').content;
            var csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

            submitButton.disabled = true;

            var headers = { 'Content-Type': 'application/json' };
            headers[csrfHeader || 'X-CSRF-TOKEN'] = csrfToken;

            fetch('/admin/api/password-resets', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({
                    token: resetToken,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                })
            }).then(function (response) {
                if (response.ok) {
                    // 204 — 성공 판정에 본문 파싱 금지
                    showAlert('success', '비밀번호가 변경되었습니다. 새 비밀번호로 로그인해 주세요.');
                    form.classList.add('d-none');
                    loginLinkWrap.classList.remove('d-none');
                } else if (response.status === 401 || response.status === 403) {
                    // 세션/CSRF 만료 — fragment는 이미 제거됐으므로 새로고침이 아니라 메일 링크 재클릭을 안내한다
                    showAlert('danger', '세션이 만료되었습니다. 메일의 링크를 다시 클릭해 다시 시도해 주세요.');
                    submitButton.disabled = false;
                } else {
                    showAlert('danger', '링크가 유효하지 않거나 만료되었습니다. 다시 요청해 주세요.');
                    submitButton.disabled = false;
                }
            }).catch(function () {
                showAlert('danger', '요청을 처리할 수 없습니다. 잠시 후 다시 시도해 주세요.');
                submitButton.disabled = false;
            });
        });
    })();
</script>

</body>

</html>
