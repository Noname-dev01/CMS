<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>2단계 인증 등록 완료</title>

    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="/css/admin/login.css" rel="stylesheet">
</head>

<body class="bg-gradient-primary">

<!-- 2단계 인증 강제 등록 완료 — 복구 코드는 이 응답에서만 보인다(PLAN-totp-required-admin.md 결정 2) -->
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-xl-6 col-lg-7 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-4">
                <div class="card-body p-5">
                    <div class="text-center">
                        <h1 class="h4 text-gray-900 mb-2">2단계 인증 등록 완료</h1>
                        <p class="small text-muted mb-3">아래 복구 코드를 안전한 곳에 보관하세요. 인증 앱을 쓸 수 없을 때 한 번씩 쓸 수 있으며,
                            <strong>이 화면을 벗어나면 다시 볼 수 없습니다.</strong></p>
                    </div>
                    <pre id="recoveryCodeList" class="bg-light p-3 border rounded text-center mb-4"
                         th:text="${#strings.listJoin(recoveryCodes, '&#10;')}">CODES</pre>
                    <p class="small text-muted text-center mb-3">보안을 위해 로그인이 끝났습니다. 다시 로그인한 뒤 인증 앱의 코드를 입력하세요.</p>
                    <a class="btn btn-primary btn-user btn-block" href="/admin/login" id="btnRelogin">보관했습니다 — 다시 로그인</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>

</html>
