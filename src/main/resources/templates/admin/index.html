<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{admin/fragments/head :: adminHead}"></head>

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/sidebar :: adminSidebar}"></div>
    <!-- End of Sidebar -->

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">

            <!-- Topbar -->
            <div th:replace="~{admin/fragments/topbar :: adminTopbar}"></div>
            <!-- End of Topbar -->

            <!-- Begin Page Content -->
            <div class="container-fluid">

                <!-- Page Heading -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">대시보드</h1>
                </div>

                <!-- Content Row -->
                <div class="row">

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-primary shadow h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                            신규회원</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800"
                                             th:text="${stats.newMembersThisMonth ?: '-'}">0</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-calendar fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-success shadow h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                            오늘 방문자 수</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800"
                                             th:text="${stats.todayVisitors ?: '-'}">0</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-eye fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-info shadow h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                            이번달 방문자 수
                                        </div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800"
                                             th:text="${stats.monthVisitors ?: '-'}">0</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-clipboard-list fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card border-left-warning shadow h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                                            총 방문자 수</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800"
                                             th:text="${stats.totalVisitors ?: '-'}">0</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-comments fa-2x text-gray-300"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Content Row -->

                <div class="row">

                    <!-- 방문자 추이 차트 -->
                    <div class="col-12">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">최근 7일 방문자 추이</h6>
                            </div>
                            <div class="card-body">
                                <!-- null 허용은 타 @WebMvcTest 목 기본값 호환용 방어 — 운영 계약은 서비스가 null을 반환하지 않는다 -->
                                <p th:if="${dailyVisitors == null or #lists.isEmpty(dailyVisitors)}"
                                   class="text-center text-gray-500 my-5">차트를 불러올 수 없습니다</p>
                                <div th:unless="${dailyVisitors == null or #lists.isEmpty(dailyVisitors)}"
                                     class="chart-area">
                                    <canvas id="visitorTrendChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 콘텐츠 현황 (조회수·다운로드 수). contentStats가 null이면 조회 불가 — 방문자 카드와 폴백이 분리돼 있다 -->
                <div class="row" id="contentStats">
                    <div class="col-12">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">콘텐츠 현황</h6>
                            </div>
                            <div class="card-body">
                                <p th:if="${contentStats == null}" class="text-center text-gray-500 my-3">콘텐츠 현황을 불러올 수 없습니다</p>
                                <div th:unless="${contentStats == null}">
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <div class="text-xs font-weight-bold text-uppercase mb-1">총 조회수</div>
                                            <div class="h5 mb-0 font-weight-bold text-gray-800" id="contentTotalViews"
                                                 th:text="${contentStats.totalViews}">0</div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="text-xs font-weight-bold text-uppercase mb-1">총 다운로드 수</div>
                                            <div class="h5 mb-0 font-weight-bold text-gray-800" id="contentTotalDownloads"
                                                 th:text="${contentStats.totalDownloads}">0</div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6 mb-3">
                                            <h6 class="font-weight-bold">조회수 상위 게시글</h6>
                                            <p th:if="${#lists.isEmpty(contentStats.topPosts)}" class="text-gray-500 mb-0">집계된 조회가 없습니다</p>
                                            <ol th:unless="${#lists.isEmpty(contentStats.topPosts)}" class="pl-3 mb-0" id="topPosts">
                                                <li th:each="p : ${contentStats.topPosts}">
                                                    <a th:href="@{/admin/board/posts(boardId=${p.boardId}, id=${p.id})}" th:text="${p.title}">제목</a>
                                                    <span class="text-gray-500 small">
                                                        (<span th:text="${p.boardName}">게시판</span>) · <span th:text="${p.viewCount}">0</span>회</span>
                                                </li>
                                            </ol>
                                        </div>
                                        <div class="col-lg-6 mb-3">
                                            <h6 class="font-weight-bold">다운로드 상위 첨부</h6>
                                            <p th:if="${#lists.isEmpty(contentStats.topAttachments)}" class="text-gray-500 mb-0">집계된 다운로드가 없습니다</p>
                                            <ol th:unless="${#lists.isEmpty(contentStats.topAttachments)}" class="pl-3 mb-0" id="topAttachments">
                                                <li th:each="a : ${contentStats.topAttachments}">
                                                    <a th:href="@{/admin/board/posts(boardId=${a.boardId}, id=${a.postId})}" th:text="${a.filename}">파일</a>
                                                    <span class="text-gray-500 small">
                                                        (<span th:text="${a.postTitle}">글</span> · <span th:text="${a.boardName}">게시판</span>) · <span th:text="${a.downloadCount}">0</span>회</span>
                                                </li>
                                            </ol>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <!-- /.container-fluid -->

        </div>
        <!-- End of Main Content -->

        <!-- Footer -->
       <div th:replace="~{admin/fragments/footer :: adminFooter}"></div>
        <!-- End of Footer -->

    </div>
    <!-- End of Content Wrapper -->

</div>
<!-- End of Page Wrapper -->

<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>

<div th:replace="~{admin/fragments/logout-modal :: logoutModal}"></div>

<!-- Bootstrap core JavaScript-->
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- Core plugin JavaScript-->
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

<!-- Custom scripts for all pages-->
<script src="/js/sb-admin-2.min.js"></script>

<!-- Page level plugins -->
<script src="/vendor/chart.js/Chart.min.js"></script>

<!-- Page level custom scripts -->
<script th:inline="javascript">
    /* 방문자 추이 데이터 — 컨트롤러 모델 주입 (date: ISO yyyy-MM-dd, count: long) */
    const DAILY_VISITORS = /*[[${dailyVisitors}]]*/ [];
</script>
<script src="/js/admin/dashboard-chart.js"></script>

</body>

</html>
