<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: adminHead}">
    <title>배너 관리</title>
</head>
<link rel="stylesheet" th:href="@{/css/admin/admin-manage.css}">
<body id="page-top">
<!-- 페이지 전용 CSS는 body 시작 지점에 둔다(menu/manage.html 컨벤션 — th:replace가 head를 통째로 치환한다). -->
<style>
    .banner-card {
        background: white;
        border-radius: 0.35rem;
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        border: 1px solid #4e73df;
    }
    .banner-row { cursor: pointer; }
    .banner-row.table-active td { font-weight: bold; }
    .banner-thumb { width: 120px; height: 48px; object-fit: cover; border-radius: 4px; background: #eaecf4; }
</style>

<div id="wrapper">
    <div th:replace="~{admin/fragments/sidebar :: adminSidebar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{admin/fragments/topbar :: adminTopbar}"></div>

            <div class="container-fluid">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">배너 관리</h1>
                </div>

                <div id="pageAlert" class="alert alert-danger d-none" role="alert"></div>
                <div id="pageSuccess" class="alert alert-success d-none" role="alert"></div>

                <p class="text-muted small">
                    공개 메인(/)에 노출할 배너를 관리합니다. 배너는 최대 10개까지 등록할 수 있고, 위에 있는 배너가 먼저 노출됩니다.
                    노출 기간은 <strong>시작 시각 이상, 종료 시각 미만</strong>이며 분 단위입니다. 이미지는 등록 후 바꿀 수 없으니 바꾸려면 삭제 후 다시 등록하세요.
                </p>

                <div class="row">
                    <div class="col-12 mb-4">
                        <div class="banner-card">
                            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                                <h6 class="m-0 font-weight-bold text-primary">배너 목록</h6>
                                <div>
                                    <button type="button" class="btn btn-sm btn-primary" id="btnNew">새 배너</button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary" id="btnReload">새로고침</button>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-bordered table-hover mb-0">
                                        <thead class="thead-light">
                                        <tr><th>이미지</th><th>제목</th><th>대상</th><th>노출 기간</th><th>상태</th><th>순서</th></tr>
                                        </thead>
                                        <tbody id="bannerList">
                                        <tr><td colspan="6" class="text-muted">불러오는 중...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="mt-3 d-none" id="orderBar">
                                    <span class="text-warning mr-2">순서를 바꿨습니다. 저장해야 반영됩니다.</span>
                                    <button type="button" class="btn btn-sm btn-primary" id="btnOrderSave">순서 저장</button>
                                    <button type="button" class="btn btn-sm btn-outline-secondary" id="btnOrderCancel">취소</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div th:replace="~{admin/fragments/footer :: adminFooter}"></div>
    </div>
</div>

<!-- 등록·수정 모달: 배경 클릭·ESC로 닫히지 않는다(입력 보호). 푸터 [등록/저장]은 form 속성으로 폼에 연결해 브라우저 기본 검증을 유지한다. -->
<div class="modal fade admin-detail-modal" id="bannerModal" tabindex="-1" role="dialog" aria-labelledby="formTitle" aria-hidden="true"
     data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <div class="detail-hero">
                    <div class="detail-hero-copy">
                        <h5 class="modal-title" id="formTitle">새 배너</h5>
                    </div>
                </div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" id="btnModalCloseX">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div id="modalAlert" class="alert alert-danger d-none" role="alert"></div>
                <form id="bannerForm">
                                    <div class="form-group">
                                        <label for="bannerTitle">제목 (이미지 대체 텍스트)</label>
                                        <input type="text" class="form-control" id="bannerTitle" maxlength="200" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="bannerLink">링크 (선택)</label>
                                        <input type="text" class="form-control" id="bannerLink" maxlength="500"
                                               placeholder="/boards/2 또는 https://example.com">
                                        <small class="form-text text-muted">/로 시작하는 경로 또는 http(s):// 주소만 허용됩니다. 비우면 링크 없음.</small>
                                    </div>
                                    <div class="form-group">
                                        <label for="bannerStartDate">노출 시작 (선택, 시·분을 비우면 00:00)</label>
                                        <div class="form-row">
                                            <div class="col-7"><input type="date" class="form-control" id="bannerStartDate" aria-label="노출 시작 날짜"></div>
                                            <div class="col-5 d-flex"><select class="form-control mr-1" id="bannerStartHour" aria-label="노출 시작 시"></select><select class="form-control" id="bannerStartMinute" aria-label="노출 시작 분"></select></div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="bannerEndDate">노출 종료 (선택, 이 시각 전까지 노출 · 시·분을 비우면 00:00)</label>
                                        <div class="form-row">
                                            <div class="col-7"><input type="date" class="form-control" id="bannerEndDate" aria-label="노출 종료 날짜"></div>
                                            <div class="col-5 d-flex"><select class="form-control mr-1" id="bannerEndHour" aria-label="노출 종료 시"></select><select class="form-control" id="bannerEndMinute" aria-label="노출 종료 분"></select></div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="bannerSiteScope">표시 대상</label>
                                        <select class="form-control" id="bannerSiteScope" aria-describedby="bannerSiteScopeHint">
                                            <option value="COMMON">공통 (모든 사이트)</option>
                                            <option th:each="site : ${scopeSites}" th:value="${site.id()}"
                                                    th:text="${site.active()} ? ${site.name()} : ${site.name() + ' (비활성)'}"></option>
                                        </select>
                                        <small class="form-text text-muted" id="bannerSiteScopeHint">공통은 모든 공개 사이트에, 사이트를 고르면 그 사이트에서만 보입니다.</small>
                                    </div>
                                    <div class="form-group form-check">
                                        <input type="checkbox" class="form-check-input" id="bannerUse" checked>
                                        <label class="form-check-label" for="bannerUse">노출 (끄면 기간과 무관하게 숨김)</label>
                                    </div>
                                    <div class="form-group" id="imageGroup">
                                        <label for="bannerImage">이미지 (png·jpeg·gif, 2MB 이하)</label>
                                        <input type="file" class="form-control-file" id="bannerImage" accept="image/png,image/jpeg,image/gif">
                                        <div class="mt-2 d-none" id="libraryPickGroup">
                                            <button type="button" class="btn btn-sm btn-outline-secondary" id="btnPickLibrary">라이브러리에서 선택</button>
                                            <span class="small ml-2" id="libraryPickName"></span>
                                            <button type="button" class="btn btn-sm btn-link d-none" id="btnClearLibrary">선택 해제</button>
                                        </div>
                                    </div>
                                    <div class="form-group d-none" id="previewGroup">
                                        <label>현재 이미지</label><br>
                                        <img id="bannerPreview" class="img-fluid border" alt="배너 미리보기">
                                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger mr-auto d-none" id="btnDelete">삭제</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal" id="btnModalClose">닫기</button>
                <button type="submit" class="btn btn-primary" id="btnSave" form="bannerForm">등록</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/logout-modal :: logoutModal}"></div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
<script src="/js/admin/media-picker.js"></script>
<script src="/js/admin/content-scope.js"></script>

<script th:inline="javascript">
    // 서버가 렌더링한 내 위임 권한 키("BANNER:CREATE" 등). 버튼 표시용일 뿐 서버 판정(403)이 최종이다.
    const MY_PERMISSIONS = new Set(/*[[${myPermissions}]]*/ []);
</script>
<script>
    const BANNERS_URL = "/admin/api/banners";
    const STATUS_LABELS = { ACTIVE: "노출 중", SCHEDULED: "예약됨", EXPIRED: "만료", HIDDEN: "비노출" };
    const STATUS_CLASSES = { ACTIVE: "badge-success", SCHEDULED: "badge-info", EXPIRED: "badge-secondary", HIDDEN: "badge-warning" };

    const bannerList = document.getElementById("bannerList");
    const bannerForm = document.getElementById("bannerForm");
    const formTitle = document.getElementById("formTitle");
    const fTitle = document.getElementById("bannerTitle");
    const fLink = document.getElementById("bannerLink");
    // 노출 시작·종료는 날짜(date)와 시간(time) 입력을 나눠 받는다 — datetime-local 달력은 날짜를 골라도 바깥을 클릭할 때까지 열려 있다.
    const fStartDate = document.getElementById("bannerStartDate");
    const fStartHour = document.getElementById("bannerStartHour");
    const fStartMinute = document.getElementById("bannerStartMinute");
    const fEndDate = document.getElementById("bannerEndDate");
    const fEndHour = document.getElementById("bannerEndHour");
    const fEndMinute = document.getElementById("bannerEndMinute");
    const fUse = document.getElementById("bannerUse");
    const fScope = document.getElementById("bannerSiteScope");
    const scope = ContentScope.create(fScope);           // 표시 대상 선택 박스(없는 사이트 ID는 옵션으로 보존)
    const fImage = document.getElementById("bannerImage");
    const imageGroup = document.getElementById("imageGroup");
    const previewGroup = document.getElementById("previewGroup");
    const preview = document.getElementById("bannerPreview");

    // 미디어 라이브러리에서 고른 이미지(등록 전용 — 파일 업로드와 둘 중 하나). 선택 모달은 /js/admin/media-picker.js.
    const canPickLibrary = MY_PERMISSIONS.has("MEDIA:READ");
    const libraryPickGroup = document.getElementById("libraryPickGroup");
    const btnPickLibrary = document.getElementById("btnPickLibrary");
    const btnClearLibrary = document.getElementById("btnClearLibrary");
    const libraryPickName = document.getElementById("libraryPickName");
    let pickedImage = null;
    libraryPickGroup.classList.toggle("d-none", !canPickLibrary);

    function setPickedImage(item) {
        pickedImage = item;
        libraryPickName.textContent = item ? "선택됨: " + (item.originalName || ("이미지 #" + item.id)) : "";
        btnClearLibrary.classList.toggle("d-none", !item);
    }

    btnPickLibrary.addEventListener("click", function () {
        window.MediaPicker.open({
            title: "배너 이미지 선택",
            maxBytes: 2 * 1024 * 1024,
            onPick: function (item) {
                fImage.value = "";
                setPickedImage(item);
            }
        });
    });
    btnClearLibrary.addEventListener("click", function () { setPickedImage(null); });
    fImage.addEventListener("change", function () {
        if (fImage.files && fImage.files.length > 0) {
            setPickedImage(null);
        }
    });
    const btnSave = document.getElementById("btnSave");
    const btnNew = document.getElementById("btnNew");
    const btnDelete = document.getElementById("btnDelete");
    const btnReload = document.getElementById("btnReload");
    const orderBar = document.getElementById("orderBar");
    const btnOrderSave = document.getElementById("btnOrderSave");
    const btnOrderCancel = document.getElementById("btnOrderCancel");
    const pageAlert = document.getElementById("pageAlert");
    const pageSuccess = document.getElementById("pageSuccess");
    const modalEl = document.getElementById("bannerModal");
    const modalAlert = document.getElementById("modalAlert");
    const btnModalClose = document.getElementById("btnModalClose");
    const btnModalCloseX = document.getElementById("btnModalCloseX");

    const canCreate = MY_PERMISSIONS.has("BANNER:CREATE");
    const canUpdate = MY_PERMISSIONS.has("BANNER:UPDATE");
    const canDelete = MY_PERMISSIONS.has("BANNER:DELETE");

    let banners = [];          // 서버 응답 스냅샷(표시 순서)
    let orderDraft = null;     // 순서 초안: 배너 ID 배열(null이면 초안 없음)
    let editing = null;        // 편집 대상 스냅샷(null이면 새 배너 작성)
    // 낡은 화면 검사 기준(PLAN-site-menu.md S6b): 편집 폼을 서버 값으로 채우는 순간에만 정해진다. 목록 갱신(loadList)이 editing을 최신 객체로
    // 바꿔도 이 값은 바뀌지 않는다 — 폼 입력은 옛 값인데 버전만 최신이 되어 검사를 통과하는 일을 막는다. 사용자가 바꾸는 값(표시 대상 등)은 폼에서 읽는다.
    let editBase = null;       // {id, version} 또는 null
    let saving = false;
    let listRequestSeq = 0;    // 늦게 도착한 이전 목록 응답이 최신 목록을 덮어쓰지 않게 하는 세대
    // 모달 상태: closed → opening(show 호출~shown) → open → closing(hide 시작~hidden) → closed.
    // Bootstrap 4는 전환 중(opening·closing)의 show/hide를 무시하므로 상태가 closed일 때만 새로 열고, 닫기는 closeModal()을 거친다.
    let modalState = "closed";
    let pendingClose = false;

    function csrfHeaders(json) {
        const token = document.querySelector('meta[name="_csrf"]');
        const header = document.querySelector('meta[name="_csrf_header"]');
        const headers = {};
        if (json) {
            headers["Content-Type"] = "application/json";
        }
        if (token && header) {
            headers[header.content || "X-CSRF-TOKEN"] = token.content;
        }
        return headers;
    }

    async function errorMessage(response, fallback) {
        if (response.status === 403) {
            return "이 작업을 수행할 권한이 없습니다.";   // 메서드 보안 403의 message는 영문이라 고정 문구를 쓴다
        }
        try {
            const body = await response.json();
            return body.message || fallback;
        } catch (e) {
            return fallback;
        }
    }

    // 모달이 떠 있는 동안의 오류는 모달 안에 보인다(페이지 상단 알림은 배경 뒤에 가려진다). 모달 밖 오류(목록 조회·순서 저장)는 페이지 상단.
    function showError(message) {
        if (modalState === "opening" || modalState === "open") {
            modalAlert.textContent = message;
            modalAlert.classList.remove("d-none");
            return;
        }
        pageSuccess.classList.add("d-none");
        pageAlert.textContent = message;
        pageAlert.classList.remove("d-none");
    }

    function hideModalAlert() {
        modalAlert.classList.add("d-none");
        modalAlert.textContent = "";
    }

    function closeModal() {
        if (modalState === "open") {
            $(modalEl).modal("hide");
        } else if (modalState === "opening") {
            pendingClose = true;                          // 열림 전환 중의 hide()는 무시되므로 shown 이후에 닫는다
        }
    }

    $(modalEl).on("shown.bs.modal", function () {
        modalState = "open";
        if (pendingClose) {
            pendingClose = false;
            $(modalEl).modal("hide");
        }
    });
    $(modalEl).on("hide.bs.modal", function () {
        modalState = "closing";
    });
    $(modalEl).on("hidden.bs.modal", function () {
        modalState = "closed";
        pendingClose = false;
        hideModalAlert();
        resetForm();                                      // 다음에 열 때 이전 입력·편집 대상이 남지 않게 한다
        render();
    });

    function openModal() {
        modalState = "opening";
        $(modalEl).modal("show");
    }

    function showSuccess(message) {
        pageAlert.classList.add("d-none");
        pageSuccess.textContent = message;
        pageSuccess.classList.remove("d-none");
    }

    function cell(text) {
        const td = document.createElement("td");
        td.textContent = text;                            // 제목은 사용자 입력 — textContent만 쓴다
        return td;
    }

    function fmt(value) {
        return value ? String(value).replace("T", " ").substring(0, 16) : "";
    }

    // 시·분은 <select>로 받는다 — time 입력의 팝업은 값을 골라도 바깥을 클릭할 때까지 열려 있지만 select 목록은 고르면 바로 닫힌다.
    // 첫 항목("--")은 "고르지 않음"이다(날짜만 정하면 00:00).
    function fillTimeOptions(select, count, placeholder) {
        select.replaceChildren();
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = placeholder;
        select.appendChild(empty);
        for (let i = 0; i < count; i++) {
            const option = document.createElement("option");
            option.value = String(i).padStart(2, "0");
            option.textContent = option.value;
            select.appendChild(option);
        }
    }
    fillTimeOptions(fStartHour, 24, "시");
    fillTimeOptions(fStartMinute, 60, "분");
    fillTimeOptions(fEndHour, 24, "시");
    fillTimeOptions(fEndMinute, 60, "분");

    /**
     * 날짜 + 시·분 → 서버로 보낼 "yyyy-MM-ddTHH:mm"(분 단위). 날짜가 비면 null(제한 없음), 날짜만 있으면 00:00(시나 분 중 하나만
     * 골랐으면 나머지는 00), 시·분을 골랐는데 날짜가 없으면 입력 오류(조용히 버리지 않는다).
     */
    function readDateTime(dateInput, hourSelect, minuteSelect, label) {
        if (dateInput.value === "") {
            if (hourSelect.value !== "" || minuteSelect.value !== "") {
                throw new Error(label + " 날짜를 선택해 주세요.");
            }
            return null;
        }
        return dateInput.value + "T" + (hourSelect.value || "00") + ":" + (minuteSelect.value || "00");
    }

    function writeDateTime(dateInput, hourSelect, minuteSelect, serverValue) {
        const text = fmt(serverValue);                       // "yyyy-MM-dd HH:mm" 또는 ""
        dateInput.value = text === "" ? "" : text.substring(0, 10);
        hourSelect.value = text === "" ? "" : text.substring(11, 13);
        minuteSelect.value = text === "" ? "" : text.substring(14, 16);
    }

    function periodText(banner) {
        if (!banner.displayStart && !banner.displayEnd) {
            return "제한 없음";
        }
        return (fmt(banner.displayStart) || "…") + " ~ " + (fmt(banner.displayEnd) || "…");
    }

    function orderedBanners() {
        if (!orderDraft) {
            return banners;
        }
        const byId = new Map(banners.map(function (b) { return [b.id, b]; }));
        return orderDraft.map(function (id) { return byId.get(id); });
    }

    function lockUi() {
        const locked = saving || orderDraft !== null;     // 순서 초안이 있는 동안 다른 저장 동작은 잠근다
        btnSave.disabled = locked || !(editing ? canUpdate : canCreate);
        btnDelete.disabled = locked;
        btnNew.disabled = locked;
        btnNew.classList.toggle("d-none", !canCreate);
        btnModalClose.disabled = saving;                  // 저장 중에는 닫을 수 없다(응답 처리와 모달 상태가 어긋나지 않게)
        btnModalCloseX.disabled = saving;
        btnReload.disabled = saving || orderDraft !== null;
        orderBar.classList.toggle("d-none", orderDraft === null);
        // 저장 중에는 입력도 잠근다 — 이미 전송된 요청에 담기지 않은 추가 입력이 성공 처리 뒤 조용히 사라지거나 저장된 것으로 오인되는 것을 막는다
        [fTitle, fLink, fStartDate, fStartHour, fStartMinute, fEndDate, fEndHour, fEndMinute, fUse, fScope, fImage, btnPickLibrary, btnClearLibrary].forEach(function (field) {
            field.disabled = saving;
        });
        btnOrderSave.disabled = saving;
        btnOrderCancel.disabled = saving;
    }

    function moveButton(label, direction, index, total) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "btn btn-sm btn-outline-secondary mr-1";
        button.textContent = label;
        button.setAttribute("aria-label", direction < 0 ? "위로" : "아래로");
        button.disabled = saving || !canUpdate || index + direction < 0 || index + direction >= total;
        button.addEventListener("click", function (event) {
            event.stopPropagation();
            listRequestSeq++;      // 진행 중인 목록 응답을 폐기해 뒤늦게 도착한 응답이 초안을 지우지 못하게 한다
            const ids = orderedBanners().map(function (b) { return b.id; });
            const moved = ids.splice(index, 1)[0];
            ids.splice(index + direction, 0, moved);
            const original = banners.map(function (b) { return b.id; });
            orderDraft = ids.join(",") === original.join(",") ? null : ids;
            render();
        });
        return button;
    }

    function render() {
        bannerList.replaceChildren();
        const list = orderedBanners();
        if (list.length === 0) {
            const tr = document.createElement("tr");
            const td = cell("등록된 배너가 없습니다.");
            td.colSpan = 6;
            td.className = "text-muted";
            tr.appendChild(td);
            bannerList.appendChild(tr);
        }
        list.forEach(function (banner, index) {
            const tr = document.createElement("tr");
            tr.className = "banner-row" + (editing && editing.id === banner.id ? " table-active" : "");

            const imageCell = document.createElement("td");
            const img = document.createElement("img");
            img.className = "banner-thumb";
            img.alt = "";
            img.src = BANNERS_URL + "/" + encodeURIComponent(banner.id) + "/image";
            imageCell.appendChild(img);
            tr.appendChild(imageCell);

            tr.appendChild(cell(banner.title));
            const scopeCell = document.createElement("td");
            scopeCell.appendChild(scope.badge(banner.siteId));
            tr.appendChild(scopeCell);
            tr.appendChild(cell(periodText(banner)));

            const statusCell = document.createElement("td");
            const badge = document.createElement("span");
            badge.className = "badge " + (STATUS_CLASSES[banner.status] || "badge-secondary");
            badge.textContent = STATUS_LABELS[banner.status] || banner.status;
            statusCell.appendChild(badge);
            tr.appendChild(statusCell);

            const orderCell = document.createElement("td");
            orderCell.className = "text-nowrap";
            orderCell.appendChild(moveButton("▲", -1, index, list.length));
            orderCell.appendChild(moveButton("▼", 1, index, list.length));
            tr.appendChild(orderCell);

            tr.addEventListener("click", function () { startEdit(banner); });
            bannerList.appendChild(tr);
        });
        lockUi();
    }

    // 폼을 새 배너 작성 상태로 되돌린다(모달은 열지 않는다).
    function resetForm() {
        editing = null;
        formTitle.textContent = "새 배너";
        bannerForm.reset();
        fUse.checked = true;
        scope.reset();
        editBase = null;
        setPickedImage(null);
        imageGroup.classList.remove("d-none");
        previewGroup.classList.add("d-none");
        btnSave.textContent = "등록";
        btnDelete.classList.add("d-none");
    }

    function startCreate() {
        if (modalState !== "closed" || saving || orderDraft !== null || !canCreate) {
            return;
        }
        resetForm();
        hideModalAlert();
        render();
        openModal();
    }

    // 진입(행 클릭)은 수정 권한을 요구하지 않는다 — READ 전용은 내용을 보고, READ+DELETE는 [삭제]에 도달한다. 저장은 btnSave.disabled가 판정한다.
    function startEdit(banner) {
        if (modalState !== "closed" || saving || orderDraft !== null) {
            return;
        }
        hideModalAlert();
        editing = banner;
        editBase = { id: banner.id, version: banner.version };
        formTitle.textContent = "배너 #" + banner.id + " 수정";
        fTitle.value = banner.title;
        fLink.value = banner.linkUrl || "";
        writeDateTime(fStartDate, fStartHour, fStartMinute, banner.displayStart);
        writeDateTime(fEndDate, fEndHour, fEndMinute, banner.displayEnd);
        fUse.checked = !!banner.useYn;
        scope.set(banner.siteId);
        fImage.value = "";
        imageGroup.classList.add("d-none");
        preview.src = BANNERS_URL + "/" + encodeURIComponent(banner.id) + "/image";
        previewGroup.classList.remove("d-none");
        btnSave.textContent = "저장";
        btnDelete.classList.toggle("d-none", !canDelete);
        render();
        openModal();
    }

    async function loadList() {
        const seq = ++listRequestSeq;
        try {
            const response = await fetch(BANNERS_URL, { headers: { "Accept": "application/json" } });
            if (seq !== listRequestSeq) {
                return;
            }
            if (!response.ok) {
                showError(await errorMessage(response, "배너 목록을 불러오지 못했습니다."));
                return;
            }
            const loaded = await response.json();
            if (seq !== listRequestSeq) {      // 본문을 읽는 동안 순서가 바뀌었으면 이 응답을 폐기한다
                return;
            }
            banners = loaded;
            orderDraft = null;
            if (editing) {
                const fresh = banners.find(function (b) { return b.id === editing.id; });
                if (fresh) {
                    editing = fresh;
                } else if (modalState === "opening" || modalState === "open") {
                    // 열린 폼을 생성 모드로 비우지 않는다 — 입력은 두고 안내만 한다. 저장하면 서버가 404로 답한다.
                    showError("이 배너가 삭제되었거나 목록에 없습니다. 저장하면 실패할 수 있으니 닫고 목록을 확인해 주세요.");
                }
            }
            render();
        } catch (e) {
            if (seq === listRequestSeq) {
                showError("배너 목록을 불러오지 못했습니다. 네트워크 상태를 확인해 주세요.");
            }
        }
    }

    function setSaving(value) {
        saving = value;
        lockUi();
        render();
    }

    bannerForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (saving || orderDraft !== null) {
            return;
        }
        const target = editing;                             // 요청 시작 시점의 대상을 고정한다
        const base = editBase;                              // 낡은 화면 검사 기준도 함께 고정한다
        let displayStart;
        let displayEnd;
        try {
            displayStart = readDateTime(fStartDate, fStartHour, fStartMinute, "노출 시작");
            displayEnd = readDateTime(fEndDate, fEndHour, fEndMinute, "노출 종료");
        } catch (e) {
            showError(e.message);                           // 요청 전에 거부 — 초안·폼 값은 그대로 둔다
            return;
        }
        setSaving(true);
        try {
            let response;
            if (target) {
                response = await fetch(BANNERS_URL + "/" + encodeURIComponent(target.id), {
                    method: "PUT",
                    headers: csrfHeaders(true),
                    body: JSON.stringify({
                        title: fTitle.value,
                        linkUrl: fLink.value.trim() === "" ? null : fLink.value.trim(),
                        displayStart: displayStart,
                        displayEnd: displayEnd,
                        useYn: fUse.checked,
                        siteScope: scope.value(),
                        version: base.version
                    })
                });
            } else {
                if ((!fImage.files || fImage.files.length === 0) && pickedImage === null) {
                    showError("배너 이미지를 선택해 주세요.");
                    return;
                }
                const form = new FormData();
                form.append("title", fTitle.value);
                if (fLink.value.trim() !== "") { form.append("linkUrl", fLink.value.trim()); }
                if (displayStart !== null) { form.append("displayStart", displayStart); }
                if (displayEnd !== null) { form.append("displayEnd", displayEnd); }
                form.append("useYn", fUse.checked ? "true" : "false");
                form.append("siteScope", scope.value());
                if (pickedImage !== null) {
                    form.append("imageId", String(pickedImage.id));
                } else {
                    form.append("image", fImage.files[0]);
                }
                response = await fetch(BANNERS_URL, { method: "POST", headers: csrfHeaders(false), body: form });
            }
            if (response.ok) {
                const saved = await response.json();
                showSuccess(target ? "배너를 저장했습니다: #" + saved.id : "배너를 등록했습니다: #" + saved.id);
                // 목록 재조회가 실패해도 다시 연 행이 저장 전 값·옛 version이 되지 않게, 저장 응답으로 목록 스냅샷을 먼저 보정한다
                const index = banners.findIndex(function (b) { return b.id === saved.id; });
                if (index >= 0) {
                    banners[index] = saved;
                } else {
                    banners.push(saved);
                }
                closeModal();
                await loadList();
            } else {
                showError(await errorMessage(response, "저장에 실패했습니다."));
            }
        } catch (e) {
            showError("저장에 실패했습니다. 네트워크 상태를 확인해 주세요.");
        } finally {
            setSaving(false);
        }
    });

    btnDelete.addEventListener("click", async function () {
        if (!editing || saving || orderDraft !== null) {
            return;
        }
        const target = editing;
        if (!confirm("배너 #" + target.id + "을(를) 삭제하시겠습니까?\n이미지 파일도 함께 삭제되며 복구할 수 없습니다.")) {
            return;
        }
        setSaving(true);
        try {
            const response = await fetch(BANNERS_URL + "/" + encodeURIComponent(target.id), {
                method: "DELETE",
                headers: csrfHeaders(false)
            });
            if (response.ok || response.status === 204 || response.status === 404) {
                showSuccess(response.status === 404 ? "이미 삭제된 배너입니다." : "배너를 삭제했습니다: #" + target.id);
                closeModal();
                await loadList();
            } else {
                showError(await errorMessage(response, "삭제에 실패했습니다."));
            }
        } catch (e) {
            showError("삭제에 실패했습니다. 네트워크 상태를 확인해 주세요.");
        } finally {
            setSaving(false);
        }
    });

    btnOrderSave.addEventListener("click", async function () {
        if (!orderDraft || saving) {
            return;
        }
        const ids = orderDraft.slice();
        setSaving(true);
        try {
            const response = await fetch(BANNERS_URL + "/order", {
                method: "PUT",
                headers: csrfHeaders(true),
                body: JSON.stringify({ ids: ids })
            });
            if (response.ok) {
                banners = await response.json();
                orderDraft = null;
                showSuccess("배너 순서를 저장했습니다.");
            } else if (response.status === 409) {
                orderDraft = null;
                showError((await errorMessage(response, "배너 목록이 변경되었습니다.")) + " 최신 목록으로 새로고침했습니다.");
                await loadList();
            } else {
                showError(await errorMessage(response, "순서 저장에 실패했습니다."));
            }
        } catch (e) {
            showError("순서 저장에 실패했습니다. 네트워크 상태를 확인해 주세요.");
        } finally {
            setSaving(false);
        }
    });

    btnOrderCancel.addEventListener("click", function () {
        orderDraft = null;
        render();
    });

    window.addEventListener("beforeunload", function (event) {
        if (orderDraft !== null) {
            event.preventDefault();
            event.returnValue = "";
        }
    });

    btnNew.addEventListener("click", startCreate);
    btnReload.addEventListener("click", loadList);
    resetForm();
    loadList();
</script>
</body>
</html>
