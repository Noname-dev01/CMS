<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: adminHead(~{::title})}">
    <title>FAQ 관리</title>
</head>
<body id="page-top">
<link rel="stylesheet" th:href="@{/css/admin/admin-manage.css}">
<!--/* 페이지 전용 CSS는 body 시작 지점에 둔다(banner/manage.html 컨벤션 — th:replace가 head를 통째로 치환한다). PLAN-faq.md 쟁점 13. */-->
<link rel="stylesheet" th:href="@{/vendor/quill/quill.snow.css}">
<style>
    .faq-card {
        background: white;
        border-radius: 0.35rem;
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        border: 1px solid #4e73df;
    }
    .faq-cat { border: 1px solid #d1d3e2; border-radius: 0.35rem; margin-bottom: 0.75rem; background: #fff; }
    .faq-cat-head { background: #f8f9fc; padding: 0.5rem 0.75rem; display: flex; align-items: center; border-radius: 0.35rem 0.35rem 0 0; }
    .faq-cat-name { flex: 1; font-weight: bold; cursor: pointer; overflow-wrap: anywhere; }
    .faq-row { display: flex; align-items: center; padding: 0.4rem 0.75rem; border-top: 1px solid #eaecf4; }
    .faq-row-question { flex: 1; cursor: pointer; overflow-wrap: anywhere; }
    .faq-row.is-editing, .faq-cat.is-editing > .faq-cat-head { background: #e8efff; }
    .faq-handle { cursor: grab; color: #858796; padding: 0 0.5rem; -webkit-user-select: none; user-select: none; }
    /* 쓸 수 있는 손잡이를 끌면 스크롤이 아니라 드래그다(터치 포함). 스크롤은 손잡이 밖에서 한다. */
    .faq-handle[aria-disabled="false"] { touch-action: none; }
    .faq-handle[aria-disabled="true"] { cursor: not-allowed; opacity: 0.4; }
    .faq-move-btn { padding: 0 0.4rem; line-height: 1.4; }
    .faq-move-btn[aria-disabled="true"] { opacity: 0.65; cursor: not-allowed; }
    .faq-row.faq-drop-before { box-shadow: inset 0 3px 0 0 #4e73df; }
    .faq-row.faq-drop-after { box-shadow: inset 0 -3px 0 0 #4e73df; }
    /* 카드의 안쪽 그림자는 머리글·행 배경에 가려진다 — 자식 위에 겹치는 선으로 그린다 */
    .faq-cat { position: relative; }
    .faq-cat.faq-drop-before::before, .faq-cat.faq-drop-after::after {
        content: ""; position: absolute; left: 0; right: 0; height: 3px; background: #4e73df; z-index: 1; pointer-events: none;
    }
    .faq-cat.faq-drop-before::before { top: 0; border-radius: 0.35rem 0.35rem 0 0; }
    .faq-cat.faq-drop-after::after { bottom: 0; border-radius: 0 0 0.35rem 0.35rem; }
    .faq-row.is-dragging, .faq-cat.is-dragging { opacity: 0.5; }
    .faq-drag-ghost { position: fixed; top: 0; left: 0; z-index: 1080; max-width: 300px; padding: 2px 8px; border-radius: 0.2rem; background: #4e73df; color: #fff;
        font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    html.faq-dragging, html.faq-dragging * { cursor: grabbing !important; }
    .faq-empty-cat { padding: 0.5rem 0.75rem; color: #858796; border-top: 1px solid #eaecf4; font-size: 0.9rem; }
    .faq-editor .ql-editor { min-height: 200px; font-size: 1rem; }
</style>

<div id="wrapper">
    <div th:replace="~{admin/fragments/sidebar :: adminSidebar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{admin/fragments/topbar :: adminTopbar}"></div>

            <div class="container-fluid">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">FAQ 관리</h1>
                </div>

                <!--/* 본문은 React 아일랜드가 그린다(frontend/src/admin/faq, PLAN-react-admin-faq.md). 서버 데이터는 이스케이프된 data-*·텍스트로만 넘긴다(결정 8).
                     권한 키는 버튼 표시용일 뿐 서버 판정(403)이 최종이다. */-->
                <div id="faqManageRoot" th:data-permissions="${#strings.setJoin(myPermissions, ',')}"></div>
                <!--/* 표시 대상 선택지 — 위임받은 MANAGER는 사이트 목록 API를 쓸 수 없어 서버가 렌더링한다(PLAN-site-menu.md PR ③ S7). 이름은 관리자 입력이라 텍스트로만 싣는다. */-->
                <ul id="faqScopeSites" hidden>
                    <li th:each="site : ${scopeSites}" th:data-id="${site.id()}" th:data-active="${site.active()}" th:text="${site.name()}"></li>
                </ul>
            </div>
        </div>

        <div th:replace="~{admin/fragments/footer :: adminFooter}"></div>
    </div>
</div>

<!--/* 항목 등록·수정 모달 — React가 그린다(옛 화면처럼 #wrapper 밖). 배경 클릭·ESC로 닫히지 않는다(입력 보호). */-->
<div id="faqModalRoot"></div>

<div th:replace="~{admin/fragments/logout-modal :: logoutModal}"></div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
<script src="/vendor/quill/quill.js"></script>
<script src="/js/admin/notice-editor.js"></script>
<script type="module" th:src="@{/js/admin-react/faq-manage.js}"></script>
</body>
</html>
