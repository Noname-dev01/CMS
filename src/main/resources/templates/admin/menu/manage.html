<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: adminHead}">
    <title>메뉴 관리</title>
</head>
<body id="page-top">
<!--
    th:replace는 head 태그 자체를 통째로 adminHead 프래그먼트로 치환하므로, 원래 head 안에
    있던 title·link·style은 렌더링 결과에 포함되지 않는다(기존 admin-manage.html의
    페이지 전용 CSS link도 동일한 이유로 head 바깥/body 시작 지점에 둔다 — 그 컨벤션을 따른다).
-->
<!-- jstree CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css" />
<style>
        .menu-container {
            padding: 20px;
            height: calc(100vh - 200px);
            background-color: #f8f9fc;
        }
        .tree-container {
            background: white;
            padding: 0;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            overflow: auto;
            height: 100%;
            margin-right: 20px;
            border: 1px solid #4e73df;
        }
        .form-container {
            background: white;
            padding: 0;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            overflow: auto;
            height: 100%;
            margin-left: 20px;
            border: 1px solid #1cc88a;
        }
        .card-header {
            background-color: #f8f9fc;
            border-bottom: 1px solid #e3e6f0;
            padding: 0.75rem 1.25rem;
        }
        .tree-container .card-header {
            background: linear-gradient(to right, #4e73df, #224abe);
            border-bottom: none;
        }
        .form-container .card-header {
            background: linear-gradient(to right, #1cc88a, #13855c);
            border-bottom: none;
        }
        .card-header h6 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: white;
        }
        .form-container .card-header h6 {
            color: #1cc88a;
        }
        .card-body {
            padding: 1.25rem;
        }
        .btn-container {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }
        .tree-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tree-toolbar .btn-group-actions {
            display: flex;
            gap: 8px;
        }
        .draft-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .draft-bar .draft-status {
            font-size: 0.85rem;
        }
        .draft-bar.dirty .draft-status {
            color: #e74a3b;
            font-weight: 700;
        }
        .draft-bar .btn-group-actions {
            display: flex;
            gap: 8px;
        }
        #menuTree {
            margin-top: 15px;
            padding: 20px;
            border: 1px solid #eaecf4;
            border-radius: 8px;
            background-color: #f8f9fc;
        }
        .form-group {
            margin-bottom: 1.5rem;
            background-color: #f8f9fc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eaecf4;
        }
        .form-group label {
            font-weight: 600;
            color: #5a5c69;
            margin-bottom: 0.5rem;
            display: block;
        }
        .form-control {
            border-radius: 5px;
            border: 1px solid #d1d3e2;
            padding: 0.6rem 1rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            background-color: white;
        }
        .form-control:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
        }
        .btn {
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            border-radius: 5px;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #4e73df;
            border-color: #4e73df;
        }
        .btn-primary:hover {
            background-color: #2e59d9;
            border-color: #2653d4;
        }
        .btn-danger {
            background-color: #e74a3b;
            border-color: #e74a3b;
        }
        .btn-danger:hover {
            background-color: #e02d1b;
            border-color: #d52a1a;
        }
        .btn-secondary {
            background-color: #858796;
            border-color: #858796;
        }
        .btn-secondary:hover {
            background-color: #717384;
            border-color: #6b6d7d;
        }
        .custom-control-input:checked ~ .custom-control-label::before {
            background-color: #4e73df;
            border-color: #4e73df;
        }
        .jstree-default .jstree-node {
            margin-left: 12px;
        }
        .jstree-default .jstree-themeicon {
            color: #4e73df;
        }
        .jstree-default .jstree-clicked {
            background-color: #eaecf4 !important;
            box-shadow: none;
        }
        .jstree-default .jstree-hovered {
            background-color: #f8f9fc !important;
            box-shadow: none;
        }
        .custom-control {
            padding-left: 2rem;
        }
        .custom-control-label {
            color: #5a5c69;
        }
        .custom-switch .custom-control-label::before {
            height: 1.25rem;
            width: 2.5rem;
            border-radius: 0.625rem;
        }
        .custom-switch .custom-control-label::after {
            height: calc(1.25rem - 4px);
            width: calc(1.25rem - 4px);
            border-radius: calc(1.25rem - 4px);
        }
        .form-mode-label {
            font-size: 0.85rem;
            color: #858796;
            margin-bottom: 10px;
        }
        /* 비활성 메뉴는 회색으로만 구분하고 선택은 그대로 가능하게 둔다 (jstree state.disabled 미사용) */
        .jstree-anchor.menu-inactive,
        .jstree-anchor.menu-inactive .jstree-icon {
            color: #b0b3b8 !important;
        }
    </style>

<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/sidebar :: adminSidebar}"></div>
    <!-- End of Sidebar -->

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            <!-- Topbar -->
            <div th:replace="~{admin/fragments/topbar :: adminTopbar}"></div>
            <!-- End of Topbar -->

            <div class="container-fluid">
                <!-- Page Heading -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">메뉴 관리</h1>
                </div>

                <div class="menu-container">
                    <div class="row">
                        <div class="col-md-5">
                            <div class="tree-container">
                                <div class="card-header">
                                    <h6>메뉴 구조</h6>
                                </div>
                                <div class="card-body">
                                    <div id="treeAlert" class="alert alert-danger d-none" role="alert"></div>
                                    <div id="treeWarning" class="alert alert-warning d-none" role="alert"></div>
                                    <div id="treeSuccess" class="alert alert-success d-none" role="alert"></div>
                                    <div class="tree-toolbar">
                                        <div class="custom-control custom-switch">
                                            <input type="checkbox" class="custom-control-input" id="includeInactiveToggle" checked>
                                            <label class="custom-control-label" for="includeInactiveToggle">비활성 포함</label>
                                        </div>
                                        <div class="btn-group-actions">
                                            <button type="button" class="btn btn-primary btn-sm" id="btnNewTop">새 최상위</button>
                                            <button type="button" class="btn btn-primary btn-sm" id="btnNewChild">선택 아래 하위 추가</button>
                                        </div>
                                    </div>
                                    <small id="treeHint" class="form-text text-muted d-none mb-2"></small>
                                    <div id="menuTree"></div>
                                    <div id="draftBar" class="draft-bar">
                                        <span id="draftStatus" class="draft-status text-muted">변경 없음</span>
                                        <div class="btn-group-actions">
                                            <button type="button" class="btn btn-primary btn-sm" id="btnApply" disabled>반영</button>
                                            <button type="button" class="btn btn-secondary btn-sm" id="btnCancel" disabled>취소</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-7">
                            <div class="form-container">
                                <div class="card-header">
                                    <h6>메뉴 정보</h6>
                                </div>
                                <div class="card-body">
                                    <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>
                                    <div id="formModeLabel" class="form-mode-label">메뉴를 선택하거나 추가 버튼을 눌러주세요.</div>
                                    <form id="menuForm">
                                        <div class="form-group">
                                            <label for="menuName">메뉴명</label>
                                            <input type="text" class="form-control" id="menuName" name="menuName">
                                        </div>
                                        <div class="form-group">
                                            <label for="menuUrl">URL</label>
                                            <input type="text" class="form-control" id="menuUrl" name="menuUrl">
                                        </div>
                                        <div class="form-group">
                                            <label for="menuIcon">아이콘</label>
                                            <input type="text" class="form-control" id="menuIcon" name="menuIcon">
                                        </div>
                                        <div class="form-group">
                                            <label for="menuDesc">설명</label>
                                            <textarea class="form-control" id="menuDesc" name="menuDesc" rows="3"></textarea>
                                        </div>
                                        <div class="form-group">
                                            <label>노출 대상 <small class="text-muted">(MANAGER 기준, 읽기 전용 — 권한관리와 메뉴 위치로 정해집니다)</small></label>
                                            <p class="form-control-plaintext mb-0" id="menuExposure">-</p>
                                        </div>
                                        <div class="form-group">
                                            <div class="custom-control custom-switch">
                                                <input type="checkbox" class="custom-control-input" id="menuUseYn" name="menuUseYn">
                                                <label class="custom-control-label" for="menuUseYn">사용 여부</label>
                                            </div>
                                        </div>
                                        <div class="btn-container">
                                            <button type="button" class="btn btn-primary" id="btnSave">저장</button>
                                            <!-- 활성 메뉴는 [비활성화], 비활성 메뉴는 [영구삭제]만 보인다(syncActionButtons) -->
                                            <button type="button" class="btn btn-warning d-none" id="btnDeactivate">비활성화</button>
                                            <button type="button" class="btn btn-danger d-none" id="btnPermanentDelete">영구삭제</button>
                                            <button type="button" class="btn btn-secondary" id="btnReset">초기화</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 메뉴 영구삭제 확인 모달: 메뉴명(확인 문자열)을 직접 입력해야 [영구삭제]가 활성화된다 -->
<div class="modal fade" id="permanentDeleteModal" tabindex="-1" role="dialog"
     aria-labelledby="permanentDeleteModalLabel" aria-hidden="true" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="permanentDeleteModalLabel">메뉴 영구삭제</h5>
            </div>
            <div class="modal-body">
                <div id="permanentDeleteError" class="alert alert-danger d-none" role="alert"></div>
                <p class="mb-2">
                    <strong>영구 삭제되며 복구할 수 없습니다.</strong>
                    비활성 상태이고 하위 메뉴가 없는 메뉴만 삭제할 수 있습니다.
                </p>
                <p class="mb-2">계속하려면 아래 메뉴명을 그대로 입력하세요.</p>
                <p class="mb-2"><code id="permanentDeleteConfirmText" style="white-space: pre-wrap; word-break: break-all;"></code></p>
                <input type="text" class="form-control" id="permanentDeleteInput" autocomplete="off" spellcheck="false"
                       aria-label="삭제할 메뉴명 확인 입력">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="btnPermanentDeleteCancel">취소</button>
                <button type="button" class="btn btn-danger" id="btnPermanentDeleteConfirm" disabled>영구삭제</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap core JavaScript-->
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- Core plugin JavaScript-->
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

<!-- Custom scripts for all pages-->
<script src="/js/sb-admin-2.min.js"></script>

<!-- jstree JavaScript -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>

<script>
$(document).ready(function () {
    // 메뉴 최대 깊이(최상위=1). 서버 MenuService.MAX_MENU_DEPTH와 같다 — 서버가 최종 판정하고 화면은 UX 보조다.
    const MAX_DEPTH = 3;
    // 반영 성공 뒤 페이지를 다시 읽어 사이드바까지 갱신하는데, 그 사이 성공 메시지를 잃지 않도록 sessionStorage에 남긴다.
    const APPLIED_KEY = 'menuStructureApplied';

    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

    const $tree = $('#menuTree');
    const treeAlert = document.getElementById('treeAlert');
    const formAlert = document.getElementById('formAlert');
    const formModeLabel = document.getElementById('formModeLabel');
    const includeInactiveToggle = document.getElementById('includeInactiveToggle');
    const treeHint = document.getElementById('treeHint');
    const treeWarning = document.getElementById('treeWarning');
    const treeSuccess = document.getElementById('treeSuccess');
    const draftBar = document.getElementById('draftBar');
    const draftStatus = document.getElementById('draftStatus');
    const btnApply = document.getElementById('btnApply');
    const btnCancel = document.getElementById('btnCancel');

    const menuForm = document.getElementById('menuForm');
    const menuNameInput = document.getElementById('menuName');
    const menuUrlInput = document.getElementById('menuUrl');
    const menuIconInput = document.getElementById('menuIcon');
    const menuDescInput = document.getElementById('menuDesc');
    const menuExposureText = document.getElementById('menuExposure');
    const menuUseYnInput = document.getElementById('menuUseYn');

    const btnSave = document.getElementById('btnSave');
    const btnDeactivate = document.getElementById('btnDeactivate');
    const btnPermanentDelete = document.getElementById('btnPermanentDelete');
    const btnReset = document.getElementById('btnReset');
    const btnNewTop = document.getElementById('btnNewTop');
    const btnNewChild = document.getElementById('btnNewChild');

    // mode: null(선택 없음) | 'edit'(기존 메뉴 수정) | 'create'(신규 생성)
    let mode = null;
    let selectedMenuNo = null;
    let pendingParentMenuNo = null;
    // selectedMenuSnapshot: 상세 조회가 서버 응답으로 확정된 시점의 {menuNo, menuName, useYn}. 비활성화·영구삭제의 대상과
    // 버튼 노출은 폼의 저장하지 않은 값(사용 여부 체크박스 등)이 아니라 이 스냅샷으로 정한다.
    let selectedMenuSnapshot = null;
    // permanentDeleteTarget: 영구삭제 모달을 연 순간 스냅샷을 복사해 고정한 대상. 모달이 열린 사이 다른 메뉴의 상세 응답이
    // 늦게 도착해 선택이 바뀌어도 이름 확인과 DELETE는 이 복사본만 쓴다(다른 메뉴가 지워지는 것을 막는다).
    let permanentDeleteTarget = null;

    // treeScope: 지금 실제로 그려진 트리의 범위('all' | 'active'). 조회 시작~트리 교체 완료 사이는 null이라 드래그 불가.
    // 구조 편집(드래그)은 비활성 메뉴까지 포함한 'all'에서만 허용한다 — 반영 요청이 전체 메뉴 집합이어야 하기 때문이다.
    let treeScope = null;
    // loadSeq: loadTree() 호출 세대. 이전 조회 응답이 늦게 도착하면 폐기한다(토글 연타 시 응답 순서 역전 방지).
    let loadSeq = 0;
    // selectSeq: 폼/mode를 바꾸는 모든 전이에서 올리는 세대. 늦게 도착한 상세 응답이 낡은 값으로 폼을 되살리는 것을 막는다.
    let selectSeq = 0;
    // busy: 저장·비활성화·반영은 동시에 하나만 진행한다.
    let busy = false;

    // 초안(draft): 드래그는 jstree 안에서만 구조를 바꾸고 서버에는 [반영]을 누를 때 한 번에 보낸다.
    // baseStructure: 마지막 트리 조회 시점의 구조(menuNo → {upMenuNo, ord, parentNo, index}). 반영 요청의 base이자 변경 건수의 기준이다.
    let baseStructure = new Map();
    // draftChanged: 기준과 부모 또는 위치가 다른 메뉴 수. 0이면 초안 없음.
    let draftChanged = 0;
    // 반영 성공 후 페이지를 다시 읽는 동안에는 이탈 경고를 띄우지 않는다.
    let leavingAfterApply = false;

    // queuedNotice: 결과 메시지({kind:'error'|'warning'|'success', text}). loadTree()가 시작할 때 알림을 지우므로
    // 재조회가 실제로 적용(또는 최신 조회가 실패)된 시점에 표시한다 — 더 최신 조회에 밀려 폐기된 조회는 소비하지 않는다.
    let queuedNotice = null;

    function canDrag() {
        return treeScope === 'all' && !busy;
    }

    function showTreeError(message) {
        treeAlert.textContent = message;
        treeAlert.classList.remove('d-none');
    }

    function hideTreeError() {
        treeAlert.classList.add('d-none');
        treeAlert.textContent = '';
    }

    function showTreeWarning(message) {
        treeWarning.textContent = message;
        treeWarning.classList.remove('d-none');
    }

    function hideTreeWarning() {
        treeWarning.classList.add('d-none');
        treeWarning.textContent = '';
    }

    function showTreeSuccess(message) {
        treeSuccess.textContent = message;
        treeSuccess.classList.remove('d-none');
    }

    function hideTreeSuccess() {
        treeSuccess.classList.add('d-none');
        treeSuccess.textContent = '';
    }

    // 대기 중인 결과 메시지를 트리 영역 알림으로 표시하고 비운다.
    function flushQueuedNotice() {
        if (!queuedNotice) {
            return;
        }
        if (queuedNotice.kind === 'error') {
            showTreeError(queuedNotice.text);
        } else if (queuedNotice.kind === 'success') {
            showTreeSuccess(queuedNotice.text);
        } else {
            showTreeWarning(queuedNotice.text);
        }
        queuedNotice = null;
    }

    function showFormError(message) {
        formAlert.textContent = message;
        formAlert.classList.remove('d-none');
    }

    function hideFormError() {
        formAlert.classList.add('d-none');
        formAlert.textContent = '';
    }

    async function extractErrorMessage(response, fallbackMessage) {
        try {
            const body = await response.json();
            return body.message || fallbackMessage;
        } catch (e) {
            return fallbackMessage;
        }
    }

    function clearForm() {
        menuForm.reset();
        // 신규 메뉴는 기본 활성으로 생성한다(API의 생성 기본값 useYn=true와 일치).
        // reset()은 스위치를 HTML 기본값(미체크)으로 되돌리므로 명시적으로 다시 켠다.
        menuUseYnInput.checked = true;
        menuExposureText.textContent = "-";
    }

    function fillForm(menu, exposureLabel) {
        menuExposureText.textContent = exposureLabel || "-";
        menuNameInput.value = menu.menuName || '';
        menuUrlInput.value = menu.menuUrl || '';
        menuIconInput.value = menu.menuIcon || '';
        menuDescInput.value = menu.menuDesc || '';

        menuUseYnInput.checked = !!menu.useYn;
    }

    function setModeLabel(text) {
        formModeLabel.textContent = text;
    }

    // 활성 메뉴는 [비활성화], 비활성 메뉴는 [영구삭제]만 보인다. 대상은 서버 응답으로 확정된 스냅샷의 useYn으로 판정한다.
    function syncActionButtons() {
        const editing = mode === 'edit' && selectedMenuSnapshot !== null;
        btnDeactivate.classList.toggle('d-none', !(editing && selectedMenuSnapshot.useYn === true));
        btnPermanentDelete.classList.toggle('d-none', !(editing && selectedMenuSnapshot.useYn === false));
    }

    function resetSelectionState() {
        selectSeq++;
        mode = null;
        selectedMenuNo = null;
        selectedMenuSnapshot = null;
        pendingParentMenuNo = null;
        clearForm();
        hideFormError();
        setModeLabel('메뉴를 선택하거나 추가 버튼을 눌러주세요.');
        syncActionButtons();
    }

    // ── 초안(draft) 상태 ──────────────────────────────────────

    // 서버가 준 트리(또는 jstree 노드)를 menuNo → 구조 정보로 펼친다. index는 같은 부모 안에서의 위치다.
    // upMenuNo·ord는 서버 JSON이 non_null이라 최상위·레거시 행에서 키가 생략되므로 ?? null로 명시한다(반영 요청은 필드 누락을 400으로 거부한다).
    function indexServerTree(nodes, parentNo, map) {
        nodes.forEach(function (node, index) {
            map.set(node.data.menuNo, {
                upMenuNo: node.data.upMenuNo ?? null,
                ord: node.data.ord ?? null,
                parentNo: parentNo,
                index: index
            });
            indexServerTree(node.children || [], node.data.menuNo, map);
        });
    }

    // jstree가 지금 들고 있는 구조(드래그 반영 후)를 깊이 우선 순서로 읽는다. 같은 부모 안의 상대 순서가 새 순서가 된다.
    function readCurrentStructure() {
        const instance = $tree.jstree(true);
        const result = [];
        if (!instance) {
            return result;
        }
        (function walk(nodeId, parentNo) {
            const node = instance.get_node(nodeId);
            (node.children || []).forEach(function (childId, index) {
                const child = instance.get_node(childId);
                result.push({ menuNo: child.data.menuNo, parentNo: parentNo, index: index });
                walk(childId, child.data.menuNo);
            });
        })('#', null);
        return result;
    }

    // 가장 긴 증가 부분 수열의 길이 — 같은 부모 안에서 "자리를 지킨 메뉴" 수를 구하는 데 쓴다(O(n²), 메뉴는 소규모).
    function longestIncreasingLength(sequence) {
        const best = [];
        let longest = 0;
        sequence.forEach(function (value, i) {
            best[i] = 1;
            for (let j = 0; j < i; j++) {
                if (sequence[j] < value && best[j] + 1 > best[i]) {
                    best[i] = best[j] + 1;
                }
            }
            longest = Math.max(longest, best[i]);
        });
        return longest;
    }

    // 반영 대기 건수 = 실제로 옮긴 메뉴 수: 부모가 바뀐 메뉴 + 같은 부모 안에서 상대 순서가 바뀐 메뉴.
    // 한 메뉴를 옮기면 다른 형제의 위치 인덱스가 전부 밀리지만 그것까지 세면 건수가 부풀려지므로,
    // 같은 부모에 남은 메뉴는 기준 인덱스의 최장 증가 부분 수열(자리를 지킨 메뉴)을 제외한 나머지만 센다.
    function countDraftChanges() {
        let changed = 0;
        const stayersByParent = new Map();
        readCurrentStructure().forEach(function (entry) {
            const base = baseStructure.get(entry.menuNo);
            if (!base || base.parentNo !== entry.parentNo) {
                changed++;
                return;
            }
            if (!stayersByParent.has(entry.parentNo)) {
                stayersByParent.set(entry.parentNo, []);
            }
            stayersByParent.get(entry.parentNo).push(base.index);
        });
        stayersByParent.forEach(function (indexes) {
            changed += indexes.length - longestIncreasingLength(indexes);
        });
        return changed;
    }

    // 초안이 있으면 서버 상태를 바꾸는 다른 작업(저장·삭제·추가·토글)을 막는다 — 이 작업들은 트리를 다시 불러와 초안이 사라진다.
    function refreshDraftUi() {
        draftChanged = countDraftChanges();
        const dirty = draftChanged > 0;
        draftBar.classList.toggle('dirty', dirty);
        draftStatus.textContent = dirty
            ? '반영 대기 중 ' + draftChanged + '건(이동한 메뉴) — [반영]을 눌러야 저장됩니다'
            : '변경 없음';
        btnApply.disabled = !dirty || busy;
        btnCancel.disabled = !dirty || busy;

        includeInactiveToggle.disabled = dirty;
        [btnNewTop, btnNewChild, btnSave, btnDeactivate, btnPermanentDelete, btnReset].forEach(function (button) {
            button.disabled = dirty;
        });
        menuForm.querySelectorAll('input, select, textarea').forEach(function (field) {
            field.disabled = dirty;
        });
        if (dirty) {
            setModeLabel('반영 대기 중인 구조 변경이 있습니다. [반영] 또는 [취소]한 뒤 메뉴 정보를 수정할 수 있습니다.');
        } else if (mode === null) {
            setModeLabel('메뉴를 선택하거나 추가 버튼을 눌러주세요.');
        }
    }

    // ── 트리 렌더링 ──────────────────────────────────────

    function decorateInactive(nodes) {
        return (nodes || []).map(function (node) {
            const decorated = Object.assign({}, node);
            if (node.data && node.data.useYn === false) {
                decorated.a_attr = { class: 'menu-inactive' };
            }
            if (node.children && node.children.length) {
                decorated.children = decorateInactive(node.children);
            }
            return decorated;
        });
    }

    function updateTreeHint() {
        if (treeScope === 'all') {
            treeHint.textContent = '메뉴를 드래그해 순서를 바꾸거나 다른 상위 메뉴 안으로 옮긴 뒤 [반영]을 눌러야 저장됩니다(최대 '
                + MAX_DEPTH + '단, 하위 메뉴는 함께 이동합니다).';
            treeHint.classList.remove('d-none');
        } else if (treeScope === 'active') {
            treeHint.textContent = '구조 편집(드래그)은 비활성 메뉴까지 보여야 하므로 "비활성 포함"을 켜면 사용할 수 있습니다.';
            treeHint.classList.remove('d-none');
        } else {
            treeHint.classList.add('d-none');
        }
    }

    async function loadTree() {
        const seq = ++loadSeq;
        selectSeq++;
        treeScope = null;
        updateTreeHint();
        hideTreeError();
        hideTreeWarning();
        hideTreeSuccess();
        const scope = includeInactiveToggle.checked ? 'all' : 'active';
        const useYnParam = scope === 'all' ? 'all' : 'true';

        try {
            const response = await fetch('/admin/api/menus/tree?useYn=' + useYnParam);
            if (!response.ok) {
                throw new Error(await extractErrorMessage(response, '메뉴 트리 조회에 실패했습니다.'));
            }

            const data = await response.json();
            // 더 최근의 조회가 시작됐다면 이 응답은 폐기한다(응답 순서 역전 방지).
            if (seq !== loadSeq) {
                return;
            }
            const decorated = decorateInactive(data);
            const instance = $tree.jstree(true);

            // 트리 교체 직전에 선택 상태 세대를 올려, 교체 전 옛 트리에서 시작한 상세 조회 응답이 늦게 와도 폼을 채우지 않게 한다.
            selectSeq++;
            // 매번 destroy 후 재초기화해 이전 트리 상태에 의존하지 않고 최신 데이터를 반영한다(초안도 이때 사라진다).
            if (instance) {
                instance.destroy();
            }
            initTree(decorated);
            baseStructure = new Map();
            indexServerTree(data, null, baseStructure);
            treeScope = scope;
            updateTreeHint();
            refreshDraftUi();
            // 최신 조회가 실제로 적용된 지금 결과 메시지를 표시한다.
            flushQueuedNotice();
        } catch (error) {
            if (seq !== loadSeq) {
                return;
            }
            showTreeError(error && error.message ? error.message : '메뉴 트리 조회 중 오류가 발생했습니다.');
            // 최신 조회가 실패했어도 대기 중인 결과 메시지는 잃지 않고 함께 보여 준다.
            if (queuedNotice) {
                showTreeWarning(queuedNotice.text);
                queuedNotice = null;
            }
        }
    }

    // ── 선택/모드 전환 ──────────────────────────────────────

    async function handleSelectNode(e, data) {
        // 저장·비활성화·반영이 진행 중이면 선택을 무시한다(완료 뒤 어차피 초기화되므로 폼이 채워졌다 지워지는 혼란 방지).
        if (busy) {
            return;
        }
        const menuNo = data.node.data.menuNo;
        const seq = ++selectSeq;
        hideFormError();

        try {
            const response = await fetch('/admin/api/menus/' + encodeURIComponent(menuNo));
            if (!response.ok) {
                throw new Error(await extractErrorMessage(response, '메뉴 상세 조회에 실패했습니다.'));
            }

            const menu = await response.json();
            // 그 사이 다른 선택·초기화·트리 교체·생성 모드 진입이 있었다면 이 응답은 낡은 것이다.
            if (seq !== selectSeq) {
                return;
            }
            mode = 'edit';
            selectedMenuNo = menu.menuNo;
            selectedMenuSnapshot = { menuNo: menu.menuNo, menuName: menu.menuName, useYn: menu.useYn === true };
            pendingParentMenuNo = null;
            fillForm(menu, data.node.data.exposureLabel);
            setModeLabel('메뉴 수정: ' + menu.menuName);
            syncActionButtons();
            refreshDraftUi();
        } catch (error) {
            if (seq !== selectSeq) {
                return;
            }
            showFormError(error && error.message ? error.message : '메뉴 상세 조회 중 오류가 발생했습니다.');
        }
    }

    // 드래그가 끝나면 서버에는 아무것도 보내지 않고 초안 상태(변경 건수·버튼)만 갱신한다. 저장은 [반영]에서 한다.
    function handleMoveNode() {
        if (!canDrag()) {
            // check_callback이 막아야 하는 상태 — 방어적으로 서버 상태로 되돌린다.
            loadTree();
            return;
        }
        hideTreeError();
        hideTreeWarning();
        hideTreeSuccess();
        refreshDraftUi();
    }

    // 최종 구조를 서버가 요구하는 형태로 만든다: 전체 메뉴(비활성 포함), 같은 부모 안의 배열 순서가 새 순서.
    function buildStructureRequest() {
        return {
            menus: readCurrentStructure().map(function (entry) {
                const base = baseStructure.get(entry.menuNo);
                return {
                    menuNo: entry.menuNo,
                    baseUpMenuNo: base.upMenuNo,
                    baseOrd: base.ord,
                    upMenuNo: entry.parentNo
                };
            })
        };
    }

    async function handleApply() {
        if (busy || draftChanged === 0 || treeScope !== 'all') {
            return;
        }
        busy = true;
        refreshDraftUi();
        hideTreeError();
        hideTreeWarning();
        hideTreeSuccess();

        let discardDraft = false;
        let notice = null;
        try {
            const response = await fetch('/admin/api/menus/structure', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(buildStructureRequest())
            });
            if (response.ok) {
                // 사이드바까지 새 구조로 갱신하려고 페이지를 다시 읽고, 성공 메시지는 다시 읽은 뒤 표시한다.
                try {
                    sessionStorage.setItem(APPLIED_KEY, String(draftChanged));
                } catch (storageError) {
                    // 저장소를 쓸 수 없으면 메시지 없이 새로고침만 한다.
                }
                leavingAfterApply = true;
                window.location.reload();
                return;
            }
            const message = await extractErrorMessage(response, '구조 반영에 실패했습니다.');
            if (response.status === 409) {
                // 다른 관리자가 먼저 바꿨거나 동시 변경과 충돌했다 — 낡은 초안은 버리고 서버 상태로 다시 그린다.
                notice = { kind: 'error', text: message + ' 서버의 최신 구조로 새로고침했습니다.' };
                discardDraft = true;
            } else {
                // 구조 위반(400) 등: 초안은 그대로 두어 사용자가 고치거나 취소할 수 있게 한다.
                showTreeError(message);
            }
        } catch (error) {
            showTreeError(error && error.message ? error.message : '구조 반영 중 오류가 발생했습니다.');
        }

        try {
            if (discardDraft) {
                queuedNotice = notice;
                resetSelectionState();
                await loadTree();
            }
        } finally {
            busy = false;
            refreshDraftUi();
        }
    }

    // 초안을 버리고 서버 상태로 되돌린다.
    function handleCancel() {
        if (busy || draftChanged === 0) {
            return;
        }
        queuedNotice = null;
        resetSelectionState();
        loadTree();
    }

    // 트리(sub)의 높이 — 노드 자신 포함. 깊이 검사에 쓴다.
    function subtreeHeight(instance, node) {
        let tallest = 0;
        (node.children || []).forEach(function (childId) {
            tallest = Math.max(tallest, subtreeHeight(instance, instance.get_node(childId)));
        });
        return 1 + tallest;
    }

    function initTree(data) {
        $tree.jstree({
            core: {
                themes: {
                    name: 'default',
                    responsive: true
                },
                data: data,
                // 드래그는 move_node만 허용한다. 같은 부모 안의 순서 변경은 깊이·권한과 무관하게 항상 가능하고(서버도 ord만
                // 바뀐 행은 검증하지 않는다 — 기존 4단 메뉴나 권한 불일치 메뉴도 재정렬할 수 있어야 한다), 다른 부모로 옮기는 것은
                // 서버 구조 규칙과 같게 순환(자기·자손 아래)과 깊이(새 부모 깊이 + 이동 서브트리 높이 ≤ MAX_DEPTH)만 막는다.
                // 비활성 부모·관리자 전용 아래 공용 메뉴는 서버가 판정하고 반영 시 400 메시지로 알린다.
                // 이 검사는 드래그 중과 드롭 후 최종 검사 두 단계 모두에서 호출된다(후자에는 more.dnd가 없다).
                check_callback: function (operation, node, parent, position, more) {
                    if (operation !== 'move_node') {
                        return false;
                    }
                    if (!canDrag()) {
                        return false;
                    }
                    if (!parent) {
                        return false;
                    }
                    if (more && (more.is_multi || more.is_foreign)) {
                        return false;
                    }
                    if (parent.id === node.parent) {
                        return true;
                    }
                    if (parent.id === node.id) {
                        return false;
                    }
                    if (parent.id !== '#' && parent.parents.indexOf(node.id) !== -1) {
                        return false;
                    }
                    const instance = $tree.jstree(true);
                    const parentDepth = parent.id === '#' ? 0 : parent.parents.length;
                    return parentDepth + subtreeHeight(instance, node) <= MAX_DEPTH;
                }
            },
            plugins: ['types', 'dnd'],
            types: {
                default: {
                    icon: 'fas fa-folder'
                }
            },
            dnd: {
                copy: false,
                drag_selection: false,
                // 트리 교체 중이거나 활성만 보기·저장·반영이 진행 중이면 드래그를 시작하지 못하게 한다(드롭 시점에도 다시 검사).
                is_draggable: function () {
                    return canDrag();
                }
            }
        });

        // instance.destroy()가 이 요소에 바인딩된 이벤트(select_node 핸들러 포함)를 모두
        // 제거하므로, 매번 재초기화할 때 다시 바인딩한다.
        $tree.off('select_node.jstree').on('select_node.jstree', handleSelectNode);
        $tree.off('move_node.jstree').on('move_node.jstree', handleMoveNode);
    }

    btnNewTop.addEventListener('click', function () {
        selectSeq++; // 대기 중이던 상세 조회 응답이 생성 모드를 편집 모드로 되돌리지 못하게 한다.
        mode = 'create';
        selectedMenuNo = null;
        selectedMenuSnapshot = null;
        pendingParentMenuNo = null;
        clearForm();
        hideFormError();
        setModeLabel('새 메뉴 추가 (최상위)');
        syncActionButtons();
    });

    btnNewChild.addEventListener('click', function () {
        const instance = $tree.jstree(true);
        const selected = instance ? instance.get_selected(true) : [];

        if (!selected || selected.length === 0) {
            showFormError('먼저 상위로 사용할 메뉴를 트리에서 선택해주세요.');
            return;
        }

        const parentNode = selected[0];
        selectSeq++; // 대기 중이던 상세 조회 응답이 생성 모드를 편집 모드로 되돌리지 못하게 한다.
        mode = 'create';
        pendingParentMenuNo = parentNode.data.menuNo;
        selectedMenuNo = null;
        selectedMenuSnapshot = null;
        clearForm();
        hideFormError();
        setModeLabel('새 메뉴 추가 (상위: ' + parentNode.text + ')');
        syncActionButtons();
    });

    btnApply.addEventListener('click', handleApply);
    btnCancel.addEventListener('click', handleCancel);

    btnReset.addEventListener('click', function () {
        const instance = $tree.jstree(true);
        if (instance) {
            instance.deselect_all();
        }
        resetSelectionState();
    });

    // ── 저장/삭제 ──────────────────────────────────────

    // 순서(ord)는 보내지 않는다 — 구조·순서는 트리 드래그 + [반영]으로만 바꾼다(낡은 폼이 확정된 순서를 되돌리는 것을 막는다).
    function buildPayload() {
        return {
            menuName: menuNameInput.value.trim(),
            menuUrl: menuUrlInput.value.trim(),
            menuIcon: menuIconInput.value.trim(),
            menuDesc: menuDescInput.value.trim(),
            useYn: menuUseYnInput.checked
        };
    }

    btnSave.addEventListener('click', async function () {
        hideFormError();

        if (mode !== 'create' && mode !== 'edit') {
            showFormError('메뉴를 선택하거나 추가 버튼을 눌러 새 메뉴를 작성해주세요.');
            return;
        }

        // 저장·비활성화·반영은 동시에 하나만 진행한다(이미 전송된 요청은 취소되지 않으므로).
        if (busy) {
            showFormError('다른 작업이 진행 중입니다. 잠시 후 다시 시도해주세요.');
            return;
        }
        busy = true;

        const payload = buildPayload();

        try {
            let response;
            if (mode === 'create') {
                payload.upMenuNo = pendingParentMenuNo;
                response = await fetch('/admin/api/menus', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        [csrfHeader]: csrfToken
                    },
                    body: JSON.stringify(payload)
                });
            } else {
                response = await fetch('/admin/api/menus/' + encodeURIComponent(selectedMenuNo), {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        [csrfHeader]: csrfToken
                    },
                    body: JSON.stringify(payload)
                });
            }

            if (!response.ok) {
                throw new Error(await extractErrorMessage(response, '저장에 실패했습니다.'));
            }

            resetSelectionState();
            await loadTree();
        } catch (error) {
            showFormError(error && error.message ? error.message : '저장 중 오류가 발생했습니다.');
        } finally {
            busy = false;
        }
    });

    // 비활성화: PATCH {useYn:false}만 보낸다 — 폼의 다른 값(저장하지 않은 편집 내용)을 함께 실어 보내지 않는다.
    // 대상은 확정된 스냅샷의 menuNo이며, 확인창이 떠 있는 사이 선택이 바뀌어도 처음 누른 메뉴만 비활성화한다.
    btnDeactivate.addEventListener('click', async function () {
        hideFormError();

        const target = selectedMenuSnapshot;
        if (mode !== 'edit' || target === null) {
            showFormError('비활성화할 메뉴를 선택해주세요.');
            return;
        }

        if (!confirm('선택한 메뉴를 비활성화하시겠습니까?')) {
            return;
        }

        if (busy) {
            showFormError('다른 작업이 진행 중입니다. 잠시 후 다시 시도해주세요.');
            return;
        }
        busy = true;

        try {
            const response = await fetch('/admin/api/menus/' + encodeURIComponent(target.menuNo), {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify({ useYn: false })
            });

            if (!response.ok) {
                throw new Error(await extractErrorMessage(response, '메뉴 비활성화에 실패했습니다.'));
            }

            resetSelectionState();
            await loadTree();
        } catch (error) {
            showFormError(error && error.message ? error.message : '메뉴 비활성화 중 오류가 발생했습니다.');
        } finally {
            busy = false;
        }
    });

    // ── 영구삭제 ──────────────────────────────────────

    const permanentDeleteModal = $('#permanentDeleteModal');
    const permanentDeleteInput = document.getElementById('permanentDeleteInput');
    const permanentDeleteConfirmText = document.getElementById('permanentDeleteConfirmText');
    const permanentDeleteError = document.getElementById('permanentDeleteError');
    const btnPermanentDeleteConfirm = document.getElementById('btnPermanentDeleteConfirm');
    const btnPermanentDeleteCancel = document.getElementById('btnPermanentDeleteCancel');

    // 메뉴명에 개행 같은 제어문자가 있으면 단일행 입력창에 그대로 입력할 수 없다(브라우저가 CR/LF를 제거한다). 그래서 이름 원문
    // 대신 가역 이스케이프한 확인 문자열을 보여 주고 그것을 입력하게 한다 — 서버 로그용 이스케이프와 같은 규칙이다:
    // 역슬래시 → \\, CR → \r, LF → \n, TAB → \t, 그 밖의 제어문자(Cc)·줄/문단 구분자(U+2028·U+2029) → \uXXXX.
    // 제어문자가 없는 평범한 이름은 원문 그대로다.
    // 정규식 리터럴 대신 코드 값으로 판정한다 — 줄 구분자(U+2028·U+2029)가 정규식 리터럴 안에 원문으로 들어가면 구문 오류다.
    function escapeForConfirm(value) {
        let escaped = '';
        for (const ch of String(value)) {
            const code = ch.codePointAt(0);
            if (ch === '\\') {
                escaped += '\\\\';
            } else if (ch === '\r') {
                escaped += '\\r';
            } else if (ch === '\n') {
                escaped += '\\n';
            } else if (ch === '\t') {
                escaped += '\\t';
            } else if (code <= 0x1f || (code >= 0x7f && code <= 0x9f) || code === 0x2028 || code === 0x2029
                    || (ch !== ' ' && /\s/.test(ch))) {
                // 일반 공백 외의 공백류(NBSP·U+FEFF 등)도 이스케이프한다 — 서버의 @NotBlank는 이런 문자만으로 된 이름을 통과시키는데,
                // 눈에 보이지 않는 채로 두면 입력 비교에서 사라져(trim) 이름을 입력하지 않고도 확인이 통과할 수 있다.
                escaped += '\\u' + code.toString(16).padStart(4, '0');
            } else {
                escaped += ch;
            }
        }
        return escaped;
    }

    function showPermanentDeleteError(message) {
        permanentDeleteError.textContent = message;
        permanentDeleteError.classList.remove('d-none');
    }

    function expectedConfirmText() {
        return permanentDeleteTarget === null ? null : escapeForConfirm(permanentDeleteTarget.menuName);
    }

    // 입력은 trim 없이 확인 문자열과 정확히 비교한다. 확인 문자열이 비어 있으면(있을 수 없지만 방어적으로) 확정을 허용하지 않는다.
    function isPermanentDeleteConfirmed() {
        const expected = expectedConfirmText();
        return expected !== null && expected !== '' && permanentDeleteInput.value === expected;
    }

    function refreshPermanentDeleteConfirm() {
        btnPermanentDeleteConfirm.disabled = busy || !isPermanentDeleteConfirmed();
    }

    btnPermanentDelete.addEventListener('click', function () {
        hideFormError();

        const snapshot = selectedMenuSnapshot;
        if (mode !== 'edit' || snapshot === null || snapshot.useYn !== false) {
            showFormError('영구삭제는 비활성 상태의 메뉴를 선택했을 때만 할 수 있습니다.');
            return;
        }

        // 모달을 연 순간의 대상을 복사해 고정한다 — 이후 이름 확인과 DELETE는 이 복사본만 쓰고 전역 선택 상태는 읽지 않는다.
        permanentDeleteTarget = Object.freeze({ menuNo: snapshot.menuNo, menuName: snapshot.menuName });
        permanentDeleteConfirmText.textContent = expectedConfirmText();
        permanentDeleteInput.value = '';
        permanentDeleteError.classList.add('d-none');
        permanentDeleteError.textContent = '';
        refreshPermanentDeleteConfirm();
        permanentDeleteModal.modal('show');
    });

    permanentDeleteModal.on('shown.bs.modal', function () {
        permanentDeleteInput.focus();
    });

    // 모달이 aria-hidden 처리되기 전에 포커스를 빼 둔다 — 포커스를 쥔 채 숨기면 접근성 경고가 난다.
    permanentDeleteModal.on('hide.bs.modal', function () {
        if (document.activeElement && permanentDeleteModal[0].contains(document.activeElement)) {
            document.activeElement.blur();
        }
    });

    permanentDeleteInput.addEventListener('input', refreshPermanentDeleteConfirm);

    btnPermanentDeleteCancel.addEventListener('click', function () {
        if (busy) {
            return;
        }
        permanentDeleteTarget = null;
        permanentDeleteModal.modal('hide');
    });

    btnPermanentDeleteConfirm.addEventListener('click', async function () {
        const target = permanentDeleteTarget;
        if (busy || target === null || !isPermanentDeleteConfirmed()) {
            return;
        }
        busy = true;
        refreshPermanentDeleteConfirm();
        permanentDeleteError.classList.add('d-none');

        let closeModal = false;
        try {
            const response = await fetch('/admin/api/menus/' + encodeURIComponent(target.menuNo), {
                method: 'DELETE',
                headers: {
                    [csrfHeader]: csrfToken
                }
            });

            if (response.status === 204 || response.ok) {
                queuedNotice = { kind: 'success', text: '메뉴를 영구삭제했습니다.' };
                closeModal = true;
            } else if (response.status === 404) {
                // 다른 관리자가 먼저 지웠다 — 트리를 다시 읽어 최신 상태를 보여 준다.
                queuedNotice = { kind: 'warning', text: '이미 삭제되었거나 존재하지 않는 메뉴입니다. 최신 구조로 새로고침했습니다.' };
                closeModal = true;
            } else {
                // 409(활성 메뉴·하위 메뉴 존재) 등 — 모달을 유지한 채 서버 메시지를 보여 준다.
                showPermanentDeleteError(await extractErrorMessage(response, '메뉴 영구삭제에 실패했습니다.'));
            }
        } catch (error) {
            showPermanentDeleteError(error && error.message ? error.message : '메뉴 영구삭제 중 오류가 발생했습니다.');
        } finally {
            busy = false;
            refreshPermanentDeleteConfirm();
        }

        if (closeModal) {
            permanentDeleteTarget = null;
            permanentDeleteModal.modal('hide');
            resetSelectionState();
            await loadTree();
        }
    });

    includeInactiveToggle.addEventListener('change', function () {
        loadTree();
    });

    // 반영하지 않은 구조 변경이 있는 채로 페이지를 떠나려 하면 브라우저 확인창을 띄운다.
    window.addEventListener('beforeunload', function (event) {
        if (draftChanged > 0 && !leavingAfterApply) {
            event.preventDefault();
            event.returnValue = '';
        }
    });

    // 반영 성공 뒤 다시 읽은 페이지라면 성공 메시지를 대기시킨다(첫 트리 조회가 적용될 때 표시된다).
    try {
        const applied = sessionStorage.getItem(APPLIED_KEY);
        if (applied !== null) {
            sessionStorage.removeItem(APPLIED_KEY);
            queuedNotice = { kind: 'success', text: '메뉴 구조를 반영했습니다(' + applied + '건 이동).' };
        }
    } catch (storageError) {
        // 저장소를 쓸 수 없으면 메시지 없이 진행한다.
    }

    loadTree();
});
</script>

</body>
</html>
