<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: adminHead}">
    <title>메뉴 관리</title>
</head>
<body id="page-top">
<!--
    th:replace는 head 태그 자체를 통째로 adminHead 프래그먼트로 치환하므로, 원래 head 안에
    있던 title·link·style은 렌더링 결과에 포함되지 않는다(기존 admin-manage.html의
    페이지 전용 CSS link도 동일한 이유로 head 바깥/body 시작 지점에 둔다 — 그 컨벤션을 따른다).
-->
<!-- jstree CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css" />
<style>
        .menu-container {
            padding: 20px;
            height: calc(100vh - 200px);
            background-color: #f8f9fc;
        }
        .tree-container {
            background: white;
            padding: 0;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            overflow: auto;
            height: 100%;
            margin-right: 20px;
            border: 1px solid #4e73df;
        }
        .form-container {
            background: white;
            padding: 0;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            overflow: auto;
            height: 100%;
            margin-left: 20px;
            border: 1px solid #1cc88a;
        }
        .card-header {
            background-color: #f8f9fc;
            border-bottom: 1px solid #e3e6f0;
            padding: 0.75rem 1.25rem;
        }
        .tree-container .card-header {
            background: linear-gradient(to right, #4e73df, #224abe);
            border-bottom: none;
        }
        .form-container .card-header {
            background: linear-gradient(to right, #1cc88a, #13855c);
            border-bottom: none;
        }
        .card-header h6 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: white;
        }
        .form-container .card-header h6 {
            color: #1cc88a;
        }
        .card-body {
            padding: 1.25rem;
        }
        .btn-container {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }
        .tree-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tree-toolbar .btn-group-actions {
            display: flex;
            gap: 8px;
        }
        #menuTree {
            margin-top: 15px;
            padding: 20px;
            border: 1px solid #eaecf4;
            border-radius: 8px;
            background-color: #f8f9fc;
        }
        .form-group {
            margin-bottom: 1.5rem;
            background-color: #f8f9fc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eaecf4;
        }
        .form-group label {
            font-weight: 600;
            color: #5a5c69;
            margin-bottom: 0.5rem;
            display: block;
        }
        .form-control {
            border-radius: 5px;
            border: 1px solid #d1d3e2;
            padding: 0.6rem 1rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            background-color: white;
        }
        .form-control:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
        }
        .btn {
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            border-radius: 5px;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #4e73df;
            border-color: #4e73df;
        }
        .btn-primary:hover {
            background-color: #2e59d9;
            border-color: #2653d4;
        }
        .btn-danger {
            background-color: #e74a3b;
            border-color: #e74a3b;
        }
        .btn-danger:hover {
            background-color: #e02d1b;
            border-color: #d52a1a;
        }
        .btn-secondary {
            background-color: #858796;
            border-color: #858796;
        }
        .btn-secondary:hover {
            background-color: #717384;
            border-color: #6b6d7d;
        }
        .custom-control-input:checked ~ .custom-control-label::before {
            background-color: #4e73df;
            border-color: #4e73df;
        }
        .jstree-default .jstree-node {
            margin-left: 12px;
        }
        .jstree-default .jstree-themeicon {
            color: #4e73df;
        }
        .jstree-default .jstree-clicked {
            background-color: #eaecf4 !important;
            box-shadow: none;
        }
        .jstree-default .jstree-hovered {
            background-color: #f8f9fc !important;
            box-shadow: none;
        }
        .custom-control {
            padding-left: 2rem;
        }
        .custom-control-label {
            color: #5a5c69;
        }
        .custom-switch .custom-control-label::before {
            height: 1.25rem;
            width: 2.5rem;
            border-radius: 0.625rem;
        }
        .custom-switch .custom-control-label::after {
            height: calc(1.25rem - 4px);
            width: calc(1.25rem - 4px);
            border-radius: calc(1.25rem - 4px);
        }
        .form-mode-label {
            font-size: 0.85rem;
            color: #858796;
            margin-bottom: 10px;
        }
        /* 비활성 메뉴는 회색으로만 구분하고 선택은 그대로 가능하게 둔다 (jstree state.disabled 미사용) */
        .jstree-anchor.menu-inactive,
        .jstree-anchor.menu-inactive .jstree-icon {
            color: #b0b3b8 !important;
        }
    </style>

<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/sidebar :: adminSidebar}"></div>
    <!-- End of Sidebar -->

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            <!-- Topbar -->
            <div th:replace="~{admin/fragments/topbar :: adminTopbar}"></div>
            <!-- End of Topbar -->

            <div class="container-fluid">
                <!-- Page Heading -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">메뉴 관리</h1>
                </div>

                <div class="menu-container">
                    <div class="row">
                        <div class="col-md-5">
                            <div class="tree-container">
                                <div class="card-header">
                                    <h6>메뉴 구조</h6>
                                </div>
                                <div class="card-body">
                                    <div id="treeAlert" class="alert alert-danger d-none" role="alert"></div>
                                    <div class="tree-toolbar">
                                        <div class="custom-control custom-switch">
                                            <input type="checkbox" class="custom-control-input" id="includeInactiveToggle">
                                            <label class="custom-control-label" for="includeInactiveToggle">비활성 포함</label>
                                        </div>
                                        <div class="btn-group-actions">
                                            <button type="button" class="btn btn-primary btn-sm" id="btnNewTop">새 최상위</button>
                                            <button type="button" class="btn btn-primary btn-sm" id="btnNewChild">선택 아래 하위 추가</button>
                                        </div>
                                    </div>
                                    <small id="treeHint" class="form-text text-muted d-none mb-2"></small>
                                    <div id="menuTree"></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-7">
                            <div class="form-container">
                                <div class="card-header">
                                    <h6>메뉴 정보</h6>
                                </div>
                                <div class="card-body">
                                    <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>
                                    <div id="formModeLabel" class="form-mode-label">메뉴를 선택하거나 추가 버튼을 눌러주세요.</div>
                                    <form id="menuForm">
                                        <div class="form-group">
                                            <label for="menuName">메뉴명</label>
                                            <input type="text" class="form-control" id="menuName" name="menuName">
                                        </div>
                                        <div class="form-group">
                                            <label for="menuUrl">URL</label>
                                            <input type="text" class="form-control" id="menuUrl" name="menuUrl">
                                        </div>
                                        <div class="form-group">
                                            <label for="menuOrder">순서</label>
                                            <input type="number" class="form-control" id="menuOrder" name="menuOrder" min="0">
                                        </div>
                                        <div class="form-group">
                                            <label for="menuIcon">아이콘</label>
                                            <input type="text" class="form-control" id="menuIcon" name="menuIcon">
                                        </div>
                                        <div class="form-group">
                                            <label for="menuDesc">설명</label>
                                            <textarea class="form-control" id="menuDesc" name="menuDesc" rows="3"></textarea>
                                        </div>
                                        <div class="form-group">
                                            <label for="menuAccessRole">노출 범위</label>
                                            <select class="form-control" id="menuAccessRole" name="menuAccessRole">
                                                <option value="ALL">공용 (ADMIN·MANAGER)</option>
                                                <option value="ADMIN">관리자 전용 (ADMIN)</option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <div class="custom-control custom-switch">
                                                <input type="checkbox" class="custom-control-input" id="menuUseYn" name="menuUseYn">
                                                <label class="custom-control-label" for="menuUseYn">사용 여부</label>
                                            </div>
                                        </div>
                                        <div class="btn-container">
                                            <button type="button" class="btn btn-primary" id="btnSave">저장</button>
                                            <button type="button" class="btn btn-danger" id="btnDelete">삭제</button>
                                            <button type="button" class="btn btn-secondary" id="btnReset">초기화</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap core JavaScript-->
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- Core plugin JavaScript-->
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

<!-- Custom scripts for all pages-->
<script src="/js/sb-admin-2.min.js"></script>

<!-- jstree JavaScript -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>

<script>
$(document).ready(function () {
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

    const $tree = $('#menuTree');
    const treeAlert = document.getElementById('treeAlert');
    const formAlert = document.getElementById('formAlert');
    const formModeLabel = document.getElementById('formModeLabel');
    const includeInactiveToggle = document.getElementById('includeInactiveToggle');
    const treeHint = document.getElementById('treeHint');

    const menuForm = document.getElementById('menuForm');
    const menuNameInput = document.getElementById('menuName');
    const menuUrlInput = document.getElementById('menuUrl');
    const menuOrderInput = document.getElementById('menuOrder');
    const menuIconInput = document.getElementById('menuIcon');
    const menuDescInput = document.getElementById('menuDesc');
    const menuAccessRoleInput = document.getElementById('menuAccessRole');
    const menuUseYnInput = document.getElementById('menuUseYn');

    const btnSave = document.getElementById('btnSave');
    const btnDelete = document.getElementById('btnDelete');
    const btnReset = document.getElementById('btnReset');
    const btnNewTop = document.getElementById('btnNewTop');
    const btnNewChild = document.getElementById('btnNewChild');

    // mode: null(선택 없음) | 'edit'(기존 메뉴 수정) | 'create'(신규 생성)
    let mode = null;
    let selectedMenuNo = null;
    let pendingParentMenuNo = null;

    // 트리 순서 변경(드래그) 상태 — PLAN-menu-reorder.md 쟁점 6.
    // treeScope: 지금 실제로 그려진 트리의 범위('all' | 'active'). 조회 시작~트리 교체 완료 사이는 null이라 드래그 불가.
    let treeScope = null;
    // loadSeq: loadTree() 호출 세대. 이전 조회 응답이 늦게 도착하면 폐기한다(토글 연타 시 응답 순서 역전 방지).
    let loadSeq = 0;
    // selectSeq: 폼/mode를 바꾸는 모든 전이에서 올리는 세대. 늦게 도착한 상세 응답이 낡은 값으로 폼을 되살리는 것을 막는다.
    let selectSeq = 0;
    // busy: 저장·비활성화·순서 변경은 동시에 하나만 진행한다.
    let busy = false;

    function canDrag() {
        return treeScope !== null && !busy;
    }

    function showTreeError(message) {
        treeAlert.textContent = message;
        treeAlert.classList.remove('d-none');
    }

    function hideTreeError() {
        treeAlert.classList.add('d-none');
        treeAlert.textContent = '';
    }

    function showFormError(message) {
        formAlert.textContent = message;
        formAlert.classList.remove('d-none');
    }

    function hideFormError() {
        formAlert.classList.add('d-none');
        formAlert.textContent = '';
    }

    async function extractErrorMessage(response, fallbackMessage) {
        try {
            const body = await response.json();
            return body.message || fallbackMessage;
        } catch (e) {
            return fallbackMessage;
        }
    }

    function clearForm() {
        menuForm.reset();
        // 신규 메뉴는 기본 활성으로 생성한다(API의 생성 기본값 useYn=true와 일치).
        // reset()은 스위치를 HTML 기본값(미체크)으로 되돌리므로 명시적으로 다시 켠다.
        menuUseYnInput.checked = true;
    }

    function fillForm(menu) {
        menuNameInput.value = menu.menuName || '';
        menuUrlInput.value = menu.menuUrl || '';
        menuOrderInput.value = menu.ord != null ? menu.ord : '';
        menuIconInput.value = menu.menuIcon || '';
        menuDescInput.value = menu.menuDesc || '';
        menuAccessRoleInput.value = menu.accessRole || 'ALL';
        menuUseYnInput.checked = !!menu.useYn;
    }

    function setModeLabel(text) {
        formModeLabel.textContent = text;
    }

    function resetSelectionState() {
        selectSeq++;
        mode = null;
        selectedMenuNo = null;
        pendingParentMenuNo = null;
        clearForm();
        hideFormError();
        setModeLabel('메뉴를 선택하거나 추가 버튼을 눌러주세요.');
    }

    // ── 트리 렌더링 ──────────────────────────────────────

    function decorateInactive(nodes) {
        return (nodes || []).map(function (node) {
            const decorated = Object.assign({}, node);
            if (node.data && node.data.useYn === false) {
                decorated.a_attr = { class: 'menu-inactive' };
            }
            if (node.children && node.children.length) {
                decorated.children = decorateInactive(node.children);
            }
            return decorated;
        });
    }

    function updateTreeHint() {
        if (treeScope === 'active') {
            treeHint.textContent = '메뉴를 드래그해 같은 상위 안에서 순서를 바꿀 수 있습니다. 비활성 메뉴는 원래 위치를 유지합니다.';
            treeHint.classList.remove('d-none');
        } else if (treeScope === 'all') {
            treeHint.textContent = '메뉴를 드래그해 같은 상위 안에서 순서를 바꿀 수 있습니다.';
            treeHint.classList.remove('d-none');
        } else {
            treeHint.classList.add('d-none');
        }
    }

    async function loadTree() {
        const seq = ++loadSeq;
        selectSeq++;
        treeScope = null;
        updateTreeHint();
        hideTreeError();
        const scope = includeInactiveToggle.checked ? 'all' : 'active';
        const useYnParam = scope === 'all' ? 'all' : 'true';

        try {
            const response = await fetch('/admin/api/menus/tree?useYn=' + useYnParam);
            if (!response.ok) {
                throw new Error(await extractErrorMessage(response, '메뉴 트리 조회에 실패했습니다.'));
            }

            const data = await response.json();
            // 더 최근의 조회가 시작됐다면 이 응답은 폐기한다(응답 순서 역전 방지).
            if (seq !== loadSeq) {
                return;
            }
            const decorated = decorateInactive(data);
            const instance = $tree.jstree(true);

            // 트리 교체 직전에 선택 상태 세대를 올려, 교체 전 옛 트리에서 시작한 상세 조회 응답이 늦게 와도 폼을 채우지 않게 한다.
            selectSeq++;
            // 매번 destroy 후 재초기화해 이전 트리 상태에 의존하지 않고 최신 데이터를 반영한다.
            if (instance) {
                instance.destroy();
            }
            initTree(decorated);
            treeScope = scope;
            updateTreeHint();
        } catch (error) {
            if (seq !== loadSeq) {
                return;
            }
            showTreeError(error && error.message ? error.message : '메뉴 트리 조회 중 오류가 발생했습니다.');
        }
    }

    // ── 선택/모드 전환 ──────────────────────────────────────

    async function handleSelectNode(e, data) {
        const menuNo = data.node.data.menuNo;
        const seq = ++selectSeq;
        hideFormError();

        try {
            const response = await fetch('/admin/api/menus/' + encodeURIComponent(menuNo));
            if (!response.ok) {
                throw new Error(await extractErrorMessage(response, '메뉴 상세 조회에 실패했습니다.'));
            }

            const menu = await response.json();
            // 그 사이 다른 선택·초기화·트리 교체·생성 모드 진입·순서 변경이 있었다면 이 응답은 낡은 것이다.
            if (seq !== selectSeq) {
                return;
            }
            mode = 'edit';
            selectedMenuNo = menu.menuNo;
            pendingParentMenuNo = null;
            fillForm(menu);
            setModeLabel('메뉴 수정: ' + menu.menuName);
        } catch (error) {
            if (seq !== selectSeq) {
                return;
            }
            showFormError(error && error.message ? error.message : '메뉴 상세 조회 중 오류가 발생했습니다.');
        }
    }

    // 드래그 앤 드롭으로 같은 부모 안의 순서가 바뀐 뒤 서버에 확정한다. 성공·실패 모두 서버 상태로 다시 그린다.
    async function handleMoveNode(e, data) {
        if (busy || treeScope === null) {
            // check_callback이 막아야 하는 상태 — 방어적으로 서버 상태로 되돌린다.
            await loadTree();
            return;
        }
        busy = true;
        selectSeq++;
        const scope = treeScope === 'all' ? 'ALL' : 'ACTIVE';
        let errorMessage = null;
        try {
            const instance = data.instance;
            const parentNode = instance.get_node(data.parent);
            const menuNos = (parentNode.children || []).map(function (childId) {
                return instance.get_node(childId).data.menuNo;
            });
            const upMenuNo = data.parent === '#' ? null : parentNode.data.menuNo;

            const response = await fetch('/admin/api/menus/order', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify({ upMenuNo: upMenuNo, scope: scope, menuNos: menuNos })
            });
            if (!response.ok) {
                errorMessage = await extractErrorMessage(response, '순서 변경에 실패했습니다.');
            }
        } catch (error) {
            errorMessage = error && error.message ? error.message : '순서 변경 중 오류가 발생했습니다.';
        }

        try {
            resetSelectionState();
            await loadTree();
            // loadTree()가 시작하면서 오류 표시를 지우므로 재조회가 끝난 뒤에 메시지를 보여 준다.
            if (errorMessage) {
                showTreeError(errorMessage);
            }
        } finally {
            busy = false;
        }
    }

    function initTree(data) {
        $tree.jstree({
            core: {
                themes: {
                    name: 'default',
                    responsive: true
                },
                data: data,
                // 같은 부모 안에서의 위치 이동(move_node)만 허용한다. jstree는 드래그 중 검사에는 more.dnd=true를,
                // 드롭 후 최종 move_node 검사에는 {core, origin, is_multi, is_foreign}만(dnd 없음) 넘기므로
                // 같은 부모 조건은 두 단계 모두에 적용하고 '안으로 넣기' 차단만 드래그 중 검사에 적용한다.
                check_callback: function (operation, node, parent, position, more) {
                    if (operation !== 'move_node') {
                        return false;
                    }
                    if (!canDrag()) {
                        return false;
                    }
                    if (!parent || parent.id !== node.parent) {
                        return false;
                    }
                    if (more) {
                        if (more.is_multi || more.is_foreign) {
                            return false;
                        }
                        if (more.dnd && more.pos === 'i') {
                            return false;
                        }
                    }
                    return true;
                }
            },
            plugins: ['types', 'dnd'],
            types: {
                default: {
                    icon: 'fas fa-folder'
                }
            },
            dnd: {
                copy: false,
                drag_selection: false,
                // 트리 교체 중이거나 저장·순서 변경이 진행 중이면 드래그를 시작하지 못하게 한다(드롭 시점에도 다시 검사).
                is_draggable: function () {
                    return canDrag();
                }
            }
        });

        // instance.destroy()가 이 요소에 바인딩된 이벤트(select_node 핸들러 포함)를 모두
        // 제거하므로, 매번 재초기화할 때 다시 바인딩한다.
        $tree.off('select_node.jstree').on('select_node.jstree', handleSelectNode);
        $tree.off('move_node.jstree').on('move_node.jstree', handleMoveNode);
    }

    btnNewTop.addEventListener('click', function () {
        selectSeq++; // 대기 중이던 상세 조회 응답이 생성 모드를 편집 모드로 되돌리지 못하게 한다.
        mode = 'create';
        selectedMenuNo = null;
        pendingParentMenuNo = null;
        clearForm();
        hideFormError();
        setModeLabel('새 메뉴 추가 (최상위)');
    });

    btnNewChild.addEventListener('click', function () {
        const instance = $tree.jstree(true);
        const selected = instance ? instance.get_selected(true) : [];

        if (!selected || selected.length === 0) {
            showFormError('먼저 상위로 사용할 메뉴를 트리에서 선택해주세요.');
            return;
        }

        const parentNode = selected[0];
        selectSeq++; // 대기 중이던 상세 조회 응답이 생성 모드를 편집 모드로 되돌리지 못하게 한다.
        mode = 'create';
        pendingParentMenuNo = parentNode.data.menuNo;
        selectedMenuNo = null;
        clearForm();
        hideFormError();
        setModeLabel('새 메뉴 추가 (상위: ' + parentNode.text + ')');
    });

    btnReset.addEventListener('click', function () {
        const instance = $tree.jstree(true);
        if (instance) {
            instance.deselect_all();
        }
        resetSelectionState();
    });

    // ── 저장/삭제 ──────────────────────────────────────

    function buildPayload() {
        const ordRaw = menuOrderInput.value.trim();
        return {
            menuName: menuNameInput.value.trim(),
            menuUrl: menuUrlInput.value.trim(),
            menuIcon: menuIconInput.value.trim(),
            menuDesc: menuDescInput.value.trim(),
            accessRole: menuAccessRoleInput.value,
            useYn: menuUseYnInput.checked,
            ord: ordRaw === '' ? null : Number(ordRaw)
        };
    }

    btnSave.addEventListener('click', async function () {
        hideFormError();

        if (mode !== 'create' && mode !== 'edit') {
            showFormError('메뉴를 선택하거나 추가 버튼을 눌러 새 메뉴를 작성해주세요.');
            return;
        }

        // 저장·비활성화·순서 변경은 동시에 하나만 진행한다(이미 전송된 요청은 취소되지 않으므로).
        if (busy) {
            showFormError('다른 작업이 진행 중입니다. 잠시 후 다시 시도해주세요.');
            return;
        }
        busy = true;

        const payload = buildPayload();

        try {
            let response;
            if (mode === 'create') {
                payload.upMenuNo = pendingParentMenuNo;
                response = await fetch('/admin/api/menus', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        [csrfHeader]: csrfToken
                    },
                    body: JSON.stringify(payload)
                });
            } else {
                response = await fetch('/admin/api/menus/' + encodeURIComponent(selectedMenuNo), {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        [csrfHeader]: csrfToken
                    },
                    body: JSON.stringify(payload)
                });
            }

            if (!response.ok) {
                throw new Error(await extractErrorMessage(response, '저장에 실패했습니다.'));
            }

            resetSelectionState();
            await loadTree();
        } catch (error) {
            showFormError(error && error.message ? error.message : '저장 중 오류가 발생했습니다.');
        } finally {
            busy = false;
        }
    });

    btnDelete.addEventListener('click', async function () {
        hideFormError();

        if (mode !== 'edit' || selectedMenuNo == null) {
            showFormError('비활성화할 메뉴를 선택해주세요.');
            return;
        }

        if (!confirm('선택한 메뉴를 비활성화하시겠습니까?')) {
            return;
        }

        if (busy) {
            showFormError('다른 작업이 진행 중입니다. 잠시 후 다시 시도해주세요.');
            return;
        }
        busy = true;

        try {
            const response = await fetch('/admin/api/menus/' + encodeURIComponent(selectedMenuNo), {
                method: 'DELETE',
                headers: {
                    [csrfHeader]: csrfToken
                }
            });

            if (!response.ok && response.status !== 204) {
                throw new Error(await extractErrorMessage(response, '메뉴 비활성화에 실패했습니다.'));
            }

            resetSelectionState();
            await loadTree();
        } catch (error) {
            showFormError(error && error.message ? error.message : '메뉴 비활성화 중 오류가 발생했습니다.');
        } finally {
            busy = false;
        }
    });

    includeInactiveToggle.addEventListener('change', function () {
        loadTree();
    });

    loadTree();
});
</script>

</body>
</html>
