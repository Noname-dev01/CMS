<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: adminHead(~{::title})}">
    <title>메뉴 관리</title>
</head>
<body id="page-top">
<!--/*
    메뉴 관리 화면의 셸(PLAN-content-menu-unify.md U3). 메뉴 구조 편집(ADMIN 전용 — URL 게이트가 최종 판정, 메뉴 API도 ADMIN 전용).
    - 본문은 React가 그린다(frontend/src/admin/menu, PLAN-react-admin-menu.md). 배치 순서: 패널 조각 → 모달 조각(body 직계) → 공통 의존성(jQuery·Bootstrap) → 번들.
    - 구조 반영이 성공하면 번들이 안내와 [지금 새로고침]을 띄우고 문서를 새로 읽는다.
*/-->
<div id="wrapper">
    <div th:replace="~{admin/fragments/sidebar :: adminSidebar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{admin/fragments/topbar :: adminTopbar}"></div>

            <div class="container-fluid">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">메뉴 관리</h1>
                </div>

                <div id="menuTabPanel">
                    <div th:replace="~{admin/menu/fragments/menu-tab :: menuPanel}"></div>
                </div>
            </div>
        </div>

        <div th:replace="~{admin/fragments/footer :: adminFooter}"></div>
    </div>
</div>

<th:block th:replace="~{admin/menu/fragments/menu-tab :: menuModals}"></th:block>

<div th:replace="~{admin/fragments/logout-modal :: logoutModal}"></div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>

<th:block th:replace="~{admin/menu/fragments/menu-tab :: menuScript}"></th:block>
</body>
</html>
