<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    메뉴 구조 패널의 조각(PLAN-content-menu-unify.md). 메뉴 관리 화면(admin/menu/manage.html, ADMIN 전용)이 포함한다. 파일 이름은 탭 시절 그대로지만 지금은 탭이 아니라 패널 조각이다.
    조각은 셋이다: menuPanel(전용 CSS·React 마운트 지점) / menuModals(모달 마운트 지점 — 패널 밖) / menuScript(의존성 로딩 뒤에 포함하는 번들). 조각 이름을 body·script로 짓지 않는다 — Thymeleaf가 HTML 요소 이름과 구분하지 못해 <body> 전체를 끌어온다.
    화면은 React가 그린다(frontend/src/admin/menu, PLAN-react-admin-menu.md). 서버 모델 데이터는 없다(API로 읽는다).
-->
<body>

<div th:fragment="menuPanel">
<style>
        /* 높이: 머리글 여백을 뺀 calc(100vh - 200px) — 더 크면 #content-wrapper가 자체 스크롤바를 만들어 스크롤바가 둘이 된다.
           스코프: 래퍼 ID(#menuTabPanel) 유지 — 모든 규칙을 패널(#menuTabPanel)과 모달 루트 id로 제한한다. 모달은 탭 패널 밖에 렌더링된다. */

        #menuTabPanel .menu-container,
        #permanentDeleteModal .menu-container,
        #iconPickerModal .menu-container {
            padding: 20px;
            height: calc(100vh - 200px);
            background-color: #f8f9fc;
        }
        #menuTabPanel .tree-container,
        #permanentDeleteModal .tree-container,
        #iconPickerModal .tree-container {
            background: white;
            padding: 0;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            overflow: auto;
            height: 100%;
            margin-right: 20px;
            border: 1px solid #4e73df;
        }
        #menuTabPanel .form-container,
        #permanentDeleteModal .form-container,
        #iconPickerModal .form-container {
            background: white;
            padding: 0;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            overflow: auto;
            height: 100%;
            margin-left: 20px;
            border: 1px solid #1cc88a;
        }
        #menuTabPanel .card-header,
        #permanentDeleteModal .card-header,
        #iconPickerModal .card-header {
            background-color: #f8f9fc;
            border-bottom: 1px solid #e3e6f0;
            padding: 0.75rem 1.25rem;
        }
        #menuTabPanel .tree-container .card-header,
        #permanentDeleteModal .tree-container .card-header,
        #iconPickerModal .tree-container .card-header {
            background: linear-gradient(to right, #4e73df, #224abe);
            border-bottom: none;
        }
        #menuTabPanel .form-container .card-header,
        #permanentDeleteModal .form-container .card-header,
        #iconPickerModal .form-container .card-header {
            background: linear-gradient(to right, #1cc88a, #13855c);
            border-bottom: none;
        }
        #menuTabPanel .card-header h6,
        #permanentDeleteModal .card-header h6,
        #iconPickerModal .card-header h6 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: white;
        }
        #menuTabPanel .form-container .card-header h6,
        #permanentDeleteModal .form-container .card-header h6,
        #iconPickerModal .form-container .card-header h6 {
            color: #1cc88a;
        }
        #menuTabPanel .card-body,
        #permanentDeleteModal .card-body,
        #iconPickerModal .card-body {
            padding: 1.25rem;
        }
        #menuTabPanel .btn-container,
        #permanentDeleteModal .btn-container,
        #iconPickerModal .btn-container {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }
        #menuTabPanel .tree-toolbar,
        #permanentDeleteModal .tree-toolbar,
        #iconPickerModal .tree-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        #menuTabPanel .tree-toolbar .btn-group-actions,
        #permanentDeleteModal .tree-toolbar .btn-group-actions,
        #iconPickerModal .tree-toolbar .btn-group-actions {
            display: flex;
            gap: 8px;
        }
        #menuTabPanel .draft-bar,
        #permanentDeleteModal .draft-bar,
        #iconPickerModal .draft-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        #menuTabPanel .draft-bar .draft-status,
        #permanentDeleteModal .draft-bar .draft-status,
        #iconPickerModal .draft-bar .draft-status {
            font-size: 0.85rem;
        }
        #menuTabPanel .draft-bar.dirty .draft-status,
        #permanentDeleteModal .draft-bar.dirty .draft-status,
        #iconPickerModal .draft-bar.dirty .draft-status {
            color: #e74a3b;
            font-weight: 700;
        }
        #menuTabPanel .draft-bar .btn-group-actions,
        #permanentDeleteModal .draft-bar .btn-group-actions,
        #iconPickerModal .draft-bar .btn-group-actions {
            display: flex;
            gap: 8px;
        }
        #menuTabPanel #menuTree,
        #permanentDeleteModal #menuTree,
        #iconPickerModal #menuTree {
            margin-top: 15px;
            padding: 20px;
            border: 1px solid #eaecf4;
            border-radius: 8px;
            background-color: #f8f9fc;
        }
        #menuTabPanel .form-group,
        #permanentDeleteModal .form-group,
        #iconPickerModal .form-group {
            margin-bottom: 1.5rem;
            background-color: #f8f9fc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eaecf4;
        }
        #menuTabPanel .form-group label,
        #permanentDeleteModal .form-group label,
        #iconPickerModal .form-group label {
            font-weight: 600;
            color: #5a5c69;
            margin-bottom: 0.5rem;
            display: block;
        }
        #menuTabPanel .form-control,
        #permanentDeleteModal .form-control,
        #iconPickerModal .form-control {
            border-radius: 5px;
            border: 1px solid #d1d3e2;
            padding: 0.6rem 1rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            background-color: white;
        }
        #menuTabPanel .form-control:focus,
        #permanentDeleteModal .form-control:focus,
        #iconPickerModal .form-control:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
        }
        #menuTabPanel .btn,
        #permanentDeleteModal .btn,
        #iconPickerModal .btn {
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            border-radius: 5px;
            transition: all 0.2s;
        }
        #menuTabPanel .btn-primary,
        #permanentDeleteModal .btn-primary,
        #iconPickerModal .btn-primary {
            background-color: #4e73df;
            border-color: #4e73df;
        }
        #menuTabPanel .btn-primary:hover,
        #permanentDeleteModal .btn-primary:hover,
        #iconPickerModal .btn-primary:hover {
            background-color: #2e59d9;
            border-color: #2653d4;
        }
        #menuTabPanel .btn-danger,
        #permanentDeleteModal .btn-danger,
        #iconPickerModal .btn-danger {
            background-color: #e74a3b;
            border-color: #e74a3b;
        }
        #menuTabPanel .btn-danger:hover,
        #permanentDeleteModal .btn-danger:hover,
        #iconPickerModal .btn-danger:hover {
            background-color: #e02d1b;
            border-color: #d52a1a;
        }
        #menuTabPanel .btn-secondary,
        #permanentDeleteModal .btn-secondary,
        #iconPickerModal .btn-secondary {
            background-color: #858796;
            border-color: #858796;
        }
        #menuTabPanel .btn-secondary:hover,
        #permanentDeleteModal .btn-secondary:hover,
        #iconPickerModal .btn-secondary:hover {
            background-color: #717384;
            border-color: #6b6d7d;
        }
        #menuTabPanel .custom-control-input:checked ~ .custom-control-label::before,
        #permanentDeleteModal .custom-control-input:checked ~ .custom-control-label::before,
        #iconPickerModal .custom-control-input:checked ~ .custom-control-label::before {
            background-color: #4e73df;
            border-color: #4e73df;
        }
        #menuTabPanel .icon-preview,
        #permanentDeleteModal .icon-preview,
        #iconPickerModal .icon-preview { display: inline-flex; width: 2.25rem; height: 2.25rem; align-items: center; justify-content: center;
            border: 1px solid #d1d3e2; border-radius: .35rem; font-size: 1.1rem; color: #4e73df; }
        #menuTabPanel .icon-grid,
        #permanentDeleteModal .icon-grid,
        #iconPickerModal .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: .5rem; max-height: 50vh; overflow-y: auto; }
        #menuTabPanel .icon-grid .icon-item,
        #permanentDeleteModal .icon-grid .icon-item,
        #iconPickerModal .icon-grid .icon-item { display: flex; flex-direction: column; align-items: center; padding: .5rem .25rem; background: #fff;
            border: 1px solid #e3e6f0; border-radius: .35rem; cursor: pointer; color: #5a5c69; }
        #menuTabPanel .icon-grid .icon-item:hover,
        #permanentDeleteModal .icon-grid .icon-item:hover,
        #iconPickerModal .icon-grid .icon-item:hover,
        #menuTabPanel .icon-grid .icon-item:focus,
        #permanentDeleteModal .icon-grid .icon-item:focus,
        #iconPickerModal .icon-grid .icon-item:focus { border-color: #4e73df; color: #4e73df; outline: none; }
        #menuTabPanel .icon-grid .icon-item.selected,
        #permanentDeleteModal .icon-grid .icon-item.selected,
        #iconPickerModal .icon-grid .icon-item.selected { background: #4e73df; border-color: #4e73df; color: #fff; }
        #menuTabPanel .icon-grid .icon-item i,
        #permanentDeleteModal .icon-grid .icon-item i,
        #iconPickerModal .icon-grid .icon-item i { font-size: 1.25rem; margin-bottom: .25rem; }
        #menuTabPanel .icon-grid .icon-item span,
        #permanentDeleteModal .icon-grid .icon-item span,
        #iconPickerModal .icon-grid .icon-item span { font-size: .65rem; word-break: break-all; text-align: center; }
        #menuTabPanel .custom-control,
        #permanentDeleteModal .custom-control,
        #iconPickerModal .custom-control {
            padding-left: 2rem;
        }
        #menuTabPanel .custom-control-label,
        #permanentDeleteModal .custom-control-label,
        #iconPickerModal .custom-control-label {
            color: #5a5c69;
        }
        #menuTabPanel .custom-switch .custom-control-label::before,
        #permanentDeleteModal .custom-switch .custom-control-label::before,
        #iconPickerModal .custom-switch .custom-control-label::before {
            height: 1.25rem;
            width: 2.5rem;
            border-radius: 0.625rem;
        }
        #menuTabPanel .custom-switch .custom-control-label::after,
        #permanentDeleteModal .custom-switch .custom-control-label::after,
        #iconPickerModal .custom-switch .custom-control-label::after {
            height: calc(1.25rem - 4px);
            width: calc(1.25rem - 4px);
            border-radius: calc(1.25rem - 4px);
        }
        #menuTabPanel .form-mode-label,
        #permanentDeleteModal .form-mode-label,
        #iconPickerModal .form-mode-label {
            font-size: 0.85rem;
            color: #858796;
            margin-bottom: 10px;
        }
        /* 트리(React가 그린다 — frontend/src/admin/menu/MenuTree.tsx) */
        #menuTabPanel .menu-tree-list { list-style: none; margin: 0; padding: 0; }
        #menuTabPanel .menu-tree-list .menu-tree-list { padding-left: 24px; }
        #menuTabPanel .menu-node-row { display: flex; align-items: flex-start; border-radius: .2rem; }
        #menuTabPanel .menu-node-toggle { flex: none; width: 24px; padding: 2px 0; border: 0; background: none; color: #858796; text-align: center; }
        #menuTabPanel .menu-node-label { padding: 2px 6px; border: 0; border-radius: .2rem; background: none; color: #5a5c69; text-align: left; overflow-wrap: anywhere; }
        #menuTabPanel .menu-node-label i { margin-right: 6px; color: #4e73df; }
        #menuTabPanel .menu-node-label:hover { background-color: #fff; }
        #menuTabPanel .menu-node-label.is-selected { background-color: #eaecf4; }
        /* 라벨을 끌면 스크롤이 아니라 드래그다(터치 포함). 스크롤은 라벨 밖에서 한다. */
        #menuTabPanel .menu-node-label.is-draggable { cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
        /* 비활성 메뉴는 회색으로만 구분하고 선택은 그대로 가능하게 둔다 */
        #menuTabPanel .menu-node-label.menu-inactive,
        #menuTabPanel .menu-node-label.menu-inactive i { color: #b0b3b8; }
        #menuTabPanel .menu-node-row.is-dragging { opacity: .5; }
        #menuTabPanel .menu-drop-before { box-shadow: inset 0 2px 0 0 #4e73df; }
        #menuTabPanel .menu-drop-after { box-shadow: inset 0 -2px 0 0 #4e73df; }
        #menuTabPanel .menu-drop-inside { background-color: #e8efff; box-shadow: inset 0 0 0 2px #4e73df; }
        #menuTabPanel .menu-drag-ghost { position: fixed; top: 0; left: 0; z-index: 1080; max-width: 300px; padding: 2px 8px; border-radius: .2rem; background: #4e73df; color: #fff;
            font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
        html.menu-dragging, html.menu-dragging * { cursor: grabbing !important; }
</style>

<div id="menuManageRoot"></div>
</div>

<!--
    모달은 패널 밖(body 직계)에 둔다. Bootstrap은 이미 부모가 있는 모달을 body로 옮기지 않고 배경막만 body에 붙이므로,
    숨겨지거나 쌓임 맥락이 다른 패널 안에 있으면 배경막·포커스 강제만 남아 화면이 갇힌다(영구삭제 모달은 Escape로도 못 닫는다).
-->
<th:block th:fragment="menuModals">
<div id="menuModalRoot"></div>
</th:block>

<th:block th:fragment="menuScript">
<script type="module" th:src="@{/js/admin-react/menu-manage.js}"></script>
</th:block>

</body>
</html>
