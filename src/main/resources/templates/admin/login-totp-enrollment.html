<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>2단계 인증 등록</title>

    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="/css/admin/login.css" rel="stylesheet">
</head>

<body class="bg-gradient-primary">

<!-- 2단계 인증 강제 등록 화면 — 필수 역할(ADMIN)의 미등록 중간 상태만 들어온다(PLAN-totp-required-admin.md 결정 2) -->
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-xl-6 col-lg-7 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-4">
                <div class="card-body p-5">
                    <div class="text-center">
                        <h1 class="h4 text-gray-900 mb-2">2단계 인증 등록</h1>
                        <p class="small text-muted mb-4">관리자 계정은 2단계 인증이 필수입니다.<br>
                            인증 앱(Google Authenticator 등)으로 QR 코드를 스캔한 뒤, 앱에 표시된 6자리 코드와 현재 비밀번호를 입력하세요.</p>
                    </div>
                    <div th:if="${param.expired}" class="alert alert-warning text-center mb-3" role="alert" id="enrollmentExpired">
                        <i class="fas fa-clock mr-2"></i>
                        등록 요청이 만료됐습니다. 새 QR 코드를 다시 스캔하세요.
                    </div>
                    <div th:if="${error}" class="alert alert-danger text-center mb-3" role="alert" id="enrollmentError"
                         th:text="${error}">오류</div>
                    <div class="text-center mb-3">
                        <img id="enrollmentQr" th:src="'data:image/png;base64,' + ${qrPngBase64}" alt="2단계 인증 등록 QR 코드"
                             width="200" height="200">
                    </div>
                    <p class="small text-center mb-4">QR을 스캔할 수 없으면 설정 키를 직접 입력하세요:<br>
                        <code id="enrollmentSecret" class="user-select-all" th:text="${secret}">KEY</code></p>
                    <form th:action="@{/admin/login/totp-enrollment}" method="post" class="user" id="enrollmentForm">
                        <input type="hidden" name="enrollmentId" th:value="${enrollmentId}">
                        <div class="form-group">
                            <label for="enrollmentCode" class="sr-only">인증 코드</label>
                            <input type="text" name="code" id="enrollmentCode" class="form-control form-control-user text-center"
                                   inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus
                                   placeholder="인증 앱의 6자리 코드">
                        </div>
                        <div class="form-group">
                            <label for="enrollmentPassword" class="sr-only">현재 비밀번호</label>
                            <input type="password" name="currentPassword" id="enrollmentPassword"
                                   class="form-control form-control-user" autocomplete="current-password" required
                                   placeholder="현재 비밀번호">
                        </div>
                        <button type="submit" class="btn btn-primary btn-user btn-block">등록</button>
                    </form>
                    <hr>
                    <!-- 다른 계정으로 로그인: 중간 상태 세션을 로그아웃으로 끝낸다(CSRF 포함 POST) -->
                    <form th:action="@{/admin/logout}" method="post" class="text-center">
                        <button type="submit" class="btn btn-link small p-0">다른 계정으로 로그인</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>

</html>
