<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{admin/fragments/head :: adminHead}">
    <title>정적 페이지 관리</title>
</head>
<body id="page-top">
<!--/*
    정적 페이지 관리 화면의 셸(PLAN-content-menu-unify.md U3). 예전 탭 통합 화면에서 정적 페이지 패널만 남았다.
    - 게이트는 정적 페이지 기능(SITE_PAGE)의 URL 그대로다: ADMIN은 항상, MANAGER는 SITE_PAGE 조회 권한이 있을 때 들어온다.
    - 메뉴 구조·사이트 설정은 각자 화면(/admin/menu/manage, /admin/site/manage)이다. 이 응답에는 그 마크업·API 문자열이 없다.
      예외로 ADMIN 응답에만 옛 북마크(#menu·#site)를 새 화면으로 옮기는 작은 스크립트가 있다(MANAGER 응답에는 렌더링하지 않는다).
    - 배치 순서: 페이지 전용 CSS → 패널 body 조각 → 공통 의존성 → 패널 script 조각. 조각의 스크립트는 반드시 의존성(jQuery·Quill 등) 뒤에 둔다.
*/-->
<link rel="stylesheet" th:href="@{/css/admin/admin-manage.css}">
<link rel="stylesheet" th:href="@{/vendor/quill/quill.snow.css}">

<div id="wrapper">
    <div th:replace="~{admin/fragments/sidebar :: adminSidebar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{admin/fragments/topbar :: adminTopbar}"></div>

            <div class="container-fluid">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">정적 페이지 관리</h1>
                </div>

                <div id="pagesTabPanel">
                    <div th:replace="~{admin/page/fragments/page-tab :: pagePanel}"></div>
                </div>
            </div>
        </div>

        <div th:replace="~{admin/fragments/footer :: adminFooter}"></div>
    </div>
</div>

<div th:replace="~{admin/page/fragments/page-tab :: pageModal}"></div>

<div th:replace="~{admin/fragments/logout-modal :: logoutModal}"></div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
<script src="/vendor/quill/quill.js"></script>
<script src="/js/admin/notice-editor.js"></script>
<script src="/js/admin/content-scope.js"></script>

<script th:inline="javascript">
    // 서버가 렌더링한 내 위임 권한 키("SITE_PAGE:CREATE" 등). 버튼 표시용일 뿐 서버 판정(403)이 최종이다.
    const MY_PERMISSIONS = new Set(/*[[${myPermissions}]]*/ []);
</script>

<th:block th:replace="~{admin/page/fragments/page-tab :: pageScript}"></th:block>

<!--/* 탭 시절(/admin/site-page/manage#menu · #site) 북마크 호환 — ADMIN 응답에만 렌더링한다. */-->
<script sec:authorize="hasRole('ADMIN')">
    (function () {
        const target = { '#menu': '/admin/menu/manage', '#site': '/admin/site/manage' }[window.location.hash];
        if (target) {
            window.location.replace(target);
        }
    })();
</script>
</body>
</html>
