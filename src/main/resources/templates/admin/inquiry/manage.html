<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: adminHead}">
    <title>문의함</title>
</head>
<body id="page-top">
<!-- 페이지 전용 CSS는 body 시작 지점에 둔다(menu/manage.html 컨벤션 — th:replace가 head를 통째로 치환한다). -->
<style>
    .inquiry-card {
        background: white;
        border-radius: 0.35rem;
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        border: 1px solid #4e73df;
    }
    .inquiry-row { cursor: pointer; }
    /* 방문자가 쓴 본문은 줄바꿈만 보존하고 링크로 바꾸지 않는다(textContent로만 삽입). */
    .inquiry-body { white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow-y: auto; }
</style>

<div id="wrapper">
    <div th:replace="~{admin/fragments/sidebar :: adminSidebar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{admin/fragments/topbar :: adminTopbar}"></div>

            <div class="container-fluid">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">문의함</h1>
                </div>

                <div id="pageAlert" class="alert alert-danger d-none" role="alert"></div>
                <div id="pageSuccess" class="alert alert-success d-none" role="alert"></div>

                <p class="text-muted small">
                    공개 문의 폼으로 접수된 문의입니다. 답변은 문의자의 이메일로 직접 보내 주세요(시스템은 메일을 보내지 않고 처리 상태만 기록합니다).
                    개인정보가 담겨 있으므로 처리가 끝난 문의는 삭제해 주세요. 답변 완료가 아닌 문의가 <span id="limitText">1,000</span>건에 이르면 새 문의를 받지 않습니다.
                </p>

                <div class="inquiry-card mb-4">
                    <div class="card-header py-3 d-flex flex-wrap justify-content-between align-items-center">
                        <h6 class="m-0 font-weight-bold text-primary">문의 <span class="text-muted small" id="unresolvedText"></span></h6>
                        <ul class="nav nav-pills" id="statusTabs" role="tablist">
                            <li class="nav-item"><a class="nav-link active" href="#" data-status="">전체</a></li>
                            <li class="nav-item"><a class="nav-link" href="#" data-status="RECEIVED">접수</a></li>
                            <li class="nav-item"><a class="nav-link" href="#" data-status="IN_PROGRESS">처리 중</a></li>
                            <li class="nav-item"><a class="nav-link" href="#" data-status="ANSWERED">답변 완료</a></li>
                        </ul>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                <tr>
                                    <th style="width: 70px">번호</th>
                                    <th>제목</th>
                                    <th style="width: 160px">이름</th>
                                    <th style="width: 110px">상태</th>
                                    <th style="width: 160px">접수 시각</th>
                                </tr>
                                </thead>
                                <tbody id="inquiryRows">
                                <tr><td colspan="5" class="text-muted">불러오는 중...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="btnPrev">이전</button>
                            <span class="text-muted small" id="pageInfo"></span>
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="btnNext">다음</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{admin/fragments/footer :: adminFooter}"></div>
    </div>
</div>

<!-- 상세 모달 -->
<div class="modal fade" id="detailModal" tabindex="-1" role="dialog" aria-labelledby="detailTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="detailTitle">문의 상세</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="닫기"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <div id="detailAlert" class="alert alert-danger d-none" role="alert"></div>
                <dl class="row mb-3">
                    <dt class="col-sm-3">제목</dt><dd class="col-sm-9" id="detailSubject"></dd>
                    <dt class="col-sm-3">이름</dt><dd class="col-sm-9" id="detailName"></dd>
                    <dt class="col-sm-3">이메일</dt><dd class="col-sm-9" id="detailEmail"></dd>
                    <dt class="col-sm-3">접수 시각</dt><dd class="col-sm-9" id="detailCreated"></dd>
                    <dt class="col-sm-3">동의 시각</dt><dd class="col-sm-9" id="detailConsent"></dd>
                </dl>
                <h6 class="font-weight-bold">내용</h6>
                <div class="inquiry-body border rounded p-3 bg-light" id="detailBody"></div>
                <div class="form-inline mt-3 d-none" id="statusForm" data-permission="INQUIRY:UPDATE">
                    <label for="statusSelect" class="mr-2 font-weight-bold">처리 상태</label>
                    <select id="statusSelect" class="form-control mr-2">
                        <option value="RECEIVED">접수</option>
                        <option value="IN_PROGRESS">처리 중</option>
                        <option value="ANSWERED">답변 완료</option>
                    </select>
                    <button type="button" class="btn btn-primary" id="btnSaveStatus">상태 저장</button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-danger d-none" id="btnDelete" data-permission="INQUIRY:DELETE">삭제</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments/logout-modal :: logoutModal}"></div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>

<script th:inline="javascript">
    // 서버가 렌더링한 내 위임 권한 키("INQUIRY:UPDATE" 등). 버튼 표시용일 뿐 서버 판정(403)이 최종이다.
    const MY_PERMISSIONS = new Set(/*[[${myPermissions}]]*/ []);
</script>
<script>
    // 이름·이메일·제목·본문은 방문자가 쓴 값이다 — 모든 삽입은 textContent로만 한다(HTML 삽입 API 금지).
    const INQUIRY_URL = "/admin/api/inquiries";
    const PAGE_SIZE = 20;
    const STATUS_LABELS = { RECEIVED: "접수", IN_PROGRESS: "처리 중", ANSWERED: "답변 완료" };
    const STATUS_BADGES = { RECEIVED: "badge-danger", IN_PROGRESS: "badge-warning", ANSWERED: "badge-success" };

    const canUpdate = MY_PERMISSIONS.has("INQUIRY:UPDATE");
    const canDelete = MY_PERMISSIONS.has("INQUIRY:DELETE");

    const pageAlert = document.getElementById("pageAlert");
    const pageSuccess = document.getElementById("pageSuccess");
    const rows = document.getElementById("inquiryRows");
    const pageInfo = document.getElementById("pageInfo");
    const unresolvedText = document.getElementById("unresolvedText");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const tabs = document.querySelectorAll("#statusTabs .nav-link");
    const detailAlert = document.getElementById("detailAlert");
    const statusForm = document.getElementById("statusForm");
    const statusSelect = document.getElementById("statusSelect");
    const btnSaveStatus = document.getElementById("btnSaveStatus");
    const btnDelete = document.getElementById("btnDelete");

    let currentStatus = "";
    let currentPage = 0;
    let listSeq = 0;
    let detailSeq = 0;
    let detailId = null;      // 상세 모달에 열린 문의
    let busy = false;

    function csrfHeaders(extra) {
        const token = document.querySelector('meta[name="_csrf"]');
        const header = document.querySelector('meta[name="_csrf_header"]');
        const headers = Object.assign({}, extra || {});
        if (token && header) {
            headers[header.content || "X-CSRF-TOKEN"] = token.content;
        }
        return headers;
    }

    async function errorMessage(response, fallback) {
        if (response.status === 403) {
            return "이 작업을 할 권한이 없습니다.";
        }
        if (response.status === 404) {
            return "문의를 찾을 수 없습니다. 이미 삭제되었을 수 있습니다.";
        }
        try {
            const body = await response.json();
            return body.message || fallback;
        } catch (e) {
            return fallback;
        }
    }

    function showError(message) {
        pageAlert.textContent = message;
        pageAlert.classList.remove("d-none");
        pageSuccess.classList.add("d-none");
    }

    function showSuccess(message) {
        pageSuccess.textContent = message;
        pageSuccess.classList.remove("d-none");
        pageAlert.classList.add("d-none");
    }

    function setDetailError(message) {
        detailAlert.textContent = message || "";
        detailAlert.classList.toggle("d-none", !message);
    }

    function formatTime(value) {
        return value ? value.replace("T", " ").slice(0, 16) : "-";
    }

    function statusBadge(status) {
        const badge = document.createElement("span");
        badge.className = "badge " + (STATUS_BADGES[status] || "badge-secondary");
        badge.textContent = STATUS_LABELS[status] || status;
        return badge;
    }

    function render(page) {
        rows.textContent = "";
        unresolvedText.textContent = "· 미처리 " + page.unresolvedCount + "건";
        if (page.content.length === 0) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 5;
            td.className = "text-muted";
            td.textContent = "조건에 맞는 문의가 없습니다.";
            tr.appendChild(td);
            rows.appendChild(tr);
        }
        page.content.forEach(function (item) {
            const tr = document.createElement("tr");
            tr.className = "inquiry-row";
            tr.tabIndex = 0;
            const cells = [String(item.id), item.title, item.name];
            cells.forEach(function (text) {
                const td = document.createElement("td");
                td.textContent = text;
                tr.appendChild(td);
            });
            const statusCell = document.createElement("td");
            statusCell.appendChild(statusBadge(item.status));
            tr.appendChild(statusCell);
            const timeCell = document.createElement("td");
            timeCell.textContent = formatTime(item.createDate);
            tr.appendChild(timeCell);
            const open = function () { openDetail(item.id); };
            tr.addEventListener("click", open);
            tr.addEventListener("keydown", function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    open();
                }
            });
            rows.appendChild(tr);
        });
        btnPrev.disabled = page.page <= 0;
        btnNext.disabled = page.last;
        pageInfo.textContent = page.totalElements === 0 ? "" : (page.page + 1) + " / " + Math.max(page.totalPages, 1)
            + " 페이지 · 총 " + page.totalElements + "건";
    }

    async function loadList(pageNumber) {
        const seq = ++listSeq;
        const params = new URLSearchParams({ page: String(pageNumber), size: String(PAGE_SIZE) });
        if (currentStatus !== "") {
            params.set("status", currentStatus);
        }
        try {
            const response = await fetch(INQUIRY_URL + "?" + params.toString(), { headers: { "Accept": "application/json" } });
            if (seq !== listSeq) {
                return;
            }
            if (!response.ok) {
                showError(await errorMessage(response, "문의 목록을 불러오지 못했습니다."));
                return;
            }
            const page = await response.json();
            if (seq !== listSeq) {
                return;
            }
            currentPage = page.page;
            render(page);
        } catch (e) {
            if (seq === listSeq) {
                showError("문의 목록을 불러오지 못했습니다. 네트워크 상태를 확인해 주세요.");
            }
        }
    }

    async function openDetail(id) {
        const seq = ++detailSeq;
        detailId = null;
        setDetailError("");
        statusForm.classList.add("d-none");
        btnDelete.classList.add("d-none");
        ["detailSubject", "detailName", "detailEmail", "detailCreated", "detailConsent", "detailBody"].forEach(function (elementId) {
            document.getElementById(elementId).textContent = "불러오는 중...";
        });
        window.jQuery("#detailModal").modal("show");
        try {
            const response = await fetch(INQUIRY_URL + "/" + encodeURIComponent(id), { headers: { "Accept": "application/json" } });
            if (seq !== detailSeq) {
                return;
            }
            if (!response.ok) {
                setDetailError(await errorMessage(response, "문의를 불러오지 못했습니다."));
                return;
            }
            const detail = await response.json();
            if (seq !== detailSeq || detail.id !== id) {
                return;
            }
            detailId = detail.id;
            document.getElementById("detailSubject").textContent = detail.title;
            document.getElementById("detailName").textContent = detail.name;
            document.getElementById("detailEmail").textContent = detail.email;     // 링크로 만들지 않는다 — 텍스트만
            document.getElementById("detailCreated").textContent = formatTime(detail.createDate);
            document.getElementById("detailConsent").textContent = formatTime(detail.consentAt);
            document.getElementById("detailBody").textContent = detail.body;
            statusSelect.value = detail.status;
            statusForm.classList.toggle("d-none", !canUpdate);
            btnDelete.classList.toggle("d-none", !canDelete);
        } catch (e) {
            if (seq === detailSeq) {
                setDetailError("문의를 불러오지 못했습니다. 네트워크 상태를 확인해 주세요.");
            }
        }
    }

    tabs.forEach(function (tab) {
        tab.addEventListener("click", function (event) {
            event.preventDefault();
            tabs.forEach(function (other) { other.classList.remove("active"); });
            tab.classList.add("active");
            currentStatus = tab.dataset.status || "";
            loadList(0);
        });
    });
    btnPrev.addEventListener("click", function () { loadList(currentPage - 1); });
    btnNext.addEventListener("click", function () { loadList(currentPage + 1); });

    btnSaveStatus.addEventListener("click", async function () {
        if (busy || detailId === null) {
            return;
        }
        busy = true;
        btnSaveStatus.disabled = true;
        setDetailError("");
        try {
            const response = await fetch(INQUIRY_URL + "/" + encodeURIComponent(detailId), {
                method: "PATCH",
                headers: csrfHeaders({ "Content-Type": "application/json" }),
                body: JSON.stringify({ status: statusSelect.value })
            });
            if (response.ok) {
                window.jQuery("#detailModal").modal("hide");
                showSuccess("처리 상태를 저장했습니다.");
                await loadList(currentPage);
            } else {
                setDetailError(await errorMessage(response, "상태를 저장하지 못했습니다."));
            }
        } catch (e) {
            setDetailError("상태를 저장하지 못했습니다. 네트워크 상태를 확인해 주세요.");
        } finally {
            busy = false;
            btnSaveStatus.disabled = false;
        }
    });

    btnDelete.addEventListener("click", async function () {
        if (busy || detailId === null) {
            return;
        }
        if (!window.confirm("이 문의를 삭제할까요? 복구할 수 없습니다.")) {
            return;
        }
        busy = true;
        btnDelete.disabled = true;
        setDetailError("");
        try {
            const response = await fetch(INQUIRY_URL + "/" + encodeURIComponent(detailId), {
                method: "DELETE",
                headers: csrfHeaders()
            });
            if (response.ok) {
                window.jQuery("#detailModal").modal("hide");
                showSuccess("문의를 삭제했습니다.");
                await loadList(currentPage);
            } else {
                setDetailError(await errorMessage(response, "문의를 삭제하지 못했습니다."));
            }
        } catch (e) {
            setDetailError("문의를 삭제하지 못했습니다. 네트워크 상태를 확인해 주세요.");
        } finally {
            busy = false;
            btnDelete.disabled = false;
        }
    });

    loadList(0);
</script>
</body>
</html>
