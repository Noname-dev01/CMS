<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: adminHead}">
    <title>관리자 조회</title>
</head>
<body id="page-top">
<link rel="stylesheet" th:href="@{/css/admin/admin-manage.css}">

<div id="wrapper">
    <div th:replace="~{admin/fragments/sidebar :: adminSidebar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{admin/fragments/topbar :: adminTopbar}"></div>

            <div class="container-fluid">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">관리자 조회</h1>
                    <div class="page-actions">
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/member/info}">
                            <i class="fas fa-user-circle fa-sm mr-1"></i>내 정보
                        </a>
                        <a class="btn btn-primary btn-sm shadow-sm" th:href="@{/admin/member/new}">
                            <i class="fas fa-user-plus fa-sm mr-1"></i>관리자 추가
                        </a>
                    </div>
                </div>

                <div class="admin-manage-shell">
                    <div id="pageAlert" class="alert alert-danger d-none" role="alert"></div>

                    <div class="card shadow mb-0 admin-panel">
                        <div class="card-header">
                            <div>
                                <h6>검색 조건</h6>
                                <p>아이디, 이름, 상태로 관리자 계정을 조회합니다.</p>
                            </div>
                        </div>
                        <div class="card-body">
                            <form id="searchForm">
                                <div class="filter-grid">
                                    <div class="form-group mb-0">
                                        <label class="form-label" for="searchUserId">아이디</label>
                                        <input type="text" class="form-control" id="searchUserId" name="userId" maxlength="50">
                                    </div>
                                    <div class="form-group mb-0">
                                        <label class="form-label" for="searchUserName">이름</label>
                                        <input type="text" class="form-control" id="searchUserName" name="userName" maxlength="100">
                                    </div>
                                    <div class="form-group mb-0">
                                        <label class="form-label" for="searchUserType">권한</label>
                                        <select class="form-control" id="searchUserType" name="userType">
                                            <option value="">전체</option>
                                            <option value="ROLE_ADMIN">관리자</option>
                                            <option value="ROLE_MANAGER">매니저</option>
                                        </select>
                                    </div>
                                    <div class="form-group mb-0">
                                        <label class="form-label" for="searchStatus">상태</label>
                                        <select class="form-control" id="searchStatus" name="status">
                                            <option value="">전체</option>
                                            <option value="ACTIVE">활성</option>
                                            <option value="LOCKED">잠김</option>
                                            <option value="DISABLED">비활성</option>
                                            <option value="PASSWORD_EXPIRED">비밀번호 만료</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="filter-actions mt-4">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-search fa-sm mr-1"></i>조회
                                    </button>
                                    <button type="button" class="btn btn-light border" id="btnReset">
                                        초기화
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card shadow mb-0 admin-panel">
                        <div class="card-header">
                            <div>
                                <h6>관리자 목록</h6>
                                <p>선택한 계정의 상세 정보를 모달에서 확인할 수 있습니다.</p>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="summary-bar">
                                <div class="summary-text" id="summaryText">총 <strong>0</strong>건</div>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>아이디</th>
                                        <th>이름</th>
                                        <th>이메일</th>
                                        <th>권한</th>
                                        <th>상태</th>
                                        <th>생성일</th>
                                        <th class="text-center">상세</th>
                                    </tr>
                                    </thead>
                                    <tbody id="adminTableBody">
                                    <tr>
                                        <td colspan="8" class="text-center text-muted py-4">조회 중입니다.</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div id="emptyState" class="empty-state d-none mt-3">
                                조회 결과가 없습니다.
                            </div>

                            <div class="pagination-bar">
                                <nav aria-label="관리자 페이지 목록">
                                    <ul class="pagination mb-0" id="pagination"></ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{admin/fragments/footer :: adminFooter}"></div>
    </div>
</div>

<div class="modal fade admin-detail-modal" id="adminDetailModal" tabindex="-1" role="dialog" aria-labelledby="adminDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <div class="detail-hero">
                    <div class="detail-hero-copy">
                        <h5 class="modal-title" id="adminDetailModalLabel">관리자 상세 정보</h5>
                        <p>선택한 관리자 계정의 기본 정보와 상태를 확인합니다.</p>
                    </div>
                </div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div id="detailAlert" class="alert alert-danger d-none" role="alert"></div>
                <div id="detailSuccess" class="alert alert-success d-none" role="alert"></div>
                <div id="detailLoading" class="detail-loading">상세 정보를 불러오는 중입니다.</div>
                <div id="detailSummary" class="detail-summary d-none"></div>
                <div id="detailContent" class="detail-grid d-none"></div>
                <form id="detailEditForm" class="d-none">
                    <div class="form-group">
                        <label class="form-label" for="editUserName">이름</label>
                        <input type="text" class="form-control" id="editUserName" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editEmail">이메일</label>
                        <input type="email" class="form-control" id="editEmail" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editUserType">권한</label>
                        <select class="form-control" id="editUserType">
                            <option value="ROLE_ADMIN">관리자</option>
                            <option value="ROLE_MANAGER">매니저</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editStatus">상태</label>
                        <select class="form-control" id="editStatus">
                            <option value="ACTIVE">활성</option>
                            <option value="LOCKED">잠김</option>
                            <option value="DISABLED">비활성</option>
                        </select>
                    </div>
                    <div class="alert alert-warning mb-0" role="alert">
                        <i class="fas fa-info-circle mr-1"></i>
                        권한·상태를 변경하면 대상자의 기존 로그인 세션은 만료 처리됩니다.
                        (드물게 세션 타임아웃 시점까지 지연될 수 있습니다)
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <span id="editHint" class="text-muted small mr-auto d-none"></span>
                <button type="button" class="btn btn-primary d-none" id="btnEditMode">
                    <i class="fas fa-pen fa-sm mr-1"></i>수정
                </button>
                <button type="button" class="btn btn-primary d-none" id="btnSaveEdit">저장</button>
                <button type="button" class="btn btn-light border d-none" id="btnCancelEdit">취소</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>

<script>
    const searchForm = document.getElementById("searchForm");
    const resetButton = document.getElementById("btnReset");
    const tableBody = document.getElementById("adminTableBody");
    const pageAlert = document.getElementById("pageAlert");
    const summaryText = document.getElementById("summaryText");
    const pagination = document.getElementById("pagination");
    const emptyState = document.getElementById("emptyState");

    const detailAlert = document.getElementById("detailAlert");
    const detailSuccess = document.getElementById("detailSuccess");
    const detailLoading = document.getElementById("detailLoading");
    const detailSummary = document.getElementById("detailSummary");
    const detailContent = document.getElementById("detailContent");
    const detailEditForm = document.getElementById("detailEditForm");
    const editHint = document.getElementById("editHint");
    const btnEditMode = document.getElementById("btnEditMode");
    const btnSaveEdit = document.getElementById("btnSaveEdit");
    const btnCancelEdit = document.getElementById("btnCancelEdit");
    const editUserName = document.getElementById("editUserName");
    const editEmail = document.getElementById("editEmail");
    const editUserType = document.getElementById("editUserType");
    const editStatus = document.getElementById("editStatus");

    const pageState = {
        page: 0,
        size: 20,
        totalPages: 0
    };

    // 본인 계정 판별용 — 페이지 로드 시 1회 조회 (쟁점 4: 본인은 내 정보 수정으로 유도)
    let currentAdminId = null;
    // 모달에 표시 중인 상세 데이터 (수정 모드 초기값·변경분 diff 계산에 사용)
    let currentDetail = null;

    function getCsrfHeaders() {
        const token = document.querySelector('meta[name="_csrf"]');
        const header = document.querySelector('meta[name="_csrf_header"]');
        const headers = { "Content-Type": "application/json" };
        if (token && header) {
            headers[header.content || "X-CSRF-TOKEN"] = token.content;
        }
        return headers;
    }

    function showPageError(message) {
        pageAlert.textContent = message;
        pageAlert.classList.remove("d-none");
    }

    function hidePageError() {
        pageAlert.classList.add("d-none");
        pageAlert.textContent = "";
    }

    function showDetailError(message) {
        detailAlert.textContent = message;
        detailAlert.classList.remove("d-none");
    }

    function hideDetailError() {
        detailAlert.classList.add("d-none");
        detailAlert.textContent = "";
    }

    function showDetailSuccess(message) {
        detailSuccess.textContent = message;
        detailSuccess.classList.remove("d-none");
    }

    function hideDetailSuccess() {
        detailSuccess.classList.add("d-none");
        detailSuccess.textContent = "";
    }

    async function extractErrorMessage(response, fallbackMessage) {
        try {
            const errorBody = await response.json();
            return errorBody.message || fallbackMessage;
        } catch (error) {
            return fallbackMessage;
        }
    }

    function getRequestErrorMessage(error, fallbackMessage) {
        if (error && error.name === "AbortError") {
            return "요청이 취소되었습니다.";
        }

        if (error instanceof TypeError) {
            return "네트워크 연결을 확인해주세요.";
        }

        return error && error.message ? error.message : fallbackMessage;
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function formatDate(value) {
        if (!value) {
            return "-";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
            return value;
        }

        return new Intl.DateTimeFormat("ko-KR", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }).format(date);
    }

    function getRoleLabel(value) {
        if (value === "ROLE_ADMIN") return "관리자";
        if (value === "ROLE_MANAGER") return "매니저";
        return value || "-";
    }

    function getStatusLabel(value) {
        if (value === "ACTIVE") return "활성";
        if (value === "LOCKED") return "잠김";
        if (value === "DISABLED") return "비활성";
        if (value === "PASSWORD_EXPIRED") return "비밀번호 만료";
        if (value === "DELETED") return "삭제";
        return value || "-";
    }

    function getRoleBadgeClass(value) {
        if (value === "ROLE_ADMIN") return "badge-role badge-role-admin";
        if (value === "ROLE_MANAGER") return "badge-role badge-role-manager";
        return "badge badge-light";
    }

    function getStatusBadgeClass(value) {
        if (value === "ACTIVE") return "badge-status badge-status-active";
        if (value === "LOCKED") return "badge-status badge-status-locked";
        if (value === "DISABLED") return "badge-status badge-status-disabled";
        if (value === "PASSWORD_EXPIRED") return "badge-status badge-status-password-expired";
        if (value === "DELETED") return "badge-status badge-status-deleted";
        return "badge badge-light";
    }

    function buildQueryString(page) {
        const params = new URLSearchParams();
        const formData = new FormData(searchForm);

        formData.forEach((value, key) => {
            const trimmed = typeof value === "string" ? value.trim() : value;
            if (trimmed) {
                params.append(key, trimmed);
            }
        });

        params.set("page", String(page));
        params.set("size", String(pageState.size));
        return params.toString();
    }

    function renderSummary(data) {
        const currentPage = data.totalPages === 0 ? 0 : data.page + 1;
        summaryText.innerHTML = "총 <strong>" + data.totalElements + "</strong>건 · " +
            currentPage + " / " + Math.max(data.totalPages, 1) + " 페이지";
    }

    function renderTable(items) {
        if (!items || items.length === 0) {
            tableBody.innerHTML = "";
            emptyState.classList.remove("d-none");
            return;
        }

        emptyState.classList.add("d-none");

        tableBody.innerHTML = items.map(item => {
            return "<tr>" +
                "<td>" + escapeHtml(item.id) + "</td>" +
                "<td><button type=\"button\" class=\"btn btn-link p-0 cell-link js-detail\" data-id=\"" + escapeHtml(item.id) + "\">" + escapeHtml(item.userId) + "</button></td>" +
                "<td>" + escapeHtml(item.userName || "-") + "</td>" +
                "<td>" + escapeHtml(item.email || "-") + "</td>" +
                "<td><span class=\"" + getRoleBadgeClass(item.userType) + "\">" + escapeHtml(getRoleLabel(item.userType)) + "</span></td>" +
                "<td><span class=\"" + getStatusBadgeClass(item.status) + "\">" + escapeHtml(getStatusLabel(item.status)) + "</span></td>" +
                "<td>" + escapeHtml(formatDate(item.createDate)) + "</td>" +
                "<td class=\"text-center\"><button type=\"button\" class=\"btn btn-outline-primary btn-sm js-detail\" data-id=\"" + escapeHtml(item.id) + "\">상세</button></td>" +
                "</tr>";
        }).join("");
    }

    function renderPagination(data) {
        pagination.innerHTML = "";

        if (!data.totalPages || data.totalPages <= 1) {
            return;
        }

        const fragment = [];
        const startPage = Math.max(0, data.page - 2);
        const endPage = Math.min(data.totalPages - 1, startPage + 4);

        fragment.push(
            "<li class=\"page-item " + (data.page === 0 ? "disabled" : "") + "\">" +
            "<button type=\"button\" class=\"page-link\" data-page=\"" + Math.max(data.page - 1, 0) + "\">이전</button></li>"
        );

        for (let i = startPage; i <= endPage; i += 1) {
            fragment.push(
                "<li class=\"page-item " + (i === data.page ? "active" : "") + "\">" +
                "<button type=\"button\" class=\"page-link\" data-page=\"" + i + "\">" + (i + 1) + "</button></li>"
            );
        }

        fragment.push(
            "<li class=\"page-item " + (data.last ? "disabled" : "") + "\">" +
            "<button type=\"button\" class=\"page-link\" data-page=\"" + Math.min(data.page + 1, data.totalPages - 1) + "\">다음</button></li>"
        );

        pagination.innerHTML = fragment.join("");
    }

    function setLoadingRow() {
        emptyState.classList.add("d-none");
        tableBody.innerHTML = "<tr><td colspan=\"8\" class=\"text-center text-muted py-4\">조회 중입니다.</td></tr>";
    }

    async function loadAdminMembers(page) {
        hidePageError();
        setLoadingRow();

        try {
            const response = await fetch("/admin/api/members?" + buildQueryString(page));
            if (!response.ok) {
                throw new Error(await extractErrorMessage(response, "관리자 목록 조회에 실패했습니다."));
            }

            const data = await response.json();
            pageState.page = data.page;
            pageState.totalPages = data.totalPages;

            renderSummary(data);
            renderTable(data.content || []);
            renderPagination(data);
        } catch (error) {
            tableBody.innerHTML = "<tr><td colspan=\"8\" class=\"text-center text-danger py-4\">조회에 실패했습니다.</td></tr>";
            pagination.innerHTML = "";
            showPageError(getRequestErrorMessage(error, "관리자 목록 조회 중 오류가 발생했습니다."));
        }
    }

    function resetDetailModal() {
        hideDetailError();
        hideDetailSuccess();
        exitEditMode();
        currentDetail = null;
        btnEditMode.classList.add("d-none");
        editHint.classList.add("d-none");
        editHint.innerHTML = "";
        detailLoading.classList.remove("d-none");
        detailSummary.classList.add("d-none");
        detailSummary.innerHTML = "";
        detailContent.classList.add("d-none");
        detailContent.innerHTML = "";
    }

    /** 상세 데이터 기준으로 수정 진입 가능 여부와 푸터 버튼 상태를 결정한다 */
    function configureEditAccess(data) {
        btnEditMode.classList.add("d-none");
        editHint.classList.add("d-none");
        editHint.innerHTML = "";

        if (currentAdminId !== null && data.id === currentAdminId) {
            editHint.innerHTML = "본인 계정은 <a href=\"/admin/member/info\">내 정보</a>에서 수정해주세요.";
            editHint.classList.remove("d-none");
            return;
        }
        if (data.status === "DELETED") {
            editHint.textContent = "삭제된 계정은 수정할 수 없습니다.";
            editHint.classList.remove("d-none");
            return;
        }
        btnEditMode.classList.remove("d-none");
    }

    function enterEditMode() {
        if (!currentDetail) {
            return;
        }
        hideDetailError();
        hideDetailSuccess();
        editUserName.value = currentDetail.userName || "";
        editEmail.value = currentDetail.email || "";
        editUserType.value = currentDetail.userType;
        // 현재 상태가 선택지에 없으면(PASSWORD_EXPIRED 등) 표시용 옵션을 임시 추가해
        // 의도치 않은 상태 변경 전송을 방지한다 (변경분만 전송하므로 그대로 두면 미전송)
        ensureStatusOption(currentDetail.status);
        editStatus.value = currentDetail.status;

        detailContent.classList.add("d-none");
        detailEditForm.classList.remove("d-none");
        btnEditMode.classList.add("d-none");
        btnSaveEdit.classList.remove("d-none");
        btnCancelEdit.classList.remove("d-none");
    }

    function ensureStatusOption(status) {
        // 임시 옵션 정리 후 필요 시 재추가
        detailEditForm.querySelectorAll("#editStatus option[data-transient]").forEach(opt => opt.remove());
        if (status && !Array.from(editStatus.options).some(opt => opt.value === status)) {
            const option = document.createElement("option");
            option.value = status;
            option.textContent = getStatusLabel(status);
            option.dataset.transient = "true";
            editStatus.appendChild(option);
        }
    }

    function exitEditMode() {
        detailEditForm.classList.add("d-none");
        btnSaveEdit.classList.add("d-none");
        btnCancelEdit.classList.add("d-none");
        if (currentDetail) {
            detailContent.classList.remove("d-none");
            configureEditAccess(currentDetail);
        }
    }

    /** 기존 값과 달라진 필드만 담은 PATCH 페이로드를 만든다 (null 필드는 기존값 유지 시맨틱) */
    function buildEditPayload() {
        const payload = {};
        const userName = editUserName.value.trim();
        const email = editEmail.value.trim();

        if (userName && userName !== (currentDetail.userName || "")) {
            payload.userName = userName;
        }
        if (email && email !== (currentDetail.email || "")) {
            payload.email = email;
        }
        if (editUserType.value !== currentDetail.userType) {
            payload.userType = editUserType.value;
        }
        if (editStatus.value !== currentDetail.status) {
            payload.status = editStatus.value;
        }
        return payload;
    }

    async function saveEdit() {
        if (!currentDetail) {
            return;
        }

        const payload = buildEditPayload();
        if (Object.keys(payload).length === 0) {
            showDetailError("변경된 내용이 없습니다.");
            return;
        }

        hideDetailError();
        hideDetailSuccess();
        btnSaveEdit.disabled = true;

        try {
            const response = await fetch("/admin/api/members/" + encodeURIComponent(currentDetail.id), {
                method: "PATCH",
                headers: getCsrfHeaders(),
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                throw new Error(await extractErrorMessage(response, "관리자 수정에 실패했습니다."));
            }

            const data = await response.json();
            currentDetail = data;
            renderDetail(data);
            exitEditMode();
            showDetailSuccess("저장되었습니다."
                + ((payload.status || payload.userType) ? " 대상자의 기존 로그인 세션은 만료 처리됩니다." : ""));
            loadAdminMembers(pageState.page);
        } catch (error) {
            showDetailError(getRequestErrorMessage(error, "관리자 수정 중 오류가 발생했습니다."));
        } finally {
            btnSaveEdit.disabled = false;
        }
    }

    async function loadCurrentAdminId() {
        try {
            const response = await fetch("/admin/api/members/me");
            if (response.ok) {
                const me = await response.json();
                currentAdminId = me.id;
            }
        } catch (error) {
            // 판별 실패 시 수정 버튼은 노출되지만 서버가 본인 수정을 400으로 차단한다
        }
    }

    function renderDetail(data) {
        const displayName = data.userName || data.userId || "-";
        const emailValue = data.email ? escapeHtml(data.email) : "-";
        const profileImageMarkup = data.profileImageUrl
            ? "<img src=\"" + escapeHtml(data.profileImageUrl) + "\" alt=\"프로필 이미지\" onerror=\"this.remove(); this.parentElement.querySelector('.detail-profile-fallback').classList.remove('d-none');\">"
            : "";
        const profileFallbackClass = data.profileImageUrl ? "detail-profile-fallback d-none" : "detail-profile-fallback";

        detailSummary.innerHTML =
            "<div class=\"detail-summary-main\">" +
            "<div class=\"detail-profile-thumb\">" +
            profileImageMarkup +
            "<span class=\"" + profileFallbackClass + "\"><i class=\"fas fa-user\"></i></span>" +
            "</div>" +
            "<div class=\"detail-identity\">" +
            "<div class=\"headline\">" + escapeHtml(displayName) + "</div>" +
            "</div>" +
            "</div>" +
            "<div class=\"detail-meta\">" +
            "<span class=\"" + getRoleBadgeClass(data.userType) + "\">" + escapeHtml(getRoleLabel(data.userType)) + "</span>" +
            "<span class=\"" + getStatusBadgeClass(data.status) + "\">" + escapeHtml(getStatusLabel(data.status)) + "</span>" +
            "</div>";

        const detailItems = [
            { label: "아이디", value: data.userId },
            { label: "이름", value: data.userName || "-" },
            {
                label: "이메일",
                value: data.email
                    ? "<button type=\"button\" class=\"copy-email-btn\" data-email=\"" + emailValue + "\">" +
                      "<span class=\"copy-email-icon\"><i class=\"far fa-copy\"></i></span>" +
                      "<span class=\"copy-email-text\"><span>" + emailValue + "</span><small>클릭해서 복사</small></span>" +
                      "</button>"
                    : "<span class=\"value-muted\">-</span>"
            },
            { label: "권한", value: escapeHtml(getRoleLabel(data.userType)) },
            { label: "상태", value: escapeHtml(getStatusLabel(data.status)) },
            { label: "생성일", value: formatDate(data.createDate) }
        ];

        detailContent.innerHTML = detailItems.map(item => {
            return "<div class=\"detail-item\">" +
                "<span class=\"label\">" + escapeHtml(item.label) + "</span>" +
                "<div class=\"value\">" + item.value + "</div>" +
                "</div>";
        }).join("");

        detailLoading.classList.add("d-none");
        detailSummary.classList.remove("d-none");
        detailContent.classList.remove("d-none");
    }

    async function loadAdminDetail(id) {
        resetDetailModal();

        try {
            const response = await fetch("/admin/api/members/" + encodeURIComponent(id));
            if (!response.ok) {
                throw new Error(await extractErrorMessage(response, "관리자 상세 조회에 실패했습니다."));
            }

            const data = await response.json();
            currentDetail = data;
            renderDetail(data);
            configureEditAccess(data);
        } catch (error) {
            detailLoading.classList.add("d-none");
            showDetailError(getRequestErrorMessage(error, "관리자 상세 조회 중 오류가 발생했습니다."));
        }
    }

    searchForm.addEventListener("submit", function (event) {
        event.preventDefault();
        loadAdminMembers(0);
    });

    resetButton.addEventListener("click", function () {
        searchForm.reset();
        loadAdminMembers(0);
    });

    pagination.addEventListener("click", function (event) {
        const button = event.target.closest("button[data-page]");
        if (!button || button.parentElement.classList.contains("disabled") || button.parentElement.classList.contains("active")) {
            return;
        }

        loadAdminMembers(Number(button.dataset.page));
    });

    tableBody.addEventListener("click", function (event) {
        const button = event.target.closest(".js-detail");
        if (!button) {
            return;
        }

        $("#adminDetailModal").modal("show");
        loadAdminDetail(button.dataset.id);
    });

    detailContent.addEventListener("click", async function (event) {
        const button = event.target.closest(".copy-email-btn");
        if (!button) {
            return;
        }

        const originalMarkup = button.innerHTML;
        const email = button.dataset.email;
        if (!email) {
            return;
        }

        try {
            await navigator.clipboard.writeText(email);
            button.classList.add("copied");
            button.innerHTML =
                "<span class=\"copy-email-icon\"><i class=\"fas fa-check\"></i></span>" +
                "<span class=\"copy-email-text\"><span>" + escapeHtml(email) + "</span><small>복사되었습니다</small></span>";

            window.setTimeout(function () {
                button.classList.remove("copied");
                button.innerHTML = originalMarkup;
            }, 1400);
        } catch (error) {
            showDetailError("이메일 복사에 실패했습니다.");
        }
    });

    btnEditMode.addEventListener("click", enterEditMode);
    btnCancelEdit.addEventListener("click", function () {
        hideDetailError();
        exitEditMode();
    });
    btnSaveEdit.addEventListener("click", saveEdit);

    detailEditForm.addEventListener("submit", function (event) {
        event.preventDefault();
        saveEdit();
    });

    loadCurrentAdminId();
    loadAdminMembers(0);
</script>

</body>
</html>
