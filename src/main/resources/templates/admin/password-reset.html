<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <!-- login.html은 head.html 프래그먼트를 쓰지 않으므로 CSRF meta를 직접 렌더링한다 -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>비밀번호 재설정 요청</title>

    <!-- Custom fonts for this template-->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
            href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
            rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="/css/admin/login.css" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-xl-10 col-lg-12 col-md-9">

            <div class="card o-hidden border-0 shadow-lg">
                <div class="card-body p-0">
                    <!-- Nested Row within Card Body -->
                    <div class="row">
                        <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
                        <div class="col-lg-6">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-2">비밀번호 재설정</h1>
                                    <p class="mb-4 small text-gray-600">
                                        가입하신 이메일 주소를 입력하시면<br>비밀번호 재설정 링크를 보내드립니다.
                                    </p>
                                </div>
                                <div id="resultAlert" class="alert text-center mb-3 d-none" role="alert"></div>
                                <form id="resetRequestForm" class="user">
                                    <div class="form-group">
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text">
                                                    <i class="fas fa-envelope fa-fw"></i>
                                                </span>
                                            </div>
                                            <input type="email" id="emailInput" class="form-control form-control-user"
                                                   placeholder="이메일을 입력하세요" required>
                                        </div>
                                    </div>
                                    <button type="submit" id="submitButton" class="btn btn-primary btn-user btn-block">
                                        재설정 링크 받기
                                    </button>
                                </form>
                                <hr>
                                <div class="text-center">
                                    <a class="small text-primary" th:href="@{/admin/login}">로그인으로 돌아가기</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap core JavaScript-->
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- Core plugin JavaScript-->
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>

<!-- Custom scripts for all pages-->
<script src="/js/sb-admin-2.min.js"></script>

<script>
    (function () {
        var form = document.getElementById('resetRequestForm');
        var emailInput = document.getElementById('emailInput');
        var submitButton = document.getElementById('submitButton');
        var resultAlert = document.getElementById('resultAlert');

        function showAlert(type, message) {
            resultAlert.classList.remove('d-none', 'alert-success', 'alert-danger');
            resultAlert.classList.add('alert-' + type);
            resultAlert.textContent = message;
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            // @Email 검증은 공백 포함 값을 400으로 거부하므로 제출 전에 클라이언트가 정리한다
            var email = emailInput.value.trim();
            if (!email) {
                showAlert('danger', '이메일을 입력해 주세요.');
                return;
            }

            var csrfToken = document.querySelector('meta[name="_csrf"]').content;
            var csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

            submitButton.disabled = true;

            var headers = { 'Content-Type': 'application/json' };
            headers[csrfHeader || 'X-CSRF-TOKEN'] = csrfToken;

            fetch('/admin/api/password-reset-requests', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ email: email })
            }).then(function (response) {
                if (response.ok) {
                    // 계정 존재 여부와 무관한 고정 문구 — 발송 여부를 노출하지 않는다
                    showAlert('success', '입력하신 이메일로 안내를 보냈습니다. 메일함을 확인해 주세요.');
                    form.classList.add('d-none');
                } else {
                    showAlert('danger', '이메일 형식을 확인해 주세요.');
                    submitButton.disabled = false;
                }
            }).catch(function () {
                showAlert('danger', '요청을 처리할 수 없습니다. 잠시 후 다시 시도해 주세요.');
                submitButton.disabled = false;
            });
        });
    })();
</script>

</body>

</html>
