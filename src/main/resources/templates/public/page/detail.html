<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">페이지</title>
    <link rel="stylesheet" th:href="@{/css/public/page.css}">
</head>
<body>
<div class="public-page-container">
    <div class="page-detail">
        <!--/* 이전 개정을 보고 있을 때만 안내한다. 현재 개정 번호로 들어와도 current=true라 안내가 없다. */-->
        <p class="page-old-notice" th:unless="${page.current}">
            이전 버전입니다. <a th:href="@{|${sitePrefix}/pages/{slug}|(slug=${page.slug})}">현재 버전 보기</a>
        </p>
        <h1 class="page-title" th:text="${page.title}"></h1>
        <div class="page-meta">
            개정 <span th:text="${page.revisionNo}"></span> ·
            <span th:text="${#temporals.format(page.revisionDate, 'yyyy-MM-dd')}"></span>
        </div>
        <!--/* 본문은 PublicSitePageService가 이미지 불허 규칙으로 정리한 HTML이다. 이스케이프 없는 출력은 이 한 곳만 허용된다
             (PublicPageTemplateConventionTest가 고정). 파서 수준 주석이라 응답에 나가지 않는다. */-->
        <div class="page-content" th:utext="${page.contentHtml}"></div>
    </div>

    <p class="page-links">
        <a th:href="@{|${sitePrefix}/pages/{slug}/revisions|(slug=${page.slug})}">개정 이력</a>
        <a th:href="@{|${sitePrefix}|}">홈으로</a>
    </p>
</div>
</body>
</html>
