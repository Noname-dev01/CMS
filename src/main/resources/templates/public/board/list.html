<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${boardName}">게시판</title>
    <link rel="stylesheet" th:href="@{/css/public/board.css}">
    <link rel="stylesheet" th:href="@{/css/public/site-menu.css}">
</head>
<body>
<th:block th:replace="~{public/fragments/site-menu :: siteMenu}"></th:block>
<div class="public-board-container">
    <div class="public-board-header">
        <h1><a th:href="@{|${sitePrefix}/boards/{board}|(board=${boardSlug})}" th:text="${boardName}">게시판</a></h1>
    </div>
    <!--/* 설명은 평문이다 — th:text로만 출력하고 줄바꿈은 CSS(pre-line)가 보인다 */-->
    <p class="board-description" th:if="${description != null}" th:text="${description}"></p>

    <form class="board-search" method="get" th:action="@{|${sitePrefix}/boards/{board}|(board=${boardSlug})}" role="search">
        <input type="search" name="keyword" maxlength="100" placeholder="제목으로 검색"
               aria-label="게시글 제목 검색" th:value="${keyword}">
        <button type="submit">검색</button>
        <a class="board-search-reset" th:if="${keyword != null}" th:href="@{|${sitePrefix}/boards/{board}|(board=${boardSlug})}">전체 보기</a>
    </form>

    <!--/* 상단 고정 영역 — 검색하지 않은 1페이지에서만 채워진다. 고정 글은 아래 일반 목록에도 그대로 나온다 */-->
    <ul class="board-list board-pinned-list" th:if="${not #lists.isEmpty(pinnedPosts)}" aria-label="상단 고정 글">
        <li class="board-list-item" th:each="post : ${pinnedPosts}">
            <a th:href="@{|${sitePrefix}/boards/{board}/posts/{postId}|(board=${boardSlug}, postId=${post.id})}">
                <span class="board-title"><span class="board-pinned-badge">고정</span><span th:text="${post.title}"></span><span class="board-new-badge" th:if="${post.newBadge}">NEW</span></span>
                <span class="board-meta-extra" th:if="${authorLabel != null}" th:text="${authorLabel}"></span>
                <span class="board-meta-extra" th:if="${post.viewCount != null}" th:text="|조회 ${post.viewCount}|"></span>
                <span class="board-date" th:text="${#temporals.format(post.createDate, 'yyyy-MM-dd')}"></span>
            </a>
        </li>
    </ul>

    <!--/* 일반 글 목록은 게시판 유형(boardType)에 따라 모양만 다르다 — 목록형(LIST)이 기본이고 알 수 없는 유형도 서비스가 LIST로 넘긴다.
         썸네일은 대표 이미지가 있는 글만 /content-images/{id}?size=thumb로 보이고, 없는 글은 CSS 자리표시다(요청이 생기지 않는다). */-->
    <ul class="board-list" th:if="${boardType == 'LIST' and not #lists.isEmpty(posts)}">
        <li class="board-list-item" th:each="post : ${posts}">
            <a th:href="@{|${sitePrefix}/boards/{board}/posts/{postId}|(board=${boardSlug}, postId=${post.id})}">
                <span class="board-title"><span th:text="${post.title}"></span><span class="board-new-badge" th:if="${post.newBadge}">NEW</span></span>
                <span class="board-meta-extra" th:if="${authorLabel != null}" th:text="${authorLabel}"></span>
                <span class="board-meta-extra" th:if="${post.viewCount != null}" th:text="|조회 ${post.viewCount}|"></span>
                <span class="board-date" th:text="${#temporals.format(post.createDate, 'yyyy-MM-dd')}"></span>
            </a>
        </li>
    </ul>

    <ul class="board-gallery" th:if="${boardType == 'GALLERY' and not #lists.isEmpty(posts)}">
        <li class="board-gallery-item" th:each="post : ${posts}">
            <a th:href="@{|${sitePrefix}/boards/{board}/posts/{postId}|(board=${boardSlug}, postId=${post.id})}">
                <span class="board-thumb">
                    <img th:if="${post.coverImageId != null}" th:src="@{/content-images/{imageId}(imageId=${post.coverImageId}, size='thumb')}"
                         alt="" loading="lazy" decoding="async">
                    <span class="board-thumb-empty" th:unless="${post.coverImageId != null}" aria-hidden="true"></span>
                </span>
                <span class="board-gallery-title"><span th:text="${post.title}"></span><span class="board-new-badge" th:if="${post.newBadge}">NEW</span></span>
                <span class="board-gallery-meta">
                    <span th:if="${authorLabel != null}" th:text="${authorLabel}"></span>
                    <span th:if="${post.viewCount != null}" th:text="|조회 ${post.viewCount}|"></span>
                    <span th:text="${#temporals.format(post.createDate, 'yyyy-MM-dd')}"></span>
                </span>
            </a>
        </li>
    </ul>

    <ul class="board-webzine" th:if="${boardType == 'WEBZINE' and not #lists.isEmpty(posts)}">
        <li class="board-webzine-item" th:each="post : ${posts}">
            <a th:href="@{|${sitePrefix}/boards/{board}/posts/{postId}|(board=${boardSlug}, postId=${post.id})}">
                <span class="board-thumb">
                    <img th:if="${post.coverImageId != null}" th:src="@{/content-images/{imageId}(imageId=${post.coverImageId}, size='thumb')}"
                         alt="" loading="lazy" decoding="async">
                    <span class="board-thumb-empty" th:unless="${post.coverImageId != null}" aria-hidden="true"></span>
                </span>
                <span class="board-webzine-body">
                    <span class="board-webzine-title"><span th:text="${post.title}"></span><span class="board-new-badge" th:if="${post.newBadge}">NEW</span></span>
                    <span class="board-webzine-excerpt" th:if="${post.excerpt != null}" th:text="${post.excerpt}"></span>
                    <span class="board-gallery-meta">
                        <span th:if="${authorLabel != null}" th:text="${authorLabel}"></span>
                        <span th:if="${post.viewCount != null}" th:text="|조회 ${post.viewCount}|"></span>
                        <span th:text="${#temporals.format(post.createDate, 'yyyy-MM-dd')}"></span>
                    </span>
                </span>
            </a>
        </li>
    </ul>

    <div class="board-empty" th:if="${#lists.isEmpty(posts)}"
         th:text="${keyword != null} ? '검색 결과가 없습니다.' : '등록된 게시글이 없습니다.'">
        등록된 게시글이 없습니다.
    </div>

    <!-- 검색 중일 때만 keyword를 붙인다 — null 파라미터 렌더링에 기대지 않고 링크를 명시적으로 나눈다(공지 목록과 같은 방식) -->
    <div class="board-pagination" th:if="${totalPages > 1}">
        <th:block th:if="${hasPrevious}">
            <a th:if="${keyword == null}" th:href="@{|${sitePrefix}/boards/{board}|(board=${boardSlug}, page=${page - 1})}">이전</a>
            <a th:if="${keyword != null}" th:href="@{|${sitePrefix}/boards/{board}|(board=${boardSlug}, page=${page - 1}, keyword=${keyword})}">이전</a>
        </th:block>
        <span th:unless="${hasPrevious}" class="disabled">이전</span>
        <span th:text="${(page + 1) + ' / ' + totalPages}"></span>
        <th:block th:if="${hasNext}">
            <a th:if="${keyword == null}" th:href="@{|${sitePrefix}/boards/{board}|(board=${boardSlug}, page=${page + 1})}">다음</a>
            <a th:if="${keyword != null}" th:href="@{|${sitePrefix}/boards/{board}|(board=${boardSlug}, page=${page + 1}, keyword=${keyword})}">다음</a>
        </th:block>
        <span th:unless="${hasNext}" class="disabled">다음</span>
    </div>
</div>
</body>
</html>
