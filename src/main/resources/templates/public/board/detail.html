<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title}">게시글</title>
    <!--/* 공유 미리보기 이미지 — 대표 이미지가 있는 공개 글만. 값은 app.base-url 기반 절대 URL이고 th:content가 속성을 이스케이프한다. */-->
    <meta th:if="${ogImageUrl != null}" property="og:image" th:content="${ogImageUrl}">
    <link rel="stylesheet" th:href="@{/css/public/board.css}">
    <link rel="stylesheet" th:href="@{/css/public/site-menu.css}">
    <!--/* 본문 이미지 실패 시 안내 상자로 바꾸는 외부 스크립트. defer 없이 <head>에 두어 이미지 요청보다 먼저 리스너가 붙게 한다 */-->
    <script th:src="@{/js/public/board-content-image-fallback.js}"></script>
</head>
<body>
<th:block th:replace="~{public/fragments/site-menu :: siteMenu}"></th:block>
<div class="public-board-container">
    <div class="public-board-header">
        <h1><a th:href="@{|${sitePrefix}/boards/{board}|(board=${post.boardSlug})}" th:text="${post.boardName}">게시판</a></h1>
    </div>

    <div class="board-detail">
        <h2 class="board-detail-title" th:text="${post.title}"></h2>
        <div class="board-detail-meta">
            <span th:text="${#temporals.format(post.createDate, 'yyyy-MM-dd HH:mm')}"></span>
            <span class="board-meta-extra" th:if="${post.authorLabel != null}" th:text="${post.authorLabel}"></span>
            <span class="board-meta-extra" th:if="${post.viewCount != null}" th:text="|조회 ${post.viewCount}|"></span>
        </div>
        <!--/* 본문은 PublicPostDetail.from이 HtmlContentSanitizer로 정리한 HTML이다. 이스케이프 없는 출력은
             이 한 곳만 허용된다(PublicBoardTemplateConventionTest가 고정 — PLAN-html-editor.md 쟁점 12).
             파서 수준 주석이라 응답에 나가지 않는다. */-->
        <div class="board-detail-content" th:utext="${post.content}"></div>

        <div class="board-attachments" th:if="${not #lists.isEmpty(post.attachments)}">
            <h3 class="board-attachments-title">첨부파일</h3>
            <ul class="board-attachments-list">
                <li class="board-attachment-item" th:each="file : ${post.attachments}">
                    <a th:href="@{|${sitePrefix}/boards/{board}/posts/{postId}/attachments/{fid}|(board=${post.boardSlug}, postId=${post.id}, fid=${file.id})}"
                       th:text="${file.originalFilename}"></a>
                    <span class="board-attachment-size" th:text="${file.fileSizeText}"></span>
                </li>
            </ul>
        </div>
    </div>

    <a class="board-back-link" th:href="@{|${sitePrefix}/boards/{board}|(board=${post.boardSlug})}">&larr; 목록으로</a>
</div>
</body>
</html>
