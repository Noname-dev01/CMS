<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈</title>
    <link rel="stylesheet" th:href="@{/css/public/home.css}">
    <link rel="stylesheet" th:href="@{/css/public/site-menu.css}">
</head>
<body>
<th:block th:replace="~{public/fragments/site-menu :: siteMenu}"></th:block>
<div class="home-container">

    <!--/* 배너: 서버가 노출 여부·기간을 판정한 목록이다. 제목은 대체 텍스트로만 쓴다(th:alt는 속성 이스케이프).
         링크는 PublicBanner가 SafeUrls로 한 번 더 거른 값이라 javascript: 등은 여기까지 오지 않는다.
         첫 배너만 즉시 로딩하고 나머지는 지연 로딩한다(PLAN-public-home-banner.md R1-3). */-->
    <section class="home-banners" th:if="${not #lists.isEmpty(home.banners)}" aria-label="배너">
        <div class="home-banner" th:each="banner, stat : ${home.banners}">
            <a th:if="${banner.linkUrl != null and banner.externalLink}" th:href="${banner.linkUrl}"
               target="_blank" rel="noopener noreferrer">
                <img th:src="@{/banners/{id}/image(id=${banner.id})}" th:alt="${banner.title}"
                     th:attr="loading=${stat.index > 0} ? 'lazy' : 'eager'">
            </a>
            <a th:if="${banner.linkUrl != null and not banner.externalLink}" th:href="${banner.linkUrl}">
                <img th:src="@{/banners/{id}/image(id=${banner.id})}" th:alt="${banner.title}"
                     th:attr="loading=${stat.index > 0} ? 'lazy' : 'eager'">
            </a>
            <img th:if="${banner.linkUrl == null}" th:src="@{/banners/{id}/image(id=${banner.id})}" th:alt="${banner.title}"
                 th:attr="loading=${stat.index > 0} ? 'lazy' : 'eager'">
        </div>
    </section>

    <div class="home-sections">
        <section class="home-section" th:if="${not #lists.isEmpty(home.notices)}">
            <h2 class="home-section-title">
                <a th:href="@{|${sitePrefix}/notices|}">공지사항</a>
            </h2>
            <ul class="home-post-list">
                <li class="home-post-item" th:each="post : ${home.notices}">
                    <a th:href="@{|${sitePrefix}/boards/{board}/posts/{postId}|(board=${post.boardSlug}, postId=${post.id})}">
                        <span class="home-post-title" th:text="${post.title}"></span>
                        <span class="home-post-date" th:text="${#temporals.format(post.createDate, 'yyyy-MM-dd')}"></span>
                    </a>
                </li>
            </ul>
        </section>

        <section class="home-section" th:if="${not #lists.isEmpty(home.latestPosts)}">
            <h2 class="home-section-title">새 글</h2>
            <ul class="home-post-list">
                <li class="home-post-item" th:each="post : ${home.latestPosts}">
                    <!--/* 대표 이미지가 있는 글만 썸네일 칸을 그린다(공지 섹션은 쓰지 않는다 — 메인 한 번의 썸네일 요청을 5건 이하로 묶는다).
                         칸 자체가 자리표시 배경(아이콘)이고 안쪽 span의 CSS 배경이 썸네일을 그 위에 덮는다 — 이미지가 실패(429·404)하면 배경이 투명하게 남아 스크립트 없이도
                         자리표시가 보인다. <img>를 쓰지 않는 이유: Chromium은 alt=""여도 크기가 지정된 깨진 <img>에 깨진 아이콘을 그린다(실측, PLAN-home-cover-og-image.md D2 v3).
                         style 값은 Long 대표 이미지 id(숫자)뿐이다 — 사용자 문자열이 들어가지 않는다. 사이트 무관 경로라 sitePrefix가 없고, 대표는 그 글이 참조하는
                         이미지라 공개 판정이 글과 같다. */-->
                    <a th:href="@{|${sitePrefix}/boards/{board}/posts/{postId}|(board=${post.boardSlug}, postId=${post.id})}">
                        <span class="home-post-thumb" th:if="${post.coverImageId != null}" aria-hidden="true"><span class="home-post-thumb-img" th:style="'background-image:url(' + @{/content-images/{imageId}(imageId=${post.coverImageId}, size='thumb')} + ')'"></span></span>
                        <span class="home-post-board" th:text="${post.boardName}"></span>
                        <span class="home-post-title" th:text="${post.title}"></span>
                        <span class="home-post-date" th:text="${#temporals.format(post.createDate, 'yyyy-MM-dd')}"></span>
                    </a>
                </li>
            </ul>
        </section>
    </div>

    <!--/* 푸터: 푸터로 지정된 노출 중 정적 페이지 링크. 제목은 th:text, 슬러그는 th:href 경로 변수라 이스케이프된다.
         조회 실패 시 컨트롤러가 빈 목록으로 대체하므로 푸터만 빠진다(PLAN-static-page.md R1-3). */-->
    <footer class="home-footer" th:if="${not #lists.isEmpty(footerLinks)}">
        <a th:each="link : ${footerLinks}" th:href="@{|${sitePrefix}/pages/{slug}|(slug=${link.slug})}" th:text="${link.title}"></a>
    </footer>

    <p class="home-empty"
       th:if="${#lists.isEmpty(home.banners) and #lists.isEmpty(home.notices) and #lists.isEmpty(home.latestPosts)}">
        아직 게시된 내용이 없습니다.
    </p>
</div>

<!--/* 레이어 팝업: 별도 조각이다(PLAN-popup.md 쟁점 9). 이 파일에는 비이스케이프 출력·스크립트를 두지 않는다 — 팝업에 필요한 것은 조각의 규약 시험이 따로 고정한다. */-->
<th:block th:if="${not #lists.isEmpty(popups)}">
    <th:block th:replace="~{public/fragments/home-popups :: popups(${popups})}"></th:block>
</th:block>
</body>
</html>
