<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>429 - 요청이 너무 많습니다</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
    <div class="error-container">
        <h1>429</h1>
        <p class="error-message">요청이 너무 많습니다. 잠시 후 다시 시도해주세요.</p>
        <p class="error-description">일시적으로 접근이 제한되었습니다.</p>
        <a th:href="@{/notices}" class="home-button">홈으로 돌아가기</a>
        <div class="error-details" th:if="${timestamp}">
            <p>오류 발생 시간: <span th:text="${#dates.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
        </div>
    </div>
</body>
</html>
