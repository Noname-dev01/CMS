<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 - 잠시 후 다시 시도해주세요</title>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
    <div class="error-container">
        <h1>503</h1>
        <p class="error-message">이용자가 많아 지금은 처리할 수 없습니다. 잠시 후 다시 시도해주세요.</p>
        <p class="error-description">일시적인 현상입니다.</p>
        <a th:href="@{/}" class="home-button">홈으로 돌아가기</a>
        <div class="error-details" th:if="${timestamp}">
            <p>오류 발생 시간: <span th:text="${#dates.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
        </div>
    </div>
</body>
</html>
